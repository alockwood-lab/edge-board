    /* Venue ladder: every venue on this market, best to worst. */
    /* Trimmed from 15 columns to 12. CLUSTER moves into the venue cell's
       title, and SE/LIMIT already appear in the panels below, so the verdict
       stops being pushed off the right edge on a normal window. */
    /* Key-driven columns. The previous version kept a hand-written header
       list and a hand-written cell list in parallel, which is how the
       drill-down ended up showing consensus headers over a wall of dashes
       while the board had already been fixed. One definition now drives
       both, and a column that cannot carry a number is not emitted. */
    const hasRef = rows.some(r => r.refEV !== null && r.refEV !== undefined && isFinite(r.refEV));
    const hasCons = rows.some(r => r.nClusters >= 3 && isFinite(r.ep));
    const hasNet = rows.some(r => Math.abs(r.dNet - r.dGross) > 1e-9);
    const G = VB.views.GLOSS;

    const COLDEF = [
      { k:'venue', label:'VENUE', tip:G.venue, on:true, cell:(r) =>
          h('span', { class:'vcell' }, [VB.dom.venueChip(r.venueId, 18),
            h('span', {}, r.venueName)]) },
      { k:'tier', label:'TIER', on:true, tip:'T1 venues are sharp references that anchor a consensus. With no T1 venue present no fair price is produced at all.',
        cell:(r) => h('span', { class:'tag' + (r.venueTier === 1 ? ' t1' : '') }, 'T' + r.venueTier) },
      { k:'side', label:'SIDE', tip:G.side, on:true, cell:(r) => trunc(String(r.side), 14) },
      { k:'price', label:'PRICE', tip:G.dGross, on:true, r:true, cell:(r) =>
          h('span', { class:'oddspill' }, price(r.dGross)) },
      { k:'net', label:'NET', on:hasNet, r:true,
        tip:'The price after this venue\'s commission or per-contract fee. This is the only price used for EV — a fee-blind comparison invents edge that does not exist.',
        cell:(r) => price(r.dNet) },
      { k:'qo', label:'q_o', tip:G.qo, on:true, r:true, cell:(r) =>
          isFinite(r.qo) ? (r.qo * 100).toFixed(1) + '%' : '--' },
      { k:'refFair', label:'REF FAIR', tip:G.refFair, on:hasRef, r:true, cell:(r) =>
          (r.refFair !== null && r.refFair !== undefined && isFinite(r.refFair))
            ? (r.refFair * 100).toFixed(1) + '%' : '--' },
      { k:'refPush', label:'PUSH', on:hasRef && rows.some(r => r.refPush > 0), r:true,
        tip:'Probability the game lands exactly on the line, in which case the stake is returned. Only non-zero on whole-number lines.',
        cell:(r) => (r.refPush > 0 ? (r.refPush * 100).toFixed(1) + '%' : '—') },
      { k:'refEV', label:'REF EV%', tip:G.refEV, on:hasRef, r:true, cls:(r) => cls(r.refEV),
        cell:(r) => (r.refEV !== null && r.refEV !== undefined && isFinite(r.refEV))
            ? sgn(r.refEV * 100, 2) : '--' },
      { k:'pFair', label:'p_c (LOCO)', tip:G.pFair, on:hasCons, r:true, cell:(r) =>
          isFinite(r.pFair) ? (r.pFair * 100).toFixed(1) + '%' : '--' },
      { k:'ep', label:'EDGE pp', tip:G.ep, on:hasCons, r:true, cls:(r) => cls(r.ep),
        cell:(r) => isFinite(r.ep) ? sgn(r.ep * 100, 2) : '--' },
      { k:'evNet', label:'EV%', tip:G.evNet, on:hasCons, r:true, cls:(r) => cls(r.evNet),
        cell:(r) => isFinite(r.evNet) ? sgn(r.evNet * 100, 2) : '--' },
      { k:'t', label:'t', tip:G.t, on:hasCons, r:true, cell:(r) =>
          isFinite(r.t) ? sgn(r.t, 1) : '--' },
      { k:'age', label:'AGE', tip:G.ageSec, on:true, r:true,
        cls:(r) => (r.verdict === 'AGED' ? 'warn' : ''), cell:(r) => ago(r.ageSec) },
      { k:'verdict', label:'VERDICT', tip:G.verdict, on:true, vd:true, cell:(r) =>
          h('span', { class:'vd vd-' + r.verdict.replace(' ', '') }, r.verdict) }
    ].filter(c => c.on);

    const tb = h('tbody');
    const sorted = rows.slice().sort((x, y) => {
      const a2 = isFinite(x.refEV) ? x.refEV : (isFinite(x.ep) ? x.ep : -99);
      const b2 = isFinite(y.refEV) ? y.refEV : (isFinite(y.ep) ? y.ep : -99);
      return b2 - a2;
    });
    for (const r of sorted) {
      const vd = r.verdict.replace(' ', '');
      const tr = h('tr', { class:'v-' + vd, title:'cluster: ' + r.cluster });
      for (const c of COLDEF) {
        const td = h('td', { class: (c.r ? 'r ' : '') + (c.vd ? 'vdcell ' : '') +
                                    (c.cls ? c.cls(r) : '') });
        const v = c.cell(r);
        if (v === null || v === undefined) td.textContent = '--';
        else if (typeof v === 'object') td.appendChild(v);
        else td.textContent = String(v);
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }

    const isLive = rows.some(r => r.srcId !== 'demo');
    /* ANSWER FIRST. */
    wrap.appendChild(VB.answer.tile(m, rows, VB.store.get().settings));

    /* Then the evidence, collapsed. */
    const detTable = h('details', { class:'ev' });
    detTable.appendChild(h('summary', {},
      'All ' + new Set(rows.map(r => r.venueId)).size + ' book prices, side by side'));
    detTable.appendChild(h('table', {}, [
      h('caption', {}, (isLive ? 'LIVE · real prices, fetched this session'
                               : 'synthetic prices') +
        ' · every venue quoting this market' +
        (hasCons ? '' : (hasRef ? ' · priced against the exchange reference'
                                : ' · no fair price: 1 book quoting'))),
      h('thead', {}, h('tr', {}, COLDEF.map(c => {
        const th = h('th', { class: (c.r ? 'r' : '') + (c.vd ? ' vdcell' : '') +
                                    (c.tip ? ' hasgloss' : ''),
          'data-tip': c.tip || null, tabindex: c.tip ? '0' : null });
        th.appendChild(h('span', { class: c.tip ? 'gl' : '' }, c.label));
        return th;
      }))), tb]));
    wrap.appendChild(detTable);

    /* ONE BOOK IS NOT NO INFORMATION.
       The whole analytical section used to be gated behind a consensus, so a
       real single-venue market rendered as two rows and a wall of dashes.
       But from one book alone you can compute exactly: its two-sided book
       sum, its hold, its own de-vigged opinion under every method, and the
       fair price that opinion implies. That is the single most useful thing
       to know about a price you are being offered, and it needs no consensus
       at all. */
    const byVenue = {};
    for (const r of rows) (byVenue[r.venueId] = byVenue[r.venueId] || []).push(r);
    const solo = h('div', { class:'cols', style:'margin-top:10px' });
    for (const vid in byVenue) {
      const vr = byVenue[vid];
      if (vr.length !== m.outcomes.length) continue;
      const ds = [];
      for (let i = 0; i < m.outcomes.length; i++) {
        const row = vr.find(x => String(x.side) === String(m.outcomes[i]));
        if (!row) break;
        ds.push(row.dGross);
      }
      if (ds.length !== m.outcomes.length) continue;
      const S = VB.odds.bookSum(ds), hold = VB.odds.hold(ds);
      const md = vr[0].methodProbs ? null : null;
      const panel = h('div', { class:'panel' });
      panel.appendChild(h('h2', {}, 'What ' + vr[0].venueName + ' is charging'));
      const dl = h('dl', { class:'kv' });
      const add = (k, v, c) => { dl.appendChild(h('dt', {}, k));
                                 dl.appendChild(h('dd', { class:c || null }, v)); };
      m.outcomes.forEach((o, i) => add('offered · ' + o,
        price(ds[i]) + '  (' + (100 / ds[i]).toFixed(1) + '%)'));
      add('book sum', S.toFixed(4));
      add('hold / vig', (hold * 100).toFixed(2) + '%', hold > 0.05 ? 'warn' : null);
      /* De-vig this venue against itself: that is its OPINION, and it is
         exactly computable without any second venue. */
      const dv = VB.devig.medianDevig(ds);
      m.outcomes.forEach((o, i) => add('their fair · ' + o,
        (dv.p[i] * 100).toFixed(1) + '%  →  ' + price(1 / dv.p[i])));
      add('method spread', (Math.max.apply(null, dv.spread) * 100).toFixed(2) + 'pp');
      panel.appendChild(dl);
      panel.appendChild(h('div', { class:'small muted', style:'margin-top:6px' },
        'Hold is what this book keeps if money is balanced — computable from a ' +
        'single snapshot, no consensus required. "Their fair" strips that margin ' +
        'out to show the probability this book is actually implying, which is the ' +
        'price you would need elsewhere to beat it.'));
      const dlink = vr.find(x => x.deepLink) || (m.quotes || []).find(q => q.deepLink);
      if (dlink && dlink.deepLink) panel.appendChild(h('div', { class:'small', style:'margin-top:6px' },
        'A bet-slip link for this market was supplied by the feed.'));
      solo.appendChild(panel);
    }

    /* Reference comparison, when the exchange brackets or matches this line. */
    const refRow = rows.find(r => r.refEV !== null && r.refEV !== undefined && isFinite(r.refEV));
    if (refRow) {
      const rp = h('div', { class:'panel' });
      rp.appendChild(h('h2', {}, 'Measured against the exchange'));
      const dl2 = h('dl', { class:'kv' });
      const a2 = (k, v, c) => { dl2.appendChild(h('dt', {}, k));
                                dl2.appendChild(h('dd', { class:c || null }, v)); };
      for (const r of rows) {
        if (r.refEV === null || r.refEV === undefined || !isFinite(r.refEV)) continue;
        a2(String(r.side) + ' @ ' + price(r.dGross),
           'fair ' + (r.refFair * 100).toFixed(1) + '%  ·  EV ' + sgn(r.refEV * 100, 2) + '%',
           cls(r.refEV));
      }
      if (refRow.refPush) a2('push probability', (refRow.refPush * 100).toFixed(1) + '%');
      a2('method', refRow.refMethod);
      rp.appendChild(dl2);
      rp.appendChild(h('div', { class:'small muted', style:'margin-top:6px' }, refRow.refNote +
        '. This is a TWO-VENUE reference comparison against an order book, not a ' +
        'consensus — a weaker claim than a 3-cluster fair price, and treated as one.'));
      solo.appendChild(rp);
    }

    /* Say plainly what is missing and what would fix it. */
    if (!(best && isFinite(best.ep))) {
      const gap = h('div', { class:'panel' });
      gap.appendChild(h('h2', {}, 'Why there is no fair price'));
      const nCl = new Set(rows.map(r => r.cluster)).size;
      gap.appendChild(h('div', {}, nCl + ' independent ' + (nCl === 1 ? 'cluster' : 'clusters') +
        ' quote this market. A consensus fair price requires 3, plus at least one ' +
        'sharp reference venue.'));
      gap.appendChild(h('div', { class:'small muted', style:'margin-top:6px' },
        'With one book there is nothing to disagree with it, so an "edge" would just ' +
        'be that book\'s own vig read backwards. The columns above are everything that ' +
        'IS computable from a single venue; the consensus columns stay blank rather ' +
        'than being filled with a number that has no second opinion behind it.'));
      gap.appendChild(h('div', { class:'small', style:'margin-top:7px' },
        'What unlocks the rest: an Odds API key returns 10–20 books in one call. ' +
        'Settings → Live data.'));
      solo.appendChild(gap);
    }
    if (solo.childNodes.length) {
      const detP = h('details', { class:'ev' });
      detP.appendChild(h('summary', {}, 'How these numbers were built'));
      detP.appendChild(solo);
      wrap.appendChild(detP);
    }

    /* The full audit trail, only when a genuine consensus exists. */
    if (best && isFinite(best.ep)) {
      const cards = h('div', { class:'cols', style:'margin-top:10px' });
      const meth = h('div', { class:'panel' });
      meth.appendChild(h('h2', {}, 'How the fair price was built'));
      meth.appendChild(h('div', { class:'small muted', style:'margin-bottom:6px' },
        'De-vigging is not identified from data — it is a modelling assumption. All applicable ' +
        'methods are computed and the MEDIAN is used, so the number on the board is consistent ' +
        'with the gate that guards it.'));
      const dl = h('dl', { class:'kv' });
      if (best.methodProbs) {
        const ix = m.outcomes.indexOf(best.side);
        for (const name of best.methodNames) {
          dl.appendChild(h('dt', {}, name));
          dl.appendChild(h('dd', {}, best.methodProbs[name][ix].toFixed(5)));
        }
        const vals = best.methodNames.map(n => best.methodProbs[n][m.outcomes.indexOf(best.side)]);
        dl.appendChild(h('dt', {}, 'method spread'));
        dl.appendChild(h('dd', {}, ((Math.max.apply(null, vals) - Math.min.apply(null, vals)) * 100).toFixed(3) + 'pp'));
      } else {
        dl.appendChild(h('dt', {}, 'order-book mid'));
        dl.appendChild(h('dd', {}, 'not de-vigged'));
      }
      dl.appendChild(h('dt', {}, 'consensus (excl. cluster)'));
      dl.appendChild(h('dd', {}, best.pFair.toFixed(5)));
      dl.appendChild(h('dt', {}, 'all-venue consensus'));
      dl.appendChild(h('dd', {}, isFinite(best.pFairAll) ? best.pFairAll.toFixed(5) : '--'));
      dl.appendChild(h('dt', {}, 'clusters voting'));
      dl.appendChild(h('dd', {}, best.nClusters + ' (V_eff ' + best.vEff.toFixed(2) + ')'));
      dl.appendChild(h('dt', {}, 'sharp anchor present'));
      dl.appendChild(h('dd', {}, best.hasT1 ? 'yes' : 'NO — no fair line'));
      meth.appendChild(dl);
      cards.appendChild(meth);

      const err = h('div', { class:'panel' });
      err.appendChild(h('h2', {}, 'Error budget and the noise line'));
      const dl2 = h('dl', { class:'kv' });
      const add = (k, v) => { dl2.appendChild(h('dt', {}, k)); dl2.appendChild(h('dd', {}, v)); };
      add('sampling SE', (best.seSamp * 100).toFixed(3) + 'pp');
      add('de-vig bias (floor)', (VB.consensus.B_DEVIG * 100).toFixed(2) + 'pp');
      add('staleness bias', (best.bStale * 100).toFixed(3) + 'pp');
      add('SE total', (best.seTotal * 100).toFixed(3) + 'pp');
      add('edge', sgn(best.ep * 100, 2) + 'pp');
      add('t = edge / SE', sgn(best.t, 2));
      add('markets evaluated (M)', VB.model.get().nEval.toLocaleString());
      add('a(M)', MU.a(VB.model.get().nEval).toFixed(3));
      add('noise line e_crit', (best.eCrit * 100).toFixed(2) + 'pp');
      add('edge after noise', sgn(best.eAdj * 100, 2) + 'pp');
      err.appendChild(dl2);
      err.appendChild(h('div', { class:'small muted', style:'margin-top:6px' },
        'The maximum of many noisy estimates looks exactly like edge. e_crit is the edge a ' +
        'scan this size produces from pure noise alone.'));
      cards.appendChild(err);

      const stk = h('div', { class:'panel' });
      stk.appendChild(h('h2', {}, 'Sizing chain'));
      if (!st.bankroll) stk.appendChild(h('div', { class:'note w' }, 'Set bankroll and unit to size this.'));
      else {
        const z = K.size({ pFair:best.pFair, dNet:best.dNet, unitUsd:st.unitUsd,
                           bankroll:st.bankroll, lambda:st.lambda, R:st.R });
        const dl3 = h('dl', { class:'kv' });
        const a3 = (k, v) => { dl3.appendChild(h('dt', {}, k)); dl3.appendChild(h('dd', {}, v)); };
        a3('EV net', sgn(z.evNet * 100, 2) + '%');
        a3('f Kelly', (z.fKelly * 100).toFixed(4) + '%');
        a3('× R ' + st.R + ' (reliability)', (z.fDebiased * 100).toFixed(4) + '%');
        a3('× λ ' + st.lambda + ' (risk level)', (z.fFinal * 100).toFixed(4) + '%');
        a3('units raw', z.uRaw.toFixed(4));
        a3('rung', z.rung.toFixed(2) + 'u');
        a3('amount', z.rung ? money(z.rung * st.unitUsd, 2) : '—');
        stk.appendChild(dl3);
        if (best.verdict !== 'BET' && z.rung > 0) stk.appendChild(h('div', { class:'note' },
          'Would size ' + z.rung.toFixed(2) + 'u / ' + money(z.rung * st.unitUsd, 2) +
          ' if it cleared the gates. It does not: ' + best.why + '.'));
      }
      cards.appendChild(stk);
      const detA = h('details', { class:'ev' });
      detA.appendChild(h('summary', {}, 'Full audit trail — devig methods, error budget, sizing chain'));
      detA.appendChild(cards);
      wrap.appendChild(detA);

      /* Line movement: the only honest check that an edge is real rather
         than a stale quote. Synthesized from the seeded walk. */
      const rng = VB.util.mulberry32(VB.util.xmur3('walk:' + m.id)());
      const pts1 = [], pts2 = [];
      let a = best.pFair, b = best.qo;
      for (let i = 0; i < 24; i++) {
        a += (VB.util.gauss(rng)) * 0.004; b += (VB.util.gauss(rng)) * 0.005;
        pts1.push(a); pts2.push(b);
      }
      pts1.push(best.pFair); pts2.push(best.qo);
      const mv = h('div', { class:'panel' });
      mv.appendChild(h('h2', {}, 'Line movement, 24h — consensus fair vs best offered'));
      mv.appendChild(VB.charts.movement([
        { pts:pts1, colour:'#00897b', label:'fair' },
        { pts:pts2, colour:'#b8860b', label:'offer' }], 460, 74));
      mv.appendChild(h('div', { class:'small muted' },
        'Two series, one axis. If the offer has not followed the consensus, the edge is either ' +
        'real or the quote is stale — the AGE column tells you which.'));
      wrap.appendChild(mv);
    }
    return wrap;
  }

  /* ---------------------------------------------------------- leaderboard */
  function leaderboard() {
    const M = VB.model.get(), wrap = h('div');
    wrap.appendChild(h('h1', {}, 'Book comparison'));

    /* WHAT A LIVE SNAPSHOT CAN AND CANNOT MEASURE.
       Closing-line accuracy, Brier and calibration all need observed history
       -- closes captured over weeks. This build carries no synthetic history,
       so those columns are absent rather than fabricated.
       What a single snapshot measures EXACTLY, with no history at all, is
       hold: the book's own theoretical margin. That was always the closest
       honest answer to "which book is most successful" anyway -- a book's
       profit comes from its customers' mistakes, and the most successful book
       is the one you should least want to bet at. */
    wrap.appendChild(h('div', { class:'note' },
      'Measured live from the current snapshot. Hold is the book\'s own margin and is ' +
      'exact from one observation — it is also the honest answer to which book is most ' +
      'successful: the higher the hold, the more it keeps, and the worse a place it is ' +
      'to bet. Closing-line accuracy, Brier and calibration need weeks of captured ' +
      'closes and are therefore absent rather than estimated.'));

    /* Per-venue hold and coverage, computed from the live rows. */
    const agg = {};
    const rows = (M.rows || []);
    const seenMarket = {};
    for (const id in M.byMarket) {
      const bag = M.byMarket[id];
      const nOut = bag.market.outcomes.length;
      const byV = {};
      for (const r of bag.rows) (byV[r.venueId] = byV[r.venueId] || []).push(r);
      for (const vid in byV) {
        const set = byV[vid];
        if (set.length !== nOut) continue;
        const ds = [];
        for (const o of bag.market.outcomes) {
          const rr = set.find(x => String(x.side) === String(o));
          if (rr) ds.push(rr.dGross);
        }
        if (ds.length !== nOut) continue;
        const a = agg[vid] = agg[vid] || { n:0, holdSum:0, mk:0, cats:{}, best:0 };
        a.n++; a.holdSum += VB.odds.hold(ds);
        a.cats[bag.market.cat] = 1;
      }
      seenMarket[id] = 1;
    }
    const totalMarkets = Object.keys(seenMarket).length;
    /* Best-price frequency: how often this book has the best net price on an
       outcome. Also exact from a snapshot, and directly answers "where should
       I actually bet". */
    const bestCount = {};
    for (const id in M.byMarket) {
      const bag = M.byMarket[id];
      for (const o of bag.market.outcomes) {
        let bestR = null;
        for (const r of bag.rows) {
          if (String(r.side) !== String(o)) continue;
          if (!bestR || r.dNet > bestR.dNet) bestR = r;
        }
        if (bestR) bestCount[bestR.venueId] = (bestCount[bestR.venueId] || 0) + 1;
      }
    }
    const list = Object.keys(agg).map(vid => {
      const v = M.venues[vid] || { name: vid, tier: 3 };
      const a = agg[vid];
      return { vid, name: v.name, tier: v.tier, cluster: v.cluster,
               hold: a.holdSum / a.n, nMarkets: a.n,
               cats: Object.keys(a.cats).length,
               coverage: totalMarkets ? a.n / totalMarkets : 0,
               best: bestCount[vid] || 0,
               accessible: !!v.accessible, fee: v.fee };
    }).sort((x, y) => x.hold - y.hold);

    if (!list.length) {
      wrap.appendChild(h('div', { class:'empty' }, [
        h('b', {}, 'No books quoting yet.'),
        'The live feed has not returned a complete two-sided market. Nothing is ' +
        'estimated in its place.']));
      return wrap;
    }
    const tb = h('tbody');
    list.forEach((r, i) => {
      tb.appendChild(h('tr', {}, [
        h('td', { class:'r' }, String(i + 1)),
        h('td', { class:'k' }, h('span', { class:'vcell' },
          [VB.dom.venueChip(r.vid, 18), h('span', {}, r.name)])),
        h('td', {}, h('span', { class:'tag' + (r.tier === 1 ? ' t1' : '') }, 'T' + r.tier)),
        h('td', { class:'r ' + (r.hold > 0.055 ? 'neg' : r.hold < 0.03 ? 'pos' : '') },
          (r.hold * 100).toFixed(2) + '%'),
        h('td', { class:'r' }, r.nMarkets.toLocaleString()),
        h('td', { class:'r' }, String(r.cats)),
        h('td', { class:'r' }, r.best.toLocaleString()),
        h('td', {}, r.accessible ? h('span', { class:'pos' }, '✓ marked')
                                 : h('span', { class:'muted' }, '— not marked')),
        h('td', { class:'small muted' }, r.fee ? r.fee.type : 'spread only')
      ]));
    });
    wrap.appendChild(h('table', {}, [
      h('caption', {}, 'LIVE · measured from ' + totalMarkets.toLocaleString() +
        ' markets in the current snapshot · sorted cheapest first'),
      h('thead', {}, h('tr', {}, [
        ['#', null], ['BOOK', null], ['TIER', 'T1 venues are sharp references that anchor a consensus.'],
        ['HOLD', 'The book\'s theoretical margin on a complete two-sided market: 1 − 1/Σ(1/decimal odds). Exact from a single snapshot. Lower is cheaper for you; higher means the book keeps more.'],
        ['MARKETS', 'Complete two-sided markets this book is quoting right now.'],
        ['SPORTS', 'Distinct categories covered.'],
        ['BEST PRICE', 'How many outcomes this book currently has the best net price on. Directly answers where to place the bet.'],
        ['MY ACCOUNT', 'Whether you have marked an account here, in Settings.'],
        ['FEES', 'Commission or per-contract fee model, if any.']
      ].map((c, i) => {
        const th = h('th', { class: (i >= 3 && i <= 6) ? 'r' : '',
          'data-tip': c[1] || null, tabindex: c[1] ? '0' : null });
        th.appendChild(h('span', { class: c[1] ? 'gl' : '' }, c[0]));
        return th;
      }))), tb]));
    wrap.appendChild(h('div', { class:'note w' },
      'One book cannot be ranked against itself. With a single venue quoting, HOLD and ' +
      'BEST PRICE are still exact, but there is no relative comparison to make — that ' +
      'needs a multi-book feed.'));
    return wrap;
  }

  const clusterSize = (rows, cl) => rows.filter(r => r.venue.cluster === cl).length;
  return { market, leaderboard };
})();

/* ------------------------------------------------- L4  the answer tile */
VB.answer = (function () {
  const { h, sgn, cls, money, ago, until, sideLabel, poss, plural } = VB.dom;
  const O = VB.odds;
  const price = (d) => O.fmtAmerican(O.decimalToAmerican(d));

  /* Nobody wants to read a 21-row venue table to find out whether to bet.
     They want the answer, then the evidence if they choose to look. So the
     drill-down leads with a verdict, one plain sentence, and a per-side grid
     of consensus-fair against best-available -- and everything else
     collapses behind it. */

  /* One book quoting a complete market is not nothing. Its own prices with
     its margin removed are its honest opinion of the game. That is NOT a
     consensus and it CANNOT produce an edge -- a book's price measured
     against its own de-vigged line is zero by construction -- but it is the
     difference between an empty tile and a number, so it is shown, labelled
     as the book's own line, and the Edge column is left blank on purpose. */
  function bookOwnFair(market, rows) {
    const outs = market.outcomes;
    const byV = {};
    for (const r of rows) (byV[r.venueId] = byV[r.venueId] || []).push(r);
    let pick = null;
    for (const vid in byV) {
      const set = byV[vid];
      if (set.length !== outs.length) continue;
      const ds = outs.map(o => {
        const x = set.find(y => String(y.side) === String(o));
        return x && isFinite(x.dGross) ? x.dGross : null;
      });
      if (ds.some(x => x === null)) continue;
      /* Prefer the sharpest book present; its margin is thinnest, so its
         de-vigged line is the least distorted single-book estimate. */
      const hd = O.hold(ds);
      if (!pick || hd < pick.hold) {
        pick = { set, ds, hold: hd, venueId: set[0].venueId, venueName: set[0].venueName };
      }
    }
    if (!pick) return null;
    let dv;
    try { dv = VB.devig.medianDevig(pick.ds); } catch (e) { return null; }
    if (!dv || !dv.p || dv.p.some(x => !isFinite(x))) return null;
    const map = {};
    outs.forEach((o, i) => { map[String(o)] = dv.p[i]; });
    return { map, hold: pick.hold, venueId: pick.venueId, venueName: pick.venueName };
  }

  function summarise(market, rows) {
    const outs = market.outcomes;
    const bookFair = bookOwnFair(market, rows);
    const per = outs.map((side) => {
      const set = rows.filter(r => String(r.side) === String(side));
      if (!set.length) return null;
      /* Consensus fair, taken from any row that has one -- p_c is a property
         of the market and the venue set, not of the row. */
      const withC = set.find(r => isFinite(r.pFair) && r.nClusters >= 3);
      const pFair = withC ? withC.pFair : null;
      const refRow = set.find(r => r.refFair !== null && r.refFair !== undefined
                                   && isFinite(r.refFair));
      let best = null;
      for (const r of set) if (!best || r.dNet > best.dNet) best = r;
      const ownP = bookFair ? bookFair.map[String(side)] : undefined;
      const fairP = pFair !== null ? pFair
                  : refRow ? refRow.refFair
                  : (isFinite(ownP) ? ownP : null);
      const fairSrc = pFair !== null ? 'consensus'
                    : refRow ? 'exchange'
                    : (isFinite(ownP) ? 'book' : null);
      /* A single book's own de-vigged line is circular against its own
         price, so no edge is reported for it -- showing ~0.00pp there would
         read as "fairly priced", which is a claim the data cannot support. */
      const measurable = fairP !== null && best && fairSrc !== 'book';
      const edge = measurable ? fairP - (1 / best.dNet) : null;
      const ev = measurable ? fairP * best.dNet - 1 : null;
      const bet = set.find(r => r.verdict === 'BET');
      const nc = set[0] ? set[0].nClusters : undefined;
      return { side, pFair: fairP, fairSrc, best, edge, ev, bet,
               nVenues: new Set(set.map(r => r.venueId)).size,
               clusters: withC ? withC.nClusters : (isFinite(nc) ? nc : 0) };
    }).filter(Boolean);

    /* Average two-sided hold across venues quoting a complete book. */
    const byV = {};
    for (const r of rows) (byV[r.venueId] = byV[r.venueId] || []).push(r);
    let holdSum = 0, holdN = 0;
    for (const vid in byV) {
      const set = byV[vid];
      if (set.length !== outs.length) continue;
      const ds = outs.map(o => { const x = set.find(y => String(y.side) === String(o));
                                 return x ? x.dGross : null; });
      if (ds.some(x => x === null)) continue;
      holdSum += O.hold(ds); holdN++;
    }
    const bestBook = outs.map((o, i) => per[i] && per[i].best ? 1 / per[i].best.dNet : null);
    const bestSum = bestBook.every(x => x !== null)
      ? bestBook.reduce((a, b) => a + b, 0) : null;
    return { per, avgHold: holdN ? holdSum / holdN : null, bookFair,
             nVenues: Object.keys(byV).length,
             bestSum, bestHold: bestSum !== null ? 1 - 1 / bestSum : null };
  }

  function tile(market, rows, settings) {
    const s = summarise(market, rows);
    const winner = s.per.find(p => p.bet);
    const anyJudged = s.per.some(p => p.edge !== null);
    const box = h('div', { class:'answer' +
      (winner ? ' yes' : anyJudged ? '' : ' na') });

    /* --- the headline --- */
    const head = h('div', { class:'ahead' });
    if (winner) {
      head.appendChild(h('span', { class:'averdict yes' }, 'BET'));
      head.appendChild(h('span', { class:'aline' },
        sideLabel(market, winner.side) + ' ' + price(winner.bet.dGross) +
        ' at ' + winner.bet.venueName));
    } else {
      const judged = s.per.some(p => p.edge !== null);
      head.appendChild(h('span', { class:'averdict ' + (judged ? 'no' : 'na') },
        judged ? 'NO BET' : 'NO CALL'));
      /* Name the closest miss and exactly what price would change the answer.
         "No bet" alone is useless; "no bet, and here is the number you need"
         is a shopping instruction. */
      const cand = s.per.filter(p => p.edge !== null)
        .sort((a, b) => (b.edge || -9) - (a.edge || -9))[0];
      if (cand && cand.best) {
        const needD = 1 / cand.pFair;
        head.appendChild(h('span', { class:'aline' },
          sideLabel(market, cand.side) + ' is worth ' + price(needD) +
          '; best available is ' + price(cand.best.dNet) + ' at ' + cand.best.venueName));
      } else if (s.bookFair) {
        /* No consensus, but the one book present has a complete two-way
           market, so there is a real number to lead with. */
        const p0 = s.per[0];
        head.appendChild(h('span', { class:'aline' },
          s.nVenues === 1 ? s.bookFair.venueName + ' is the only book quoting this — ' +
            sideLabel(market, p0.side) + ' is ' + price(p0.best.dGross) + ', worth ' +
            price(1 / p0.pFair) + ' on its own de-vigged line'
          : 'only ' + s.nVenues + ' books quoting this — not enough to price against'));
      } else {
        head.appendChild(h('span', { class:'aline' },
          'no complete two-way market from any of the ' + s.nVenues + ' books quoting this'));
      }
    }
    box.appendChild(head);

    /* --- one plain sentence --- */
    const cand = s.per.filter(p => p.edge !== null)
      .sort((a, b) => (b.edge || -9) - (a.edge || -9))[0];
    let sentence;
    if (winner) {
      sentence = 'Consensus fair is ' + price(1 / winner.pFair) + ' and you can get ' +
        price(winner.bet.dGross) + ' — an edge of ' + sgn(winner.edge * 100, 2) +
        'pp, EV ' + sgn(winner.ev * 100, 2) + '%. Recommended stake ' +
        (winner.bet.rung || 0).toFixed(2) + 'u' +
        (winner.bet.amount ? ' (' + money(winner.bet.amount, 2) + ')' : '') + '.';
    } else if (cand && cand.best && cand.pFair !== null) {
      const gapPP = Math.abs(cand.edge * 100);
      const need = price(1 / cand.pFair);
      sentence = 'The ' + s.nVenues + ' books quoting this market agree closely. The nearest ' +
        'thing to value is ' + sideLabel(market, cand.side) + ' at ' + price(cand.best.dNet) + ' (' +
        cand.best.venueName + '), which is ' + gapPP.toFixed(2) + 'pp ' +
        (cand.edge >= 0 ? 'better than' : 'short of') + ' the ' + cand.fairSrc +
        ' fair price of ' + need + '. You would need ' + need + ' or better to have an edge.';
    } else if (s.bookFair) {
      const S2 = VB.store.get();
      const hasKey = !!(S2.keys && S2.keys.oddsapi);
      /* "One book" has three different causes and they need three different
         sentences. Saying "add a key" to someone who has one, or "refresh"
         to someone looking at a league the key was never spent on, reads as
         the app being broken when it is doing exactly what it was told. */
      const covered = (VB.model.ODDS_DEFAULT || []);
      const inCovered = covered.indexOf(market.cat) >= 0;
      sentence = 'A fair price needs at least 3 independent book groups; this market has ' +
        s.nVenues + '. The Fair column is ' + poss(s.bookFair.venueName) + ' own line with its ' +
        (s.bookFair.hold * 100).toFixed(2) + '% margin removed — it is what that book thinks, ' +
        'not whether the price is good, so no edge is shown. ' +
        (!hasKey
          ? 'Add a free multi-book key in Settings to price this against 20+ books.'
          : !inCovered
          ? 'Multi-book pricing is bought one league at a time to stay inside the free ' +
            'plan\'s 500 credits a month, and it currently covers ' + covered.join(' and ') +
            '. ' + market.cat + ' shows the free feed only, which is one book. Add ' +
            market.cat + ' in Settings → Live data if you want to spend credits on it.'
          : 'Use Refresh odds in Settings to pull the other books now.');
    } else {
      sentence = 'Not enough independent books quote this market to build a fair price, so ' +
        'no edge can be measured. Every price below is real; none of them can be judged.';
    }
    box.appendChild(h('div', { class:'asent' }, sentence));

    /* --- per-side grid: fair vs best available, side by side --- */
    const grid = h('div', { class:'agrid' });
    grid.appendChild(h('div', { class:'ah' }, ''));
    const fairSrcs = s.per.map(p => p.fairSrc).filter(Boolean);
    const allBook = fairSrcs.length && fairSrcs.every(x => x === 'book');
    grid.appendChild(h('div', { class:'ah' },
      allBook ? "Fair (that book's own)" : 'Fair'));
    grid.appendChild(h('div', { class:'ah' }, 'Best available'));
    grid.appendChild(h('div', { class:'ah' }, 'Edge'));
    for (const p of s.per) {
      grid.appendChild(h('div', { class:'an' }, sideLabel(market, p.side)));
      grid.appendChild(h('div', { class:'av' },
        p.pFair !== null ? price(1 / p.pFair) : '—'));
      const bcell = h('div', { class:'av' });
      if (p.best) {
        bcell.appendChild(h('span', { class:'oddspill' + (p.bet ? ' bet' : '') },
          price(p.best.dNet)));
        bcell.appendChild(h('span', { class:'abook' },
          [VB.dom.venueChip(p.best.venueId, 18), h('span', {}, p.best.venueName)]));
      } else bcell.textContent = '—';
      grid.appendChild(bcell);
      grid.appendChild(h('div', { class:'av ' + (p.edge === null ? 'muted' : cls(p.edge)) },
        p.edge === null ? '—' : sgn(p.edge * 100, 2) + 'pp'));
    }
    box.appendChild(grid);

    /* --- market footer: what shopping the best price is worth --- */
    const foot = [];
    foot.push(plural(s.nVenues, 'book'));
    if (s.avgHold !== null) foot.push('average hold ' + (s.avgHold * 100).toFixed(2) + '%');
    if (s.bestHold !== null) foot.push('best-price hold ' + (s.bestHold * 100).toFixed(2) + '%');
    if (s.avgHold !== null && s.bestHold !== null) {
      foot.push('shopping saves ' + ((s.avgHold - s.bestHold) * 100).toFixed(2) + 'pp');
    }
    const ages = rows.map(r => r.ageSec).filter(isFinite);
    if (ages.length) foot.push('prices ' + ago(Math.min.apply(null, ages)) + ' old');
    box.appendChild(h('div', { class:'afoot' }, foot.join('  ·  ')));
    return box;
  }
  return { tile, summarise };
})();

/* ============ L4  review, slip, settings, ask, modal, router =========== */
VB.views3 = (function () {
  const { h, clear, sgn, cls, money, ago, until, glyph } = VB.dom;
  const K = VB.stake, V = VB.views, price = V.price, trunc = V.trunc;

  /* ------------------------------------------------------------- review */
  function review() {
    const M = VB.model.get(), wrap = h('div');
    wrap.appendChild(h('h1', {}, 'Review queue'));
    wrap.appendChild(h('div', { class:'sub' },
      'Everything the engine refused to price or refused to trust. Nothing here can be staked.'));

    const pend = M.slate.markets.filter(m => m.pairConfidence < 1);
    wrap.appendChild(h('h2', {}, 'Unconfirmed pairings (' + pend.length + ')'));
    if (!pend.length) wrap.appendChild(h('div', { class:'small muted' }, 'None.'));
    else {
      const tb = h('tbody');
      for (const m of pend) {
        const rows = M.byMarket[m.id] ? M.byMarket[m.id].rows : [];
        const bestEp = Math.max.apply(null, rows.map(r => isFinite(r.ep) ? r.ep : -9).concat([-9]));
        tb.appendChild(h('tr', {}, [
          h('td', { class:'k' }, m.eventLabel),
          h('td', {}, m.cat), h('td', {}, m.marketLabel),
          h('td', { class:'r warn' }, m.pairConfidence.toFixed(2)),
          h('td', { class:'r ' + cls(bestEp) }, bestEp > -9 ? sgn(bestEp * 100, 2) + 'pp' : '--'),
          h('td', { class:'small' }, m.mismapNote || 'below 0.90 auto-link threshold'),
          h('td', { class:'vd vd-SUSPECT' }, 'EXCLUDED')
        ]));
      }
      wrap.appendChild(h('table', {}, [
        h('caption', {}, 'A confident-looking edge that depends on a fuzzy match is a bug report waiting to happen'),
        h('thead', {}, h('tr', {}, ['EVENT','CAT','MARKET','CONF','APPARENT EDGE','NOTE','STATUS']
          .map((c, i) => h('th', { class: i === 3 || i === 4 ? 'r' : '' }, c)))), tb]));
      wrap.appendChild(h('div', { class:'note c' },
        'These carry real apparent edge and are excluded anyway. Hard gates have no numeric tolerance: ' +
        'exact league, exact line, exact period, exact overtime treatment. Only confidence 1.00 is ' +
        'eligible for staking or arbitrage.'));
    }

    const susp = M.rows.filter(r => r.verdict === 'SUSPECT');
    const arbs = [];
    for (const id in M.byMarket) {
      const b = M.byMarket[id];
      if (b.arb && b.arb.det.isArb) arbs.push({ m:b.market, a:b.arb });
    }
    wrap.appendChild(h('h2', {}, 'Arbitrages and quarantined quotes'));
    const tb2 = h('tbody');
    for (const x of arbs) {
      tb2.appendChild(h('tr', {}, [
        h('td', { class:'k' }, x.m.eventLabel),
        h('td', {}, x.m.marketLabel),
        h('td', { class:'r' }, x.a.det.S.toFixed(6)),
        h('td', { class:'r ' + (x.a.suspect ? 'neg' : 'pos') }, sgn(x.a.det.roi * 100, 3) + '%'),
        h('td', { class:'small' }, x.a.best.map(b => '~' + b.venueName + ' ' + price(b.dNet)).join('  +  ')),
        h('td', { class:'vd ' + (x.a.suspect ? 'vd-SUSPECT' : 'vd-BET') }, x.a.suspect ? 'SUSPECT' : 'ARB'),
        h('td', { class:'small muted' }, x.a.suspect
          ? 'ROI ≥ 4% — implausible, check pairing'
          : 'survives fees and commission')
      ]));
    }
    if (!arbs.length) tb2.appendChild(h('tr', {}, h('td', { colspan:7, class:'muted' }, 'No arbitrages on this slate.')));
    wrap.appendChild(h('table', {}, [
      h('caption', {}, 'Best NET price per outcome, fees and commission applied before detection'),
      h('thead', {}, h('tr', {}, ['EVENT','MARKET','BOOK SUM','ROI','LEGS','STATUS','NOTE']
        .map((c, i) => h('th', { class: i === 2 || i === 3 ? 'r' : '' }, c)))), tb2]));
    if (M.manifest.fakeArb) {
      const f = M.manifest.fakeArb;
      wrap.appendChild(h('div', { class:'note w' },
        'Fee-dispatch regression case is live on this slate: market ' + f.marketId +
        ' has a gross book sum of ' + f.grossSum.toFixed(6) + ', which looks like a ' +
        (f.arbIfFeeIgnored * 100).toFixed(2) + '% arbitrage if the Kalshi per-contract fee is ignored. ' +
        'Net of the fee the book sum is ' + f.netSum.toFixed(6) + ', i.e. ' +
        (f.arbWithFee * 100).toFixed(2) + '% — not an arbitrage. It is correctly absent above.'));
    }
    wrap.appendChild(h('h2', {}, 'Quote outliers quarantined (' + susp.length + ')'));
    wrap.appendChild(h('div', { class:'small muted' },
      'Threshold is 4 standard deviations of each venue’s OWN measured deviation, floored at 6pp. ' +
      'A flat threshold cannot tell a data error from a soft price: 7.5pp from a sharp book is an ' +
      'error, 7.5pp from a soft book is Tuesday.'));
    return wrap;
  }

  /* --------------------------------------------------------------- slip */
  function slip() {
    const M = VB.model.get(), S = VB.store.get(), st = S.settings, wrap = h('div');
    wrap.appendChild(h('h1', {}, 'Bet slip and exposure'));
    if (!st.bankroll) { wrap.appendChild(h('div', { class:'note w' }, 'Set bankroll and unit first.')); return wrap; }

    const bets = M.rows.filter(r => r.verdict === 'BET').sort((a, b) => b.t - a.t);
    const caps = st.caps;
    const perEvent = {}, admitted = [], blocked = [];
    let openU = 0;
    for (const r of bets) {
      const ev = r.eventId;
      const e = perEvent[ev] || 0;
      if (openU + r.rung > caps.maxOpenUnits + 1e-9) { blocked.push([r, 'total open ' + caps.maxOpenUnits + 'u']); continue; }
      if (e + r.rung > caps.maxPerEventUnits + 1e-9) { blocked.push([r, 'per-event ' + caps.maxPerEventUnits + 'u']); continue; }
      perEvent[ev] = e + r.rung; openU += r.rung; admitted.push(r);
    }
    const totalStake = admitted.reduce((s, r) => s + (r.amountCapped !== undefined ? r.amountCapped : r.amount), 0);
    const totalEv = admitted.reduce((s, r) => s + (r.evUsd || 0), 0);

    const meter = (label, cur, max) => h('div', { class:'row', style:'gap:8px' }, [
      h('div', { style:'width:150px' }, label),
      h('div', { class:'bar', style:'flex:1;max-width:220px' },
        h('i', { style:'width:' + Math.min(100, cur / max * 100).toFixed(1) + '%;background:' +
          (cur / max > 0.9 ? 'var(--warn)' : 'var(--accent)') })),
      h('div', { class:'num' }, cur.toFixed(2) + 'u / ' + max.toFixed(1) + 'u')
    ]);
    const sum = h('div', { class:'panel' }, [
      h('h2', {}, 'Exposure'),
      meter('Total open', openU, caps.maxOpenUnits),
      meter('Largest single event', Math.max.apply(null, Object.keys(perEvent).map(k => perEvent[k]).concat([0])), caps.maxPerEventUnits),
      h('dl', { class:'kv', style:'margin-top:8px' }, [
        h('dt', {}, 'Admitted'), h('dd', {}, admitted.length + ' of ' + bets.length + ' BET rows'),
        h('dt', {}, 'Total stake'), h('dd', {}, money(totalStake, 2)),
        h('dt', {}, 'Modelled EV'), h('dd', { class: cls(totalEv) }, sgn(totalEv, 2)),
        h('dt', {}, 'Blocked by caps'), h('dd', {}, String(blocked.length))
      ])
    ]);
    if (openU >= caps.maxOpenUnits - 1e-9) sum.appendChild(h('div', { class:'note c' },
      'NO NEW BETS. Total open exposure is at the ' + caps.maxOpenUnits +
      'u cap. New rows are refused outright rather than silently sized to zero.'));

    /* Variance panel. Both figures, always, never the first alone. */
    const avgP = admitted.length ? admitted.reduce((s, r) => s + r.pFair, 0) / admitted.length : 0.5;
    const avgD = admitted.length ? admitted.reduce((s, r) => s + r.dNet, 0) / admitted.length : 2;
    const lamEff = K.lambdaEff(st.lambda, st.R, K.R_SENSITIVITY);
    const risk = h('div', { class:'panel' }, [
      h('h2', {}, 'Variance and drawdown'),
      h('div', {}, 'At risk level ' + st.lambda.toFixed(2) + ', chance of the bankroll ever falling 50%: ' +
        (K.pEverDrawdown(0.5, st.lambda) * 100).toFixed(2) + '%.'),
      h('div', { class:'small', style:'margin-top:4px;color:var(--warn)' },
        'If edge reliability is really ' + K.R_SENSITIVITY + ' rather than the ' + st.R +
        ' prior, that becomes ' + (K.pEverDrawdown(0.5, lamEff) * 100).toFixed(1) +
        '%, and you retain ' + (K.growthRetained(lamEff) * 100).toFixed(0) + '% of maximum growth.'),
      h('dl', { class:'kv', style:'margin-top:8px' }, [
        h('dt', {}, 'P(ever −75%)'), h('dd', {}, (K.pEverDrawdown(0.25, st.lambda) * 100).toFixed(3) + '%'),
        h('dt', {}, 'Growth retained'), h('dd', {}, (K.growthRetained(st.lambda) * 100).toFixed(1) + '%'),
        h('dt', {}, 'P(down after 100 bets)'), h('dd', {}, (K.pDownAfterN(avgP, avgD, 100) * 100).toFixed(1) + '%'),
        h('dt', {}, 'P(down after 1,000)'), h('dd', {}, (K.pDownAfterN(avgP, avgD, 1000) * 100).toFixed(1) + '%'),
        h('dt', {}, 'P(down after 5,000)'), h('dd', {}, (K.pDownAfterN(avgP, avgD, 5000) * 100).toFixed(1) + '%')
      ]),
      h('div', { class:'small muted', style:'margin-top:6px' },
        'Drawdown figures use the closed-form log-growth result. Down-after-N uses the exact binomial ' +
        'below 200 bets, because the normal approximation understates the risk on long prices.')
    ]);
    wrap.appendChild(h('div', { class:'cols' }, [sum, risk]));

    const tb = h('tbody');
    for (const r of admitted) {
      tb.appendChild(h('tr', { class:'v-BET' }, [
        h('td', {}, r.cat), h('td', { class:'k' }, trunc(r.eventLabel, 26)),
        h('td', {}, r.marketLabel), h('td', {}, trunc(String(r.side), 12)),
        h('td', {}, '~' + r.venueName),
        h('td', { class:'r k' }, price(r.dGross)),
        h('td', { class:'r pos' }, sgn(r.evNet * 100, 2) + '%'),
        h('td', { class:'r k' }, r.rung.toFixed(2) + 'u'),
        h('td', { class:'r k' }, money(r.amountCapped !== undefined ? r.amountCapped : r.amount, 2)),
        h('td', { class:'r ' + cls(r.evUsd) }, sgn(r.evUsd, 2)),
        h('td', { class:'small muted' }, r.cappedBy && r.cappedBy !== 'none' ? 'capped: ' + r.cappedBy : '')
      ]));
    }
    wrap.appendChild(h('h2', {}, 'Admitted (' + admitted.length + ')'));
    wrap.appendChild(h('table', {}, [
      h('caption', {}, 'DEMO · this app places no bets'),
      h('thead', {}, h('tr', {}, ['CAT','EVENT','MARKET','SIDE','VENUE','PRICE','EV%','STAKE','AMOUNT','EV $','CAP']
        .map((c, i) => h('th', { class: i >= 5 && i <= 9 ? 'r' : '' }, c)))), tb]));
    if (blocked.length) {
      wrap.appendChild(h('h2', {}, 'Blocked by caps (' + blocked.length + ')'));
      const tb3 = h('tbody');
      for (const [r, why] of blocked.slice(0, 25)) {
        tb3.appendChild(h('tr', { class:'v-PASS' }, [
          h('td', {}, r.cat), h('td', {}, trunc(r.eventLabel, 26)),
          h('td', {}, '~' + r.venueName),
          h('td', { class:'r pos' }, sgn(r.evNet * 100, 2) + '%'),
          h('td', { class:'r k' }, '0.00u'), h('td', { class:'r' }, '—'),
          h('td', { class:'small warn' }, 'capped: ' + why)
        ]));
      }
      wrap.appendChild(h('table', {}, [h('thead', {}, h('tr', {},
        ['CAT','EVENT','VENUE','EV%','STAKE','AMOUNT','REASON'].map((c, i) => h('th', { class: i >= 3 && i <= 5 ? 'r' : '' }, c)))), tb3]));
    }
    wrap.appendChild(h('div', { class:'note' },
      'This app places no bets and has no venue connectivity. If you place one, record the price you ' +
      'actually got — not the price displayed — because that is what closing-line value is measured against.'));
    return wrap;
  }
  return { review, slip };
})();

/* ============ L4  settings, ask, first-run modal, router, boot ========= */
VB.views4 = (function () {
  const { h, clear, sgn, cls, money, ago, until } = VB.dom;
  const K = VB.stake, V = VB.views, price = V.price, trunc = V.trunc;

  /* ------------------------------------------------------------ settings */
  function settings() {
    const S = VB.store.get(), st = S.settings, M = VB.model.get(), wrap = h('div');
    wrap.appendChild(h('h1', {}, 'Settings'));

    const commit = () => { VB.store.save(); VB.model.compute(); VB.router.render(); };
    const numField = (label, key, step, min, max, fmt, note) => {
      const inp = h('input', { type:'number', value:st[key], step, min, max, style:'width:92px',
        onchange:(e) => { const v = Number(e.target.value);
          if (isFinite(v)) { st[key] = v; commit(); } } });
      return h('div', { class:'row', style:'margin:4px 0' }, [
        h('div', { style:'width:210px' }, label), inp,
        note ? h('div', { class:'small muted' }, note) : null]);
    };

    /* Bankroll and unit. The implied relationship is always printed. */
    const bank = h('div', { class:'panel' });
    bank.appendChild(h('h2', {}, 'Bankroll and unit'));
    bank.appendChild(numField('Bankroll ($)', 'bankroll', 100, 0));
    bank.appendChild(numField('1 unit ($)', 'unitUsd', 5, 0));
    if (st.bankroll > 0 && st.unitUsd > 0) {
      const typical = st.R * st.lambda * 0.03;
      bank.appendChild(h('div', { class:'note' }, [
        h('div', {}, '1u = ' + money(st.unitUsd) + ' = ' + (st.unitUsd / st.bankroll * 100).toFixed(2) +
          '% of a ' + money(st.bankroll) + ' bankroll.'),
        h('div', { class:'small muted' }, 'At risk level ' + st.lambda + ', a typical qualifying bet is about ' +
          (typical * 100).toFixed(2) + '% of bankroll — around ' + money(typical * st.bankroll) + ', i.e. ' +
          (typical * st.bankroll / st.unitUsd).toFixed(2) + 'u. Most recommendations will round to 0.25u.'),
        h('div', { class:'small muted' }, 'For 1.0u to be a typical bet, your bankroll would need to be about ' +
          money(Math.round(K.impliedBankrollFor1u(typical, st.unitUsd) / 1000) * 1000) + ', or your unit about ' +
          money(Math.round(K.suggestedUnitFor1u(typical, st.bankroll) / 5) * 5) + '.')
      ]));
    }
    /* Risk level. ONE control. R is read-only. */
    const risk = h('div', { class:'panel' });
    risk.appendChild(h('h2', {}, 'Risk level (λ)'));
    const presets = h('div', { class:'row' }, [0.10, 0.25, 0.50].map(l =>
      h('button', { class: Math.abs(st.lambda - l) < 1e-9 ? 'pri' : '',
        onclick:() => { st.lambda = l; commit(); } },
        l.toFixed(2) + (l === 0.25 ? ' (default)' : ''))));
    risk.appendChild(presets);
    const lamEff = K.lambdaEff(st.lambda, st.R, K.R_SENSITIVITY);
    risk.appendChild(h('div', { class:'note', style:'margin-top:8px' }, [
      h('div', {}, 'At risk level ' + st.lambda.toFixed(2) + ', chance of the bankroll ever falling 50%: ' +
        (K.pEverDrawdown(0.5, st.lambda) * 100).toFixed(2) + '%.'),
      h('div', { class:'small', style:'color:var(--warn)' },
        'If edge reliability is really ' + K.R_SENSITIVITY + ' rather than the ' + st.R + ' prior, that becomes ' +
        (K.pEverDrawdown(0.5, lamEff) * 100).toFixed(1) + '%, and you retain ' +
        (K.growthRetained(lamEff) * 100).toFixed(0) + '% of maximum growth.')
    ]));
    risk.appendChild(h('div', { class:'row', style:'margin-top:6px' }, [
      h('div', { style:'width:210px' }, 'Edge reliability (R)'),
      /* Read-only by design. An editable R is a control that switches off the
         bias correction while wearing the costume of a risk preference. */
      h('span', { class:'num', 'data-r-readonly':'1' }, st.R.toFixed(2)),
      h('span', { class:'small muted' }, 'prior · ' + S.betlog.length + ' of ' + K.R_MIN_OBS +
        ' observations · not adjustable')
    ]));
    risk.appendChild(h('div', { class:'small muted', style:'margin-top:4px' },
      'R de-biases the edge estimate; λ controls drawdown. Both are required. R becomes the regression ' +
      'coefficient of realised closing-line value on predicted edge once 200 observations exist.'));

    /* Gates, with loosening tracked. */
    const gates = h('div', { class:'panel' });
    gates.appendChild(h('h2', {}, 'Gates'));
    gates.appendChild(numField('Min EV% (net of fees)', 'minEVPct', 0.005, 0, 1));
    gates.appendChild(numField('Min edge (probability)', 'minEdgePP', 0.002, 0, 1));
    gates.appendChild(numField('Min t (significance)', 'minT', 0.5, 0, 10));
    gates.appendChild(numField('Min independent clusters', 'minClusters', 1, 1, 10));
    gates.appendChild(numField('Max quote age (min)', 'maxAgeMin', 1, 1, 240));
    const tog = (label, key, note) => h('div', { class:'row', style:'margin:4px 0' }, [
      h('div', { style:'width:210px' }, label),
      h('input', { type:'checkbox', checked: st[key] ? 'checked' : null,
        onchange:(e) => { st[key] = e.target.checked; commit(); } }),
      note ? h('div', { class:'small muted' }, note) : null]);
    gates.appendChild(tog('Require a sharp venue', 'requireTier1'));
    gates.appendChild(tog('Accessible venues only', 'accessibleOnly', 'nothing is claimed on your behalf'));
    gates.appendChild(h('div', { class:'row', style:'margin:4px 0' }, [
      h('div', { style:'width:210px' }, 'Multiplicity correction'),
      h('span', { class:'num pos' }, 'ON'),
      h('span', { class:'small muted' }, 'no toggle — the top row of a large scan is otherwise noise')
    ]));
    const loose = VB.store.loosenedGates();
    if (loose.length) gates.appendChild(h('div', { class:'note c' },
      'You have loosened ' + loose.length + ' gate' + (loose.length > 1 ? 's' : '') + ': ' +
      loose.map(l => l.label + ' ' + l.from + ' → ' + l.to).join('; ') +
      '. Bets taken under loosened gates are badged OFF-SPEC and excluded from the R regression.'));

    /* Accounts. Default all off. */
    const acct = h('div', { class:'panel' });
    acct.appendChild(h('h2', {}, 'My accounts'));
    acct.appendChild(h('div', { class:'small muted', style:'margin-bottom:6px' },
      'Default is off for every venue. The best price is routinely at a venue you cannot use, so the ' +
      'board defaults to accessible-only and claims nothing on your behalf.'));
    const grid = h('div', { class:'row' });
    for (const v of VB.seed.VENUES) {
      const on = S.venues[v.id] && S.venues[v.id].accessible;
      grid.appendChild(h('button', { class: on ? 'pri' : '',
        onclick:() => { S.venues[v.id].accessible = !on;
          if (!S.__acc) S.__acc = {}; S.__acc[v.id] = S.venues[v.id].accessible; commit(); } },
        (on ? '✓ ' : '') + v.name));
    }
    acct.appendChild(grid);

    const disp = h('div', { class:'panel' });
    disp.appendChild(h('h2', {}, 'Display and data'));
    disp.appendChild(h('div', { class:'row', style:'margin:4px 0' }, [
      h('div', { style:'width:210px' }, 'No-colour mode'),
      h('input', { type:'checkbox', checked: st.noColour ? 'checked' : null,
        onchange:(e) => { st.noColour = e.target.checked;
          document.documentElement.dataset.nocolour = st.noColour ? '1' : '0'; commit(); } }),
      h('div', { class:'small muted' }, 'positive/negative green–red fails colourblind separation at deutan ΔE 4.1')
    ]));
    disp.appendChild(h('dl', { class:'kv', style:'margin-top:6px' }, [
      h('dt', {}, 'Data mode'), h('dd', { class:'warn' },
        S.dataset.mode === 'mixed' ? 'MIXED (synthetic + live)' : 'SEED (synthetic)'),
      h('dt', {}, 'Seed'), h('dd', {}, String(VB.seed.MASTER)),
      h('dt', {}, 'Venues'), h('dd', {}, String(VB.seed.VENUES.length)),
      h('dt', {}, 'Markets'), h('dd', {}, String(M.slate.markets.length)),
      h('dt', {}, 'Offer rows'), h('dd', {}, M.nEval.toLocaleString()),
      h('dt', {}, 'localStorage'), h('dd', {}, S.runtime.storage.local ? 'available' : 'UNAVAILABLE — in-memory only'),
      h('dt', {}, 'Live adapters'), h('dd', {}, (function(){
        const k = Object.keys(VB.model.liveStats());
        return k.length ? k.join(', ') + ' loaded' : 'none loaded';
      })())
    ]));
    disp.appendChild(h('div', { class:'row', style:'margin-top:8px' }, [
      h('button', { onclick:exportCsv }, 'Export board CSV'),
      h('button', { onclick:() => { if (S.runtime.storage.local) { for (const k in VB.store.KEY) localStorage.removeItem(VB.store.KEY[k]); }
        location.reload(); } }, 'Reset everything')
    ]));
    disp.appendChild(h('div', { class:'note w' },
      'Live data: only The Odds API and Polymarket are provably callable from a browser (both send ' +
      'permissive CORS headers). Every US retail book is unreachable directly — WAF-blocked, ' +
      'geo-gated, or contractually off-limits — so book-level granularity requires a paid aggregator. ' +
      'Kalshi returned a bare 403 when probed and is unresolved; test it from your own devtools before ' +
      'assuming it works. Adapters are not wired in this build.'));

    wrap.appendChild(h('div', { class:'cols' }, [bank, risk]));
    wrap.appendChild(h('div', { class:'cols' }, [gates, acct]));
    wrap.appendChild(budgetPanel(commit));
    wrap.appendChild(livePanel(commit));
    wrap.appendChild(disp);
    return wrap;
  }

  /* ----------------------------------------------------------- budget panel */
  function budgetPanel(commit) {
    const S = VB.store.get(), M = VB.model.get();
    const B = VB.budget;
    const st = B.status(M && M.oddsQuota && M.oddsQuota.remaining);
    const au = VB.model.autoStatus();
    const box = h('div', { class:'panel' });
    box.appendChild(h('h2', {}, 'Credit budget'));

    const bar = h('div', { class:'bar', style:'min-width:220px;max-width:340px' },
      h('i', { style:'width:' + Math.min(100, st.spent / st.monthly * 100).toFixed(1) + '%;' +
        'background:' + (st.pace > 80 ? 'var(--warn)' : 'var(--brand)') }));
    box.appendChild(h('div', { class:'row', style:'gap:10px' }, [
      bar, h('span', { class:'num', style:'font-weight:700' },
        st.spent + ' / ' + st.monthly + ' used'),
      h('span', { class:'small muted' }, st.remaining + ' left · ' + st.daysLeft + ' days to reset')
    ]));
    box.appendChild(h('dl', { class:'kv', style:'margin-top:8px' }, [
      h('dt', {}, 'pace vs even burn'),
      h('dd', { class: st.pace > 80 ? 'warn' : st.pace < -40 ? 'pos' : '' },
        (st.pace >= 0 ? '+' : '−') + Math.abs(Math.round(st.pace)) + ' credits'),
      h('dt', {}, 'spendable per remaining day'), h('dd', {}, st.budgetPerDayLeft.toFixed(1)),
      h('dt', {}, 'held in reserve'), h('dd', {}, String(st.reserve)),
      h('dt', {}, 'paid pulls this month'), h('dd', {}, String(st.pulls))
    ]));

    /* Region strategy is the single biggest lever, so it is a first-class
       control with its cost stated. */
    const cur = S.settings.oddsRegions || 'eu';
    box.appendChild(h('h2', { style:'margin-top:14px' }, 'Region strategy'));
    box.appendChild(h('div', { class:'row' }, [
      h('button', { class: cur === 'eu' ? 'pri' : '', onclick:() => {
        S.settings.oddsRegions = 'eu'; commit(); } }, 'EU only · 3 cr'),
      h('button', { class: cur === 'us,eu' ? 'pri' : '', onclick:() => {
        S.settings.oddsRegions = 'us,eu'; commit(); } }, 'US + EU · 6 cr')
    ]));
    box.appendChild(h('div', { class:'small muted', style:'margin-top:5px' },
      'EU alone returns 21 books including Pinnacle, Betfair and Matchbook — every sharp ' +
      'anchor the consensus needs — for half the credits. Adding US mostly duplicates ' +
      'DraftKings, FanDuel and BetMGM, and DraftKings already arrives free from ESPN. ' +
      'At 3 credits a pull the month buys 166 league-pulls instead of 83.'));

    box.appendChild(h('h2', { style:'margin-top:14px' }, 'How credits are allocated'));
    box.appendChild(h('div', { class:'small muted' },
      '500 credits against 730 hours is 0.68 an hour, which is both unspendable and ' +
      'useless — odds only matter near kickoff and there are no games at 4am. So the ' +
      'policy is an allocation, not a rate limit:'));
    const ul = h('div', { class:'small', style:'margin-top:6px;line-height:1.7' });
    [['Scout free first', 'ESPN and Polymarket cost nothing and refresh every 3 minutes. They answer whether games exist and when they start — the only thing that decides if a paid pull is worth it.'],
     ['Spend inside the window', 'Paid pulls only fire when a game starts within ' + B.VALUE_WINDOW_H + 'h — the whole NFL week plus both CFB Saturdays. Lines move inside that window, which is the point: an early number is what you compare the closing one against.'],
     ['Buy the reference, not retail', 'EU region for the sharp anchor; the bettable book comes free.'],
     ['Hold a reserve', B.RESERVE + ' credits are never auto-spent, so one busy Saturday cannot empty the month.'],
     ['Cooldown', 'No two paid pulls within ' + B.MIN_GAP_MIN + ' minutes.']
    ].forEach(([k, v]) => {
      ul.appendChild(h('div', {}, [h('b', {}, k + ' — '), h('span', { class:'muted' }, v)]));
    });
    box.appendChild(ul);

    if (au && au.decision) {
      box.appendChild(h('div', { class: au.decision.spend ? 'note' : 'note w',
        style:'margin-top:10px' }, [
        h('b', {}, au.decision.spend ? 'Last decision: SPEND. ' : 'Last decision: SKIP. '),
        h('span', {}, au.decision.why),
        au.scout && au.scout.gamesSoon !== null
          ? h('div', { class:'small muted', style:'margin-top:4px' },
              'Free scout found ' + au.scout.gamesSoon + ' game(s) starting within ' +
              B.VALUE_WINDOW_H + 'h.')
          : null
      ]));
    }
    return box;
  }

  /* ------------------------------------------------------- live data panel */
  function livePanel(commit) {
    const S = VB.store.get(), M = VB.model.get();
    const stats = VB.model.liveStats();
    const box = h('div', { class:'panel' });
    box.appendChild(h('h2', {}, 'Live data'));
    const status = h('div', { class:'small', style:'margin-bottom:8px' });
    const setStatus = (msg, cls) => { clear(status);
      status.appendChild(h('span', { class: cls || 'muted' }, msg)); };

    /* The honest framing, stated before either button is pressed. */
    box.appendChild(h('div', { class:'note' },
      'Probed live: The Odds API and Polymarket both send a wildcard CORS header, so this page can ' +
      'call them directly from file://. Kalshi returns 403 with no CORS headers and is not callable. ' +
      'Every US retail book is unreachable directly, so book-level prices come through the aggregator ' +
      'or not at all.'));

    /* --- ESPN: real games + real DraftKings prices, no key, no signup --- */
    const es = h('div', { style:'margin:10px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--rule)' });
    const leagueSel = h('select', {}, ['NFL','NCAAF','MLB','NBA','NHL','NCAAB','SOC']
      .map(k => h('option', { value:k }, k)));
    /* "Today" and "this week" are different questions and ESPN answers the
       second one by default, which is why a Sunday looked empty: the week
       view was dominated by Saturday's finished games. */
    const whenSel = h('select', {}, [
      h('option', { value:'today' }, 'today'),
      h('option', { value:'tomorrow' }, 'tomorrow'),
      h('option', { value:'week' }, 'current week')]);
    es.appendChild(h('div', { class:'row' }, [
      h('div', { style:'width:150px;font-weight:700' }, 'ESPN'),
      h('span', { class:'tag' }, 'no key needed'),
      leagueSel,
      whenSel,
      h('button', { class:'pri', onclick: async () => {
        const ad = VB.adapters.espn;
        let dk = null;
        if (whenSel.value === 'today') dk = ad.dateKey(new Date());
        else if (whenSel.value === 'tomorrow') {
          const t = new Date(); t.setDate(t.getDate() + 1); dk = ad.dateKey(t);
        }
        setStatus('fetching real ' + leagueSel.value + ' odds…');
        const r = await VB.model.loadLive('espn', { cat: leagueSel.value, dateKey: dk });
        if (!r.ok) { setStatus('failed: ' + r.error + (r.classify ? ' [' + r.classify + ']' : ''), 'neg'); return; }
        setStatus('loaded ' + r.markets + ' real markets from ' + r.quotes + ' games. ' +
          'Single venue, so they read NO PRICE — open them in "show everything".', 'pos');
        VB.store.save(); VB.router.render();
      } }, 'Load real odds'),
      stats.espn ? h('button', { onclick:() => { VB.model.clearLive('espn'); VB.router.render(); } }, 'Clear') : null
    ]));
    es.appendChild(h('div', { class:'small muted', style:'margin-top:5px' },
      'Real games, real teams, real start times, and real DraftKings prices on the moneyline, ' +
      'spread and total — including a working bet-slip link per outcome. Free, no signup, and it ' +
      'is CORS-open so the page can call it directly. The catch is that ESPN publishes exactly ' +
      'ONE book, so these markets will read NO PRICE: a fair line needs 3 independent clusters ' +
      'plus a sharp anchor, and one venue cannot be its own consensus. This makes the prices ' +
      'real; it does not make it a value board.'));
    es.appendChild(h('div', { class:'small muted', style:'margin-top:4px' },
      'A thin result is usually the calendar, not a failure. Finished games carry no odds and are ' +
      'skipped, and ESPN only prices games near kickoff — so a Sunday in football season shows a ' +
      'handful of games while the Saturday slate is already final. The load summary breaks down ' +
      'exactly how many were returned, priced, final, or not yet priced.'));
    if (stats.espn) {
      const st = stats.espn;
      es.appendChild(h('div', { class:'small', style:'margin-top:4px' },
        h('span', { class:'pos' }, '● live'), ' ' + st.markets + ' markets from ' + st.quotes + ' games'));
      (st.warnings || []).forEach(w => es.appendChild(h('div', { class:'small muted' }, '· ' + w)));
    }
    box.appendChild(es);

    /* --- Polymarket: no key, but one venue cannot make a consensus --- */
    const pm = h('div', { style:'margin:10px 0' });
    pm.appendChild(h('div', { class:'row' }, [
      h('div', { style:'width:150px;font-weight:600' }, 'Polymarket'),
      h('span', { class:'tag' }, 'no key needed'),
      h('button', { onclick: async () => {
        setStatus('fetching Polymarket…');
        const r = await VB.model.loadLive('polymarket', {});
        if (!r.ok) { setStatus('failed: ' + r.error + (r.classify ? ' [' + r.classify + ']' : ''), 'neg'); return; }
        setStatus('loaded ' + r.markets + ' markets from ' + r.quotes + ' contracts' +
          (r.rejected ? ', ' + r.rejected + ' rejected' : ''), 'pos');
        VB.store.save(); VB.router.render();
      } }, 'Load live'),
      stats.polymarket ? h('button', { onclick:() => { VB.model.clearLive('polymarket');
        VB.router.render(); } }, 'Clear') : null
    ]));
    pm.appendChild(h('div', { class:'small muted' },
      'Loads real prediction-market contracts. Note what this can and cannot do: Polymarket is ONE ' +
      'venue, so every contract it returns is a single-venue market and the breadth gate will report ' +
      'NO PRICE rather than invent a fair line from one opinion. Its contracts are also not ' +
      'auto-matched to sportsbook markets — two contracts can read identically and settle on ' +
      'different criteria, and auto-linking on the question text eventually prints a fake edge.'));
    if (stats.polymarket) {
      const st = stats.polymarket;
      pm.appendChild(h('div', { class:'small', style:'margin-top:4px' },
        h('span', { class:'pos' }, '● live'), ' ' + st.markets + ' markets · ' +
        st.quotes + ' contracts · ' + st.rejected + ' rejected'));
      (st.warnings || []).forEach(w => pm.appendChild(h('div', { class:'small warn' }, '⚠ ' + w)));
    }
    box.appendChild(pm);

    /* --- The Odds API: needs a key, and it is the one that makes value work --- */
    const oa = h('div', { style:'margin:14px 0 0;padding-top:10px;border-top:1px solid var(--rule)' });
    const keyIn = h('input', { type:'password', value: (S.keys && S.keys.oddsapi) || '',
      placeholder:'paste API key', style:'width:230px',
      onchange:(e) => { S.keys = S.keys || {}; S.keys.oddsapi = e.target.value.trim(); VB.store.save(); } });
    const sportSel = h('select', {}, [
      ['americanfootball_nfl','NFL'], ['americanfootball_ncaaf','NCAAF'],
      ['baseball_mlb','MLB'], ['basketball_nba','NBA'], ['icehockey_nhl','NHL'],
      ['soccer_epl','EPL'], ['mma_mixed_martial_arts','MMA']
    ].map(([v, l]) => h('option', { value:v }, l)));
    oa.appendChild(h('div', { class:'row' }, [
      h('div', { style:'width:150px;font-weight:600' }, 'The Odds API'),
      keyIn, sportSel,
      h('span', { class:'tag' }, '3 credits'),
      h('button', { onclick: async () => {
        const key = (S.keys && S.keys.oddsapi) || keyIn.value.trim();
        if (!key) { setStatus('paste an API key first', 'warn'); return; }
        setStatus('fetching ' + sportSel.value + '… (3 credits)');
        const r = await VB.model.loadLive('oddsapi',
          { key, sportKey: sportSel.value, markets:'h2h,spreads,totals' });
        if (!r.ok) { setStatus('failed: ' + r.error + (r.classify ? ' [' + r.classify + ']' : ''), 'neg'); return; }
        const q = r.quota && r.quota.remaining ? ' · ' + r.quota.remaining + ' credits left' : '';
        setStatus('loaded ' + r.markets + ' markets from ' + r.quotes + ' book-markets' + q, 'pos');
        VB.store.save(); VB.router.render();
      } }, 'Load live'),
      stats.oddsapi ? h('button', { onclick:() => { VB.model.clearLive('oddsapi');
        VB.router.render(); } }, 'Clear') : null
    ]));
    oa.appendChild(h('div', { class:'row', style:'margin-top:6px' }, [
      h('div', { style:'width:150px' }, ''),
      /* Validate for free FIRST. /sports does not consume a credit, so a bad
         key is caught before any quota is spent. */
      h('button', { onclick: async () => {
        const key = (S.keys && S.keys.oddsapi) || keyIn.value.trim();
        if (!key) { setStatus('paste a key first', 'warn'); return; }
        setStatus('validating (free, costs no credits)…');
        const v = await VB.model.validateKey(key);
        if (!v.ok) { setStatus('key check failed: ' + v.error + ' [' + v.classify + ']', 'neg'); return; }
        S.keys = S.keys || {}; S.keys.oddsapi = key; VB.store.save();
        setStatus('key is valid · ' + v.sports + ' active sports · ' +
          (v.remaining ? v.remaining + ' credits remaining' : 'quota header not exposed') +
          (v.used ? ' · ' + v.used + ' used' : ''), 'pos');
      } }, 'Validate key (free)')
    ]));
    oa.appendChild(h('div', { class:'small muted', style:'margin-top:5px' },
      'This is the source that makes the value board actually work, because it returns 10–20 books ' +
      'in one call — and a fair price needs at least 3 independent clusters plus a sharp anchor ' +
      'before it will price anything at all.'));
    oa.appendChild(h('div', { class:'small muted', style:'margin-top:4px' },
      'Free tier: 500 credits/month, no card. Sign up at the-odds-api.com and copy the key from ' +
      'the dashboard. 1 credit = 1 sport × 1 market × 1 region, so a moneyline+spread+total pull ' +
      'on one league costs 3 — about 160 pulls a month. Validate first; that call is free.'));
    oa.appendChild(h('div', { class:'small muted', style:'margin-top:4px' },
      'The key is stored in plaintext in this browser\'s localStorage and travels in the query ' +
      'string, not a header — a custom header would trigger a CORS preflight these endpoints do ' +
      'not answer from a file:// origin. If that matters to you, use the paste box below instead ' +
      'and the key never touches this app.'));
    if (stats.oddsapi) {
      const st = stats.oddsapi;
      oa.appendChild(h('div', { class:'small', style:'margin-top:4px' },
        h('span', { class:'pos' }, '● live'), ' ' + st.markets + ' markets · ' +
        st.quotes + ' book-markets · ' + st.rejected + ' rejected'));
      if (st.discovered && st.discovered.length) oa.appendChild(h('div', { class:'small warn' },
        '⚠ ' + st.discovered.length + ' unrecognised book' + (st.discovered.length > 1 ? 's' : '') + ': ' +
        st.discovered.map(d => d.key).join(', ') +
        ' — registered but held OUT of the consensus, because a source we have never measured must ' +
        'not move the fair line on its first appearance. Enable in the venue list once you trust it.'));
      (st.warnings || []).forEach(w => oa.appendChild(h('div', { class:'small warn' }, '⚠ ' + w)));
    }
    box.appendChild(oa);
    box.appendChild(status);

    /* Share link. Solves the real problem -- handing this to someone who
       will not paste a key -- without publishing the key in a public repo. */
    const key0 = (S.keys && S.keys.oddsapi) || '';
    if (key0) {
      const base = 'https://alockwood-lab.github.io/edge-board/';
      const link = base + '#/board/all?k=' + encodeURIComponent(key0);
      const shareBox = h('div', { style:'margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)' });
      shareBox.appendChild(h('div', { style:'font-weight:700;margin-bottom:4px' }, 'Share this with someone'));
      shareBox.appendChild(h('div', { class:'small muted', style:'margin-bottom:6px' },
        'This link carries your API key. Whoever opens it is configured instantly — no ' +
        'pasting, no signup. The key is captured into their browser and removed from the ' +
        'address bar on load. Anyone with the link spends YOUR credits, so treat it like ' +
        'a password: send it to a person, not a public place. Rotate at ' +
        'the-odds-api.com/account/ to invalidate every link at once.'));
      const inp = h('input', { type:'text', value:link, readonly:'readonly',
        style:'width:100%;font-family:var(--mono);font-size:11px' });
      shareBox.appendChild(inp);
      shareBox.appendChild(h('div', { class:'row', style:'margin-top:6px' }, [
        h('button', { class:'pri', onclick:() => {
