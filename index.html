       1. noise in LOGIT space, so it never leaves (0,1) and scales sensibly
          at long odds;
       2. favBias COMPRESSES toward 50/50, reproducing the actual
          favourite-longshot bias -- soft books overprice underdogs;
       3. the venue's OPINION is renormalized to a proper distribution before
          vig is applied, so the devig engine can genuinely recover it;
       4. vig is weighted toward longshots, which is what books do and what
          makes Shin visibly differ from multiplicative in the UI;
       5. prices SNAP to the real grid before the board sees them, because
          snapping is where genuine arbitrage comes from;
       6. staleness is an exponential draw scaled by the venue's own update
          cadence, so the age chips and the staleness bias have something
          honest to act on. */

    const n = pTrue.length, ph = [];
    for (const p of pTrue) {
      let z = logit(clamp(p, 1e-4, 1 - 1e-4));
      z *= (1 - v.favBias);
      z += v.sigma * gauss(rng);
      ph.push(sig(z));

    const s0 = ph.reduce((a, b) => a + b, 0);
    const opinion = ph.map(x => x / s0);
    if (v.model === 'order_book') {
      /* Exchanges/PMs quote a two-sided book: a spread around the opinion,
         not a vig loading. Mid is the signal, ask is the execution. */
      const spread = (v.vig - 1) + 0.004 + 0.010 * rng();
      return { opinion, ask: opinion.map(p => clamp(p + spread / 2, 0.005, 0.995)),
               bid: opinion.map(p => clamp(p - spread / 2, 0.005, 0.995)),
               spreadCents: spread * 100 };
    }
    /* Allocate the margin EXPLICITLY so the book sum equals vig by
       construction at any skew and any n. Weighting the allocation toward
       longshots (gamma 0.45) reproduces the favourite-longshot loading books
       actually apply -- a 10% shot carries ~36% relative markup where a 90%
       favourite carries ~1.5% -- and it is what makes Shin and power devig
       visibly differ from multiplicative in the UI.
       A formula that merely SCALES the opinion cannot do this: it lets the
       book sum drift with skew, and at extreme skew it drifts below 1, which
       is a free-money book. That produced both sides of a market showing as
       positive-EV bets. */
    const margin = v.vig - 1;
    const u = opinion.map(p => Math.pow(1 / Math.max(p, 0.02), 0.45));
    const uS = u.reduce((a, b) => a + b, 0);
    const q = opinion.map((p, i) => p + margin * u[i] / uS);
    return { opinion, q };
  }

  function priceRows(pTrue, market, nowSec) {
    const rng = rngFor('quotes:' + market.id);

    for (const v of VENUES) {

                    ageSec: age, ts: nowSec - age });

     detector prints arbitrages that do not exist, and one planted test
     depends on exactly that. */
  function netDecimal(dGross, venue) {
    const f = venue.fee;

    if (f.type === 'kalshi') return O.pmFeeAdjusted(dGross, f.k);
    return dGross;
  }
  return { MASTER, rngFor, VENUES, CATS, TEAMS: T, MKT,
           venueQuote, priceRows, netDecimal };
})();

/* ------------------------------------------------- L2 seed: history + slate */
VB.seedGen = (function () {
  const U = VB.util, O = VB.odds, D = VB.devig, C = VB.consensus, S = VB.seed;
  const { clamp, logit, sig, gauss } = U;

  /* Settled history is stored as SUFFICIENT STATISTICS, never as rows:
     ~35 numbers per venue recovers every metric AND its standard error, in
     under 5KB, where the equivalent rows would double the arena.
     CLA is computed LEAVE-ONE-CLUSTER-OUT. This is not a detail: scoring a
     venue against a closing consensus built partly from its own corporate
     siblings and feed-mates rewards CONFORMITY, so the sharpest independent
     venue -- the one whose price disagrees -- would score worst. */
  function history(nEvents) {
    const rng = S.rngFor('history');
    const stats = {};
    for (const v of S.VENUES) {
      stats[v.id] = { n:0, claSum:0, claSumSq:0, nSettled:0, brierSum:0,
                      brierSumSq:0, logSum:0, holdSum:0, nHold:0, nBest:0,
                      bins: Array.from({length:10}, () => ({n:0,pSum:0,oSum:0})) };
    }
    for (let e = 0; e < nEvents; e++) {
      const zT = gauss(rng) * 1.1;
      const pT = sig(zT);
      const pTrue = [pT, 1 - pT];
      const y = rng() < pT ? 1 : 0;      /* outcome drawn from TRUTH */

      /* Each venue forms an opinion at its own designed sigma. */
      const op = [], present = [];
      for (const v of S.VENUES) {
        if (rng() > v.cov) continue;
        const q = S.venueQuote(pTrue, v, rng);
        op.push(q.opinion); present.push(v);
      }
      if (present.length < 4) continue;

      /* Closing consensus, then per-venue LOCO closing consensus. */
      for (let i = 0; i < present.length; i++) {
        const v = present[i];
        const others = [], oProbs = [];
        for (let j = 0; j < present.length; j++) {
          if (present[j].cluster === v.cluster) continue;
          others.push(present[j]); oProbs.push(op[j]);
        }
        if (others.length < 3) continue;
        const built = C.build(others.map(x => Object.assign({}, x, { ageSec: 5 })),
                              oProbs, {});
        if (!built.ok) continue;
        const pClose = built.p[0];
        const ph = clamp(op[i][0], 1e-4, 1 - 1e-4);
        const st = stats[v.id];
        const cla = (ph - pClose) * (ph - pClose);
        st.n++; st.claSum += cla; st.claSumSq += cla * cla;
        const br = (ph - y) * (ph - y);
        st.nSettled++; st.brierSum += br; st.brierSumSq += br * br;
        st.logSum -= y ? Math.log(ph) : Math.log(1 - ph);
        const b = Math.min(9, Math.floor(ph * 10));
        st.bins[b].n++; st.bins[b].pSum += ph; st.bins[b].oSum += y;
        /* Hold is a single-snapshot measurement: cheap, precise, immediate. */
        if (v.model === 'fixed_odds') {
          const q2 = S.venueQuote(pTrue, v, rng);
          if (q2.q) { st.holdSum += 1 - 1 / (q2.q[0] + q2.q[1]); st.nHold++; }
        } else { st.holdSum += (v.vig - 1) + 0.006; st.nHold++; }
      }
    }
    /* Finish the calibration bins into the shape the scorer expects. */
    for (const id in stats) {
      const st = stats[id];
      st.bins = st.bins.filter(b => b.n > 0)
                       .map(b => ({ n:b.n, pMean:b.pSum/b.n, oMean:b.oSum/b.n }));
      const v = S.VENUES.find(x => x.id === id);
      st.breadth = v.cov; st.depthTier = v.depthTier;
      st.publishesProbability = v.publishesProbability;
    }
    return stats;
  }

  function leaderboard(stats) {
    const rows = [];
    for (const v of S.VENUES) {
      const c = VB.score.components(stats[v.id]);
      if (c) c.publishesProbability = v.publishesProbability;
      rows.push({ venue: v, comp: c });
    }
    const cohort = { cla: rows.map(r => r.comp && r.comp.cla).filter(isFinite),
                     calib: rows.map(r => r.comp && r.comp.ece).filter(isFinite),
                     logLoss: rows.map(r => r.comp && r.comp.logLoss).filter(isFinite),
                     brier: rows.map(r => r.comp && r.comp.brier).filter(isFinite) };
    for (const r of rows) {
      r.sharp = VB.score.sharp(r.comp, cohort, r.venue.tier);
      r.use = VB.score.use(r.comp, cohort);
    }
    const ranked = VB.score.rank(rows);
    return { rows, ranked, cohort };
  }
  return { history, leaderboard };
})();

/* -------------------------------------------------------------- L2 slate */
VB.slate = (function () {
  const U = VB.util, O = VB.odds, S = VB.seed;
  const { clamp, logit, sig, gauss } = U;
  const DEMO_NOW = 0;   /* all times are OFFSETS from app launch, never absolute,
                           so the demo's countdowns and age chips are correct
                           whenever it is opened. Absolute dates would render
                           the whole board stale within a day. */

  function pick(arr, rng, n) {
    const a = arr.slice(), out = [];
    while (out.length < n && a.length) out.push(a.splice(Math.floor(rng() * a.length), 1)[0]);
    return out;
  }

  function build() {
    const rng = S.rngFor('slate');
    const events = [], markets = [];
    let eid = 0, mid = 0;

    for (const cat of S.CATS) {
      const names = S.TEAMS[cat.key] || [];
      /* --- games --- */
      for (let g = 0; g < cat.nGames; g++) {
        const pair = pick(names, rng, 2);
        if (pair.length < 2) break;
        const startSec = Math.round((0.5 + rng() * 200) * 3600);
        const isSoccer = cat.key === 'SOC';
        const ev = { id: 'e' + (++eid), cat: cat.key, kind: 'match',
                     label: pair[0] + ' v ' + pair[1], home: pair[0], away: pair[1],
                     startSec, latent: gauss(rng) * 1.1 };
        events.push(ev);

        /* Moneyline (3-way for soccer). */
        const pH = sig(ev.latent);
        if (isSoccer) {
          const zd = -0.35 + rng() * 0.2;
          const e3 = [ev.latent, zd, -ev.latent].map(Math.exp);
          const Z3 = e3.reduce((a, b) => a + b, 0);
          markets.push(mk(++mid, ev, 'ml3', '1X2', ['home','draw','away'],
                          e3.map(x => x / Z3), null, cat));
        } else {
          markets.push(mk(++mid, ev, 'moneyline', 'MONEYLINE', ['home','away'],
                          [pH, 1 - pH], null, cat));
        }
        /* Spread and total sit near a coinflip -- that is what a PRICED line
           actually looks like, so they are not drawn from the latent. */
        if (cat.key !== 'TEN' && cat.key !== 'MMA') {
          const ps = clamp(0.5 + 0.03 * gauss(rng), 0.42, 0.58);
          const line = Math.round((ev.latent * -3.2) * 2) / 2 - 0.5;
          markets.push(mk(++mid, ev, 'spread', 'SPREAD', ['home','away'],
                          [ps, 1 - ps], line, cat));
          const pt = clamp(0.5 + 0.03 * gauss(rng), 0.42, 0.58);
          const base = { NFL:44.5, NCAAF:52.5, MLB:8.5, SOC:2.5, NBA:224.5, NHL:6.5 }[cat.key] || 45.5;
          markets.push(mk(++mid, ev, 'total', 'TOTAL', ['over','under'],
                          [pt, 1 - pt], base + Math.round(rng() * 8 - 4), cat));
        }
        /* Player props exist and are REACHABLE, but are excluded from
           cross-venue EV by G11 -- stat definitions differ between venues,
           so the same words are a different contract. */
        if ((cat.key === 'NFL' || cat.key === 'MLB') && g < 4) {
          const pp = clamp(0.5 + 0.04 * gauss(rng), 0.40, 0.60);
          const m = mk(++mid, ev, 'prop', 'PLAYER', ['over','under'], [pp, 1 - pp],
                       Math.round(240 + rng() * 80) + 0.5, cat);
          m.playerKey = pair[0] + ' starter';
          m.propStat = cat.key === 'NFL' ? 'pass yds' : 'strikeouts';
          markets.push(m);
        }
      }
      /* --- futures / outrights / binaries --- */
      const nF = cat.futuresOnly ? (names.length > 12 ? 2 : 1) : 1;
      for (let f = 0; f < nF; f++) {
        const isBinary = ['POL','ECON','AWD','TECH'].indexOf(cat.key) >= 0;
        if (isBinary) {
          const subj = pick(names, rng, Math.min(6, names.length));
          for (const sname of subj) {
            const ev = { id: 'e' + (++eid), cat: cat.key, kind: 'non_sport_question',
                         label: sname, startSec: Math.round((240 + rng() * 4000) * 3600),
                         latent: gauss(rng) * 0.9 };
            events.push(ev);
            const py = clamp(sig(ev.latent), 0.04, 0.96);
            markets.push(mk(++mid, ev, 'binary', 'BINARY', ['yes','no'],
                            [py, 1 - py], null, cat));
          }
        } else {
          /* Take the TOP of the list in order and give it a monotonically
             decreasing field, rather than sampling teams at random and
             assigning random strengths. A synthetic futures market that
             names real teams and then implies the best team in the sport is
             a longshot is obviously false to anyone who follows it, and one
             visibly absurd row costs more credibility than the whole market
             is worth. The team lists are ordered strongest-first for exactly
             this reason. The prices are still synthetic -- the ORDERING is
             what has to be defensible. */
          const field = names.slice(0, Math.min(10, names.length));
          const ev = { id: 'e' + (++eid), cat: cat.key, kind: 'season_outright',
                       label: cat.label + ' — season winner (synthetic)',
                       startSec: Math.round((300 + rng() * 3000) * 3600), latent: 0 };
          events.push(ev);
          /* Geometric decay with a little jitter: a plausible futures shape,
             favourite first, and never re-ordered by noise. */
          const raw = field.map((_, i) => Math.exp(-0.42 * i) * (0.92 + 0.16 * rng()));
          raw.sort((a, b) => b - a);
          const Z = raw.reduce((a, b) => a + b, 0);
          const m = mk(++mid, ev, 'outright', 'OUTRIGHT', field, raw.map(x => x / Z), null, cat);
          markets.push(m);
        }
      }
    }

    /* Quotes for every market. */
    for (const m of markets) m.quotes = S.priceRows(m.pTrue, m, DEMO_NOW);
    return { events, markets };
  }

  function mk(id, ev, kind, label, outcomes, pTrue, line, cat) {
    const Z = pTrue.reduce((a, b) => a + b, 0);
    return { id: 'm' + id, eventId: ev.id, cat: cat.key, kind,
             eventLabel: ev.label, marketLabel: label,
             outcomes, pTrue: pTrue.map(x => x / Z), line,
             startSec: ev.startSec, isLive: false, pairConfidence: 1 };
  }

  /* --------------------------------------------------------------- PLANTS
     Every plant is VERIFIED BY THE PRODUCTION MATH, not declared. The
     generator calls the same devig, consensus and arb functions the board
     calls, bisects the nudge until the MEASURED value lands in band, and
     records the measured value -- never the target. If the generator and
     the engine ever disagree, the plant fails to converge and the count
     drops, which the self-test catches immediately. */
  function plant(model, venuesById, opts) {
    const rng = S.rngFor('plants');
    const man = { ev: [], arb: [], fakeArb: null, misMap: null,
                  stale: [], thinMarket: null, attempted: 0, skipped: 0 };
    const P = VB.pipe;

    const measure = (m, venueId, side) => {
      const a = P.phaseA(m, venuesById, {});
      const row = a.rows.find(r => r.venueId === venueId && r.side === side);
      return row || null;
    };

    /* 1. Positive-EV plants: nudge ONE soft venue on ONE outcome, bisecting
          the nudge against the real consensus engine until the measured
          edge lands in band. Re-verified AFTER grid snapping, because
          snapping moves the price. */
    const soft = ['bovada','betonline','fanatics','betrivers','espnbet','caesars'];
    /* >20 quotes, not >30: a two-way market with 12 venues has only 24
       quote rows, so a 30-row floor silently excluded every moneyline,
       spread and total from the candidate pool and left only 3-way and
       multi-outcome markets to plant into. */
    const cands = model.markets.filter(m =>
      m.kind !== 'prop' && m.outcomes.length <= 3 && m.quotes.length > 20);

    /* Target the edge in PROBABILITY POINTS, not EV%. Targeting EV% runs
       away on long prices, because EV = p*d - 1 explodes as d grows: a
       modest multiplier on a +2000 draw produces a 1000% "edge" that is a
       generator bug wearing the costume of a plant. Probability points are
       bounded and are also the quantity the noise line is drawn in, so
       aiming here is what makes a plant actually clear the gates. */
    const EP_BAND = [0.026, 0.042];      /* 2.6pp to 4.2pp -- above the ~1.8pp noise
                                            line, below the level that trips the arb gate */
    const EV_SANE = [0.015, 0.140];      /* reject anything outside this outright */
    const want = 12;
    for (const m of cands) {
      if (man.ev.length >= want) break;
      const vid = soft[Math.floor(rng() * soft.length)];
      const ix = Math.floor(rng() * m.outcomes.length);
      const q = m.quotes.find(x => x.venueId === vid && x.outcomeIx === ix);
      if (!q) continue;
      man.attempted++;
      const orig = q.dGross;
      const target = EP_BAND[0] + rng() * (EP_BAND[1] - EP_BAND[0]);

      /* Bisect the price multiplier against the REAL consensus engine.
         Monotone: a longer offered price lowers q_o, so ep = pFair - q_o
         rises. Bracket first, then narrow. */
      let lo = 1.0, hi = 1.0, row = null, ok = false;
      for (let e = 0; e < 8; e++) {
        hi = 1 + (e + 1) * 0.12;
        q.dGross = O.snapToGrid(orig * hi, 'american');
        row = measure(m, vid, m.outcomes[ix]);
        if (row && isFinite(row.ep) && row.ep >= target) { ok = true; break; }
      }
      if (!ok) { q.dGross = orig; man.skipped++; continue; }
      for (let it = 0; it < 24 && hi - lo > 1e-4; it++) {
        const k = 0.5 * (lo + hi);
        q.dGross = O.snapToGrid(orig * k, 'american');
        row = measure(m, vid, m.outcomes[ix]);
        if (!row || !isFinite(row.ep)) break;
        if (row.ep < target) lo = k; else hi = k;
      }
      /* Re-verify AFTER snapping, and reject anything outside the band.
         A plant that did not converge is a generator failure and is
         reverted, never accepted with whatever the last probe happened to
         be -- that is how a 200% EV row reaches a screen. */
      q.dGross = O.snapToGrid(orig * hi, 'american');
      row = measure(m, vid, m.outcomes[ix]);
      /* Verify against the ARB gate too. Making one side long enough to
         carry a 5pp edge can simultaneously push the best-price book sum
         past the 4% implausibility threshold, at which point the production
         engine quarantines the very row we planted -- correctly, but it
         leaves the demo with its best opportunities showing as SUSPECT.
         The plant is only accepted if it survives every gate the board
         applies, which is the whole point of verifying with the real math
         rather than declaring a target. */
      const aAll = P.phaseA(m, venuesById, {});
      const arbChk = P.arbForMarket(m, aAll.rows);
      const arbClean = !arbChk || !arbChk.det.isArb || !arbChk.suspect;
      const good = row && isFinite(row.ep) && arbClean
        && row.ep >= EP_BAND[0] * 0.85 && row.ep <= EP_BAND[1] * 1.35
        && row.evNet >= EV_SANE[0] && row.evNet <= EV_SANE[1]
        && isFinite(row.t) && row.t >= 2.0;
      if (!good) { q.dGross = orig; man.skipped++; continue; }
      man.ev.push({ marketId: m.id, venueId: vid, side: m.outcomes[ix],
                    evMeasured: row.evNet, epMeasured: row.ep,
                    tMeasured: row.t, dGross: row.dGross });
    }

    /* 2. Two genuine arbitrages that survive the fee and commission math.
          Solved for a target book sum below 1, snapped FIRST, then handed
          to the detector -- never the other way round. */
    const twoWay = model.markets.filter(m => m.outcomes.length === 2
      && m.kind !== 'prop' && !man.ev.some(e => e.marketId === m.id));
    for (const m of twoWay) {
      if (man.arb.length >= 2) break;
      const vA = 'betrivers', vB = 'betfair';
      const qA = m.quotes.find(x => x.venueId === vA && x.outcomeIx === 0);
      const qB = m.quotes.find(x => x.venueId === vB && x.outcomeIx === 1);
      if (!qA || !qB) continue;
      const oA = qA.dGross, oB = qB.dGross, oBid = qB.bidProb, oAsk = qB.askProb;
      const targetS = 1 - (0.015 + rng() * 0.015);
      qA.dGross = O.snapToGrid(1 / (m.pTrue[0] * targetS), 'american');
      /* Betfair pays commission on net winnings, so the gross price must be
         solved for the NET target, not set to it. */
      const needNet = 1 / (m.pTrue[1] * targetS);
      const grossNeeded = 1 + (needNet - 1) / (1 - 0.02);
      qB.askProb = clamp(1 / grossNeeded, 0.01, 0.99);
      qB.bidProb = clamp(qB.askProb - 0.01, 0.005, 0.985);
      qB.dGross = O.snapToGrid(grossNeeded, 'cents');
      const rA = measure(m, vA, m.outcomes[0]), rB = measure(m, vB, m.outcomes[1]);
      if (!rA || !rB) { qA.dGross = oA; qB.dGross = oB; qB.bidProb = oBid; qB.askProb = oAsk; continue; }
      const det = VB.arb.detect([rA.dNet, rB.dNet]);
      if (!det.isArb || det.roi < 0.008 || VB.arb.isSuspect(det.roi)) {
        qA.dGross = oA; qB.dGross = oB; qB.bidProb = oBid; qB.askProb = oAsk; continue;
      }
      man.arb.push({ marketId: m.id, venues: [vA, vB], roiMeasured: det.roi,
                     bookSum: det.S, netPrices: [rA.dNet, rB.dNet] });
    }

    /* 3. ONE FAKE arbitrage that exists ONLY if Kalshi's per-contract fee is
          ignored. This is the regression test for fee dispatch: with fees on
          it must NOT be an arb; with fees stubbed to zero it must be one. */
    for (const m of twoWay) {
      if (man.fakeArb) break;
      if (man.arb.some(a => a.marketId === m.id)) continue;
      const qK = m.quotes.find(x => x.venueId === 'kalshi' && x.outcomeIx === 0);
      const qO = m.quotes.find(x => x.venueId === 'draftkings' && x.outcomeIx === 1);
      if (!qK || !qO) continue;
      /* Aim the GROSS book sum just under 1 while the NET sum stays above it. */
      const targetGross = 0.985;
      const pk = clamp(m.pTrue[0] * targetGross, 0.03, 0.95);
      qK.askProb = pk; qK.bidProb = clamp(pk - 0.01, 0.005, 0.94);
      qK.dGross = O.snapToGrid(1 / pk, 'cents');
      qO.dGross = O.snapToGrid(1 / (m.pTrue[1] * targetGross), 'american');
      const kv = venuesById['kalshi'];
      const dNetK = S.netDecimal(qK.dGross, kv);
      const grossSum = 1 / qK.dGross + 1 / qO.dGross;
      const netSum = 1 / dNetK + 1 / qO.dGross;
      if (grossSum < 1 && netSum > 1) {
        man.fakeArb = { marketId: m.id, grossSum, netSum,
                        arbIfFeeIgnored: 1 / grossSum - 1, arbWithFee: 1 / netSum - 1 };
      }
    }

    /* 4. The single most important test case in the dataset: a 9% "edge"
          created by pricing Miami (FL) against Miami (OH). It must land in
          the review queue with confidence < 1.0, must be ABSENT from the
          board in both modes, and must be unstakeable. */
    const ncaaf = model.markets.filter(m => m.cat === 'NCAAF' && m.outcomes.length === 2);
    if (ncaaf.length) {
      const src = ncaaf[0];
      const fake = JSON.parse(JSON.stringify(src));
      fake.id = 'm-mismap';
      fake.eventId = 'e-mismap';
      fake.eventLabel = 'Miami (FL) v Miami (OH)';
      fake.pairConfidence = 0.78;
      fake.mismapNote = 'Miami (FL) priced against Miami (OH)';
      for (const q of fake.quotes) {
        if (q.venueId === 'fanatics' && q.outcomeIx === 0) q.dGross = O.snapToGrid(q.dGross * 1.35, 'american');
      }
      model.markets.push(fake);
      man.misMap = { marketId: fake.id, pairConfidence: 0.78 };
    }

    /* 5. Deliberate staleness: amber, red, and a frozen quote. */
    const stalers = model.markets.filter(m => m.quotes.length > 20).slice(0, 3);
    [[0, 8 * 60], [1, 22 * 60], [2, 95 * 60]].forEach(([i, age]) => {
      const m = stalers[i]; if (!m) return;
      for (const q of m.quotes) if (q.venueId === 'caesars') { q.ageSec = age; q.ts = -age; }
      man.stale.push({ marketId: m.id, venueId: 'caesars', ageSec: age });
    });

    /* 6. One market with only two clusters quoting, to prove the breadth
          gate suppresses it rather than inventing a consensus. */
    const thin = model.markets.filter(m => m.cat === 'NCAAB' && m.outcomes.length > 3)[0]
              || model.markets[model.markets.length - 2];
    if (thin) {
      thin.quotes = thin.quotes.filter(q => q.venueId === 'pinnacle' || q.venueId === 'bovada');
      man.thinMarket = { marketId: thin.id, clusters: 2 };
    }
    return man;
  }
  return { build, plant, DEMO_NOW };
})();

/* ----------------------------------------------------------- L2 pipeline */
VB.pipe = (function () {
  const U = VB.util, O = VB.odds, D = VB.devig, C = VB.consensus,
        K = VB.stake, A = VB.arb, M = VB.multiplicity, SC = VB.score;
  const { clamp } = U;

  const DEFAULTS = {
    lambda: 0.25, R: 0.35,
    minEVPct: 0.020, minEdgePP: 0.010, minT: 2.0,
    minClusters: 3, requireTier1: true, maxAgeMin: 15,
    multiplicityAdjust: true,          /* no toggle */
    accessibleOnly: true,
    arbSuspect: 0.04, quoteOutlierPP: 0.06,
    caps: { maxStakeUnits: 2.0, maxStakePctBankroll: 0.02,
            maxPerEventUnits: 3.0, maxPerPlayerUnits: 2.0,
            maxOpenUnits: 10.0, maxDailyUnits: 10.0 }
  };

  /* Verdict precedence, first match wins. Order matters: a row must not be
     called PASS when the real reason is that its pairing is suspect. */
  const VERDICT_ORDER = ['NO PRICE','SUSPECT','AGED','LIMITED','PASS','THIN','BET'];

  /* PHASE A -- market-derived. Depends on quotes, the venue set and the
     staleness gate. INDEPENDENT of every money setting, which is why
     changing bankroll or risk level cannot move EDGE, t, or the verdict's
     pricing inputs. */
  function phaseA(market, venuesById, opts) {
    const o = Object.assign({}, DEFAULTS, opts || {});
    const nOut = market.outcomes.length;

    /* Group quotes by venue and devig each venue's own complete book. */
    const byVenue = {};
    for (const q of market.quotes) {
      (byVenue[q.venueId] = byVenue[q.venueId] || [])[q.outcomeIx] = q;
    }
    const vList = [], vProbs = [], vMeta = [];
    for (const vid in byVenue) {
      const row = byVenue[vid], v = venuesById[vid];
      if (!v || !v.enabled) continue;
      let complete = true;
      for (let i = 0; i < nOut; i++) if (!row[i]) complete = false;
      if (!complete) continue;         /* an incomplete set cannot be devigged */

      let probs, md = null, bDevig = 0;
      /* An exchange is only an order book if the feed actually carried the
         book. Betfair and Matchbook arrive from The Odds API as plain back
         prices with no depth at all, and midpoint(null, null) is NaN -- one
         such venue in the pool turned every fair price in the market into
         NaN, because a logit pool has no immunity to a single bad member.
         Measured on a 20-book NFL market: 38 of 40 rows lost their fair
         price, and the two that survived were the exchange's own rows,
         which are the only ones that exclude its cluster.
         So the treatment follows the DATA, not the venue's label: with a
         two-sided book, use the mid; with back prices only, de-vig them
         like any other price. The "do not devig an exchange" rule is about
         a MID, which is already near vig-free. A back price is not a mid --
         it carries the exchange's spread on one side, so de-vigging the two
         back prices is the correct treatment, not a double-count. */
      /* Number.isFinite, not the global isFinite, and the difference is the
         whole bug: the global one coerces, so isFinite(null) is true --
         a missing bid reads as present, the mid comes back NaN, and the
         pool it feeds is NaN too. Every depth check here is strict. */
      let hasBook = v.model === 'order_book';
      if (hasBook) {
        for (let i = 0; i < nOut; i++) {
          if (!Number.isFinite(row[i].bidProb) || !Number.isFinite(row[i].askProb)) {
            hasBook = false; break;
          }
        }
      }
      if (hasBook) {
        const mid = [];
        for (let i = 0; i < nOut; i++) mid.push(D.midpoint(row[i].bidProb, row[i].askProb));
        const Z = mid.reduce((a, b) => a + b, 0);
        probs = mid.map(x => x / Z);
        bDevig = 0.003;                /* spread-to-mid uncertainty: an order book
                                          carries less model risk than a devig, but
                                          not none. */
      } else {
        const ds = [];
        for (let i = 0; i < nOut; i++) ds.push(row[i].dGross);
        md = D.medianDevig(ds);
        probs = md.p;
        /* b_devig is a BIAS FLOOR, not just the observed method spread.
           On a symmetric two-way market all four methods coincide, so the
           spread is ~0 -- but agreement is not evidence of correctness:
           every method assumes the book's margin allocation follows one of
           four rules, and they can share the same error. Letting b_devig
           fall to zero produced t values of 20 and a board that looked
           certain about a modelling assumption. */
        bDevig = Math.max(C.B_DEVIG, md.bDevig.reduce((a, b) => a + b, 0) / nOut);
      }
      vList.push(Object.assign({}, v, {
        ageSec: row[0].ageSec,
        spreadCents: row[0].spreadCents,
        limitUsd: v.limitUsd
      }));
      /* A venue that still cannot produce usable probabilities does not
         join the pool at all. Dropping it costs one voter; letting it in
         costs every fair price in the market. */
      let usable = true;
      for (let i = 0; i < nOut; i++) {
        if (!(Number.isFinite(probs[i]) && probs[i] > 0 && probs[i] < 1)) { usable = false; break; }
      }
      if (!usable) { vList.pop(); continue; }
      vProbs.push(probs);
      vMeta.push({ vid, row, md, bDevig, priceOnlyExchange: v.model === 'order_book' && !hasBook });
    }

    /* One offer row per (venue, outcome). Each gets its OWN consensus with
       its entire cluster removed -- the full weight pipeline is re-run per
       offer rather than using the algebraic shortcut, because cluster caps
       reallocate weight when a member is removed and the shortcut is only
       exact if the weights are unchanged. */
    const rows = [];
    for (let vi = 0; vi < vList.length; vi++) {
      const v = vList[vi], meta = vMeta[vi];
      const built = C.build(vList, vProbs, { excludeCluster: v.cluster });
      const all = C.build(vList, vProbs, {});
      for (let ix = 0; ix < nOut; ix++) {
        const q = meta.row[ix];
        const dGross = q.dGross;
        const dNet = VB.seed.netDecimal(dGross, v);
        const qo = 1 / dNet;
        const r = {
          marketId: market.id, eventId: market.eventId, cat: market.cat,
          eventLabel: market.eventLabel, marketLabel: market.marketLabel,
          side: market.outcomes[ix], line: market.line,
          startSec: market.startSec, isLive: !!market.isLive,
          kind: market.kind, playerKey: market.playerKey || null,
          srcId: market.srcId || 'demo',
          venueId: v.id, venueName: v.name, venueTier: v.tier,
          cluster: v.cluster, accessible: !!v.accessible,
          dGross, dNet, qo, ageSec: q.ageSec, limitUsd: v.limitUsd,
          pairConfidence: market.pairConfidence === undefined ? 1 : market.pairConfidence,
          methodNames: meta.md ? meta.md.names : ['orderbook_mid'],
          methodProbs: meta.md ? meta.md.methods : null,
          pOwnDevig: vProbs[vi][ix]
        };
        if (!built.ok) { r.noPrice = built.reason; rows.push(r); continue; }

        r.pFair = built.p[ix];
        r.pFairAll = all.ok ? all.p[ix] : NaN;
        r.vEff = built.vEff;
        r.nVoters = built.nVoters;
        r.nClusters = built.nClusters;
        r.hasT1 = built.hasT1;

        /* Edge against the RAW OFFERED PRICE, never against this venue's own
           devigged probability. That bug roughly doubles the answer -- it
           manufactures edge out of vig -- and it is the single most
           expensive mistake in this class of app. */
        r.ep = r.pFair - r.qo;
        r.evNet = r.pFair * r.dNet - 1;
        r.evGross = r.pFair * r.dGross - 1;

        const seL = built.seLogitByOutcome ? built.seLogitByOutcome[ix] : built.seLogit;
        const se = C.seTotal(r.pFair, seL);
        const ageMin = q.ageSec / 60;
        r.bStale = M.bStale(ageMin);
        r.seSamp = se.seSamp;
        r.seTotal = Math.sqrt(se.seSamp * se.seSamp
                              + meta.bDevig * meta.bDevig
                              + r.bStale * r.bStale);
        r.t = r.seTotal > 0 ? r.ep / r.seTotal : NaN;
        r.signStable = meta.md ? D.signStableFor(meta.md, ix, r.dNet) : true;
        r.outlierThresh = A.quoteOutlierThreshold(v.claHist);
        r.quoteOutlier = A.isQuoteOutlier(r.pOwnDevig, r.pFair, built.nVoters, v.claHist);
        rows.push(r);
      }
    }
    return { rows, nVenues: vList.length };
  }

  /* PHASE B -- multiplicity and gates. M is the count of markets EVALUATED
     this render, not displayed: filtering the board does not refund the
     multiplicity you already paid for. */
  function gate(r, o, M_evaluated) {
    const g = {};
    g.G1 = r.pairConfidence >= 1;
    g.G5 = r.nClusters >= o.minClusters;
    g.G6 = !o.requireTier1 || !!r.hasT1;
    g.G13a = !r.arbSuspect;
    g.G13b = !r.quoteOutlier;
    g.G9 = r.ageSec / 60 <= (o.maxAgeMin || 60);
    g.G12 = !o.accessibleOnly || r.accessible;
    g.G2 = r.evNet >= o.minEVPct;
    g.G3 = r.ep >= o.minEdgePP;
    g.G8 = !!r.signStable;
    g.G10 = r.qo >= 0.02 || r.vEff >= 5;

VB.refcmp = (function () {

     Showing a DraftKings line is worthless -- you can read that on DraftKings.
     Edge requires a second, INDEPENDENT opinion, and the consensus engine

     reachable from a browser, and one of them is an exchange:
       DraftKings (via ESPN)  a soft book, ~4.5% two-sided hold
       Polymarket             an order book, near-zero vig, real liquidity

     book's offered price against it directly. That is NOT a consensus and it
     is not labelled as one -- it is a two-venue reference comparison, which
     is exactly what the architecture recommended: use sharp venues as the
     fair-value reference and score retail books on their distance from it.

     THE LINE PROBLEM, AND WHY IT IS SOLVABLE.
     Measured today: the games match but the lines do not. Polymarket sits on
     half-runs where DraftKings sits on whole numbers (DK 7.0 vs PM 6.5; DK
     11.0 vs PM 10.5 AND 11.5). A 7 may never be compared with a 7.5 -- that
     is the no-tolerance-on-line rule and breaking it invents edge.
     But when the reference BRACKETS the offered whole-number line, the three
     outcome probabilities are EXACTLY derivable, with no interpolation:
       P(over N)  = P(>= N+1) = P(over N+0.5)
       P(push)    = P(over N-0.5) - P(over N+0.5)
       P(under N) = 1 - P(over N-0.5)
     That is an identity, not an estimate. Verified on a live market:
     PM 10.5 -> 0.555, PM 11.5 -> 0.455 gives over 0.4550 / push 0.1000 /

        const line = Number(m[3]);

      if (m && q.outcomes.length === 2 && !/O\/U|spread|:/i.test(title)) {
        const key = norm(m[1]) + '|' + norm(m[2]);
        pool.ml[key] = pool.ml[key] || [];
        pool.ml[key].push({ pAway: q.midProbs[0], pHome: q.midProbs[1],
                            liq, spreadC, endDate: q.endDate, title });
      }
    }
    return pool;
  }

  /* Derive the reference probabilities at the OFFERED line. */
  function refForTotal(entries, line) {
    if (!entries || !entries.length) return null;
    const exact = entries.find(e => Math.abs(e.line - line) < EPS);
    if (exact) {
      /* Half-line: no push, so the mid is the fair probability directly. */
      if (Math.abs(line * 2 - Math.round(line * 2)) < EPS && Math.abs(line - Math.round(line)) > EPS) {
        return { pOver: exact.pOver, pUnder: 1 - exact.pOver, pPush: 0,
                 method: 'exact', liq: exact.liq, note: 'reference quotes this exact line' };
      }
      return { pOver: exact.pOver, pUnder: 1 - exact.pOver, pPush: 0,
               method: 'exact', liq: exact.liq, note: 'reference quotes this exact line' };
    }
    /* Whole-number line bracketed by N-0.5 and N+0.5 -> exact derivation. */
    if (Math.abs(line - Math.round(line)) < EPS) {
      const lo = entries.find(e => Math.abs(e.line - (line - 0.5)) < EPS);
      const hi = entries.find(e => Math.abs(e.line - (line + 0.5)) < EPS);
      if (lo && hi && lo.pOver >= hi.pOver) {
        return { pOver: hi.pOver, pPush: lo.pOver - hi.pOver, pUnder: 1 - lo.pOver,
                 method: 'derived', liq: Math.min(lo.liq, hi.liq),
                 note: 'derived exactly from reference lines ' + (line - 0.5) +
                       ' and ' + (line + 0.5) + ' — no interpolation' };
      }
    }
    /* No bracket, no comparison. Interpolating across a gap would be an
       estimate dressed as a measurement. */
    return null;
  }

  /* EV with a push branch: a push returns the stake, so it is neither a win
     nor a loss and must not be folded into either. */
  function evWithPush(pWin, pLose, dNet) { return pWin * (dNet - 1) - pLose; }

  /* Attach reference figures to the offer rows that can be judged. */
  function apply(rows, pool, venuesById) {
    let matched = 0, skippedLine = 0, noRef = 0;
    const byMarket = {};
    for (const r of rows) byMarket[r.marketId] = byMarket[r.marketId] || [];
    for (const r of rows) {
      r.refFair = null; r.refEdge = null; r.refEV = null; r.refMethod = null;
      /* Only judge a real book's price, and never judge the reference with
         itself. */
      if (r.srcId === 'demo' || r.venueId === 'polymarket') continue;
      const parts = String(r.eventLabel).split(/\s+@\s+/);
      if (parts.length !== 2) { noRef++; continue; }
      const key = norm(parts[0]) + '|' + norm(parts[1]);

      if (r.marketLabel === 'TOTAL' && isFinite(r.line)) {
        const ref = refForTotal(pool.totals[key], r.line);
        if (!ref) { skippedLine++; continue; }
        const isOver = String(r.side).toLowerCase() === 'over';
        const pWin = isOver ? ref.pOver : ref.pUnder;
        const pLose = isOver ? ref.pUnder : ref.pOver;
        r.refFair = pWin;
        r.refPush = ref.pPush;
        r.refEdge = pWin - r.qo;
        r.refEV = evWithPush(pWin, pLose, r.dNet);
        r.refMethod = ref.method;
        r.refNote = ref.note;
        r.refLiq = ref.liq;
        matched++;
      }
      /* Moneylines are deliberately NOT matched here: every Polymarket
         "A vs. B" market on this slate ends a week out, which means it
         settles on a series rather than tonight's game. Same words,
         different contract. */
    }
    return { matched, skippedLine, noRef };
  }
  return { buildPool, refForTotal, apply, evWithPush, norm };
})();

/* ------------------------------------------------------- L2 credit budget */
VB.budget = (function () {
  /* 500 credits a month against 730 hours. Spread uniformly that is 0.68
     credits an hour, which is both unspendable and useless -- odds only
     matter near kickoff, and there are no games at 4am on a Tuesday. So the
     policy is not a rate limit, it is an ALLOCATION:

       1. Scout with free sources first. ESPN costs nothing and answers the
          only question that decides whether a paid pull is worth it: are
          there games, and when do they start?
       2. Spend only inside the value window. A pull 30 hours before kickoff
          buys a line that will move; a pull inside a few hours buys the line
          you can actually bet, at the point soft books lag the sharps.
       3. Buy the reference, not the retail. `regions=eu` carries Pinnacle,
          Betfair and Matchbook for 3 credits; the US region costs another 3
          and mostly duplicates books ESPN already gives away. Measured:
          eu alone returns 21 books with all three sharp anchors.
       4. Keep a hard reserve so the month cannot be emptied by a bad day. */

  const KEY = 'vb.budget';
  const MONTHLY = 500;
  const RESERVE = 60;              /* never spend below this */
  /* The window was 14h, which was wrong -- not arithmetically, but about
     people. It assumed odds are only worth paying for near kickoff. In
     practice the app gets opened when the user thinks about a game, and NFL
     is a weekly league: on a Monday the next game is ~57h out, so a 14h
     window meant the board sat on a single free book all week and could not
     build a fair price at all. A guard that makes the product useless six
     days in seven is not thrift. 72h covers the whole NFL week and both CFB
     Saturdays; the cooldown and the pace guard still cap total spend, and
     they are the guards that actually control the burn. */
  const VALUE_WINDOW_H = 72;       /* only pay for games inside this horizon */
  const MIN_GAP_MIN = 12;          /* never two paid pulls closer than this */

  const monthKey = (d) => {
    const t = d || new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0');
  };
  function read() {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    const k = monthKey();
    if (!o[k]) o[k] = { spent: 0, pulls: 0, lastAt: 0, log: [] };
    return o;
  }
  function write(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }

  function record(credits, note) {
    const o = read(), k = monthKey();
    o[k].spent += credits; o[k].pulls++; o[k].lastAt = Date.now();
    o[k].log.push({ at: Date.now(), credits, note });
    if (o[k].log.length > 200) o[k].log = o[k].log.slice(-200);
    write(o);
    return o[k];
  }

  function status(remainingHeader) {
    const o = read(), k = monthKey(), m = o[k];
    const now = new Date();
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const dayOfMonth = now.getDate();
    const frac = dayOfMonth / daysInMonth;
    /* Trust the API's own counter over the local ledger when we have it --
       the server is authoritative and the local ledger can drift. */
    const remaining = (remainingHeader !== null && remainingHeader !== undefined
                       && isFinite(Number(remainingHeader)))
      ? Number(remainingHeader) : Math.max(0, MONTHLY - m.spent);
    const spent = MONTHLY - remaining;
    const onPaceSpend = MONTHLY * frac;
    return {
      month: k, spent, remaining, pulls: m.pulls, lastAt: m.lastAt,
      daysLeft: daysInMonth - dayOfMonth,
      pace: spent - onPaceSpend,                 /* positive = ahead of budget */
      budgetPerDayLeft: (daysInMonth - dayOfMonth) > 0
        ? (remaining - RESERVE) / (daysInMonth - dayOfMonth) : (remaining - RESERVE),
      reserve: RESERVE, monthly: MONTHLY
    };
  }

  /* Should a paid pull happen right now? Returns a decision plus the reason,
     so the UI can explain a skip instead of looking broken. */
  function decide(opts) {
    const o = opts || {};
    const st = status(o.remainingHeader);
    const cost = o.cost || 3;
    if (st.remaining - cost < RESERVE) {
      return { spend:false, reason:'reserve', st,
        why: 'only ' + st.remaining + ' credits left and ' + RESERVE +
             ' are held in reserve — paid pulls paused until the month rolls over' };
    }
    /* Cooldown, like the other guards, throttles refreshes -- it must not
       block a cold start either. All three guards share one rule: they may
       stop the app spending money it does not need, never stop it working. */
    if (st.lastAt && (Date.now() - st.lastAt) < MIN_GAP_MIN * 60000 && o.haveUsableData) {
      return { spend:false, reason:'cooldown', st,
        why: 'a paid pull ran ' + Math.round((Date.now() - st.lastAt) / 60000) +
             'm ago and a usable pull is loaded; minimum gap is ' + MIN_GAP_MIN + 'm' };
    }
    /* The free scout decides. No games in the window, no spend. */
    const soon = o.gamesWithinH;
    if (soon !== undefined && soon !== null && soon <= 0 && o.haveUsableData) {
      return { spend:false, reason:'no_games', st,
        why: 'no games start within ' + VALUE_WINDOW_H + 'h (checked free via ESPN) and a ' +
             'usable pull is already loaded, so a paid pull would buy lines that move ' +
             'before they matter' };
    }
    /* The pace guard suppresses REFRESHES, never a first fetch.
       Applied unconditionally it starved the board: with nothing cached and
       the month running hot, the app fell back to a single free book and
       could not build a consensus at all -- a budget guard that breaks the
       product is worse than the overspend it prevents. So it only bites when
       usable data is already on screen. */
    if (st.pace > 80 && o.haveUsableData) {
      return { spend:false, reason:'ahead_of_pace', st,
        why: 'running ' + Math.round(st.pace) + ' credits ahead of an even monthly ' +
             'pace and a usable pull is already loaded; use Refresh odds to override' };
    }
    return { spend:true, reason:'ok', st,
      why: soon ? soon + ' game(s) inside the ' + VALUE_WINDOW_H + 'h window · ' +
                  st.remaining + ' credits left' : st.remaining + ' credits left' };
  }
  return { MONTHLY, RESERVE, VALUE_WINDOW_H, MIN_GAP_MIN,
           monthKey, read, record, status, decide };
})();
/*==VB-CORE-END==*/

     The native `title` attribute is not a tooltip: it waits 1-2 seconds, it
     renders in OS chrome you cannot style or wrap, it never fires on touch,
     and it is trivially missed. For a board whose column names are q_o and
     p_c and t, the definition has to appear the moment you point at it or it
     may as well not exist.
     One shared element, positioned on demand, clamped to the viewport, and
     driven by delegated listeners so it costs nothing per row. */
  let TIP = null;
  function ensureTip() {
    if (TIP) return TIP;
    TIP = document.createElement('div');
    TIP.id = 'vbtip';
    TIP.setAttribute('role', 'tooltip');
    document.body.appendChild(TIP);
    return TIP;
  }
  function showTip(el) {
    const txt = el.getAttribute('data-tip');
    if (!txt) return;
    const tip = ensureTip();
    tip.textContent = txt;
    tip.classList.add('on');
    const r = el.getBoundingClientRect();
    /* Measure after the text is in, or the width is stale on the first show. */
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    let top = r.bottom + 8;
    /* Flip above if it would fall off the bottom. */
    if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 8);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { if (TIP) TIP.classList.remove('on'); }
  function initTips() {
    if (initTips.done) return;
    initTips.done = true;
    /* Delegated, so rows re-rendering never leaves a stale listener. */
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el) showTip(el);
    });
    document.addEventListener('mouseout', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el) hideTip();
    });
    /* Keyboard parity: a definition reachable only by mouse is not reachable. */
    document.addEventListener('focusin', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el) showTip(el);
    });
    document.addEventListener('focusout', hideTip);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
    window.addEventListener('scroll', hideTip, true);
  }
  /* "home" and "away" are how the feed labels the sides. They are not how
     anybody thinks about a game -- reading "home -164" forces the user to
     look up which team is home before the number means anything. Every
     surface that shows a side resolves it to the team name instead. */
  function splitTeams(label) {
    for (const sep of [' @ ', ' v ', ' vs ', ' VS ']) {
      const i = String(label || '').indexOf(sep);
      if (i > 0) return { away: label.slice(0, i), home: label.slice(i + sep.length), sep };
    }
    return { away: label || '', home: '', sep: null };
  }
  function sideLabel(market, side) {
    const s = String(side);
    if (s !== 'home' && s !== 'away') return s;      /* over/under, outrights */
    const t = splitTeams(market && market.eventLabel);
    const name = s === 'home' ? t.home : t.away;
    return name ? name : s;
  }
  /* Possessive of a name already ending in s takes a bare apostrophe --
     "DraftKings' line", not "DraftKings's line". */
  const poss = (n) => String(n) + (/s$/i.test(String(n)) ? "'" : "'s");
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

  return { h, t, clear, sgn, cls, money, ago, until, glyph,
           venueChip, sportIcon, registerSprite, SPRITE,
           splitTeams, sideLabel, poss, plural,
           initTips, showTip, hideTip };
})();

/* ---------------------------------------------------------------- charts */
VB.charts = (function () {
  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, a) {
    const e = document.createElementNS(NS, tag);
    for (const k in a) if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
    return e;
  }
  /* 1. Line-movement sparkline. Two series, direct-labelled endpoints, no
        axes. Earns its place because line movement is the best available
        check that an edge is real rather than a stale quote. */
  function movement(series, w, hgt) {
    const W = w || 260, H = hgt || 54, pad = 3;
    const all = series.reduce((a, s) => a.concat(s.pts), []);
    if (!all.length) return svg('svg', { width:W, height:H });
    let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 1e-9) { hi += 0.01; lo -= 0.01; }
    const g = svg('svg', { width:W, height:H, class:'spark', role:'img' });
    const X = (i, n) => pad + (W - pad * 2 - 34) * (n < 2 ? 0 : i / (n - 1));
    const Y = (v) => H - pad - (H - pad * 2) * (v - lo) / (hi - lo);
    series.forEach((s, si) => {
      let d = '';
      s.pts.forEach((v, i) => { d += (i ? ' L' : 'M') + X(i, s.pts.length).toFixed(1) + ' ' + Y(v).toFixed(1); });
      g.appendChild(svg('path', { d, fill:'none', stroke:s.colour, 'stroke-width':2,
                                  'stroke-linecap':'round' }));
      const last = s.pts[s.pts.length - 1];
      g.appendChild(svg('circle', { cx:X(s.pts.length - 1, s.pts.length), cy:Y(last), r:3,
                                    fill:s.colour, stroke:'#ffffff', 'stroke-width':2 }));
      const lab = svg('text', { x:W - 32, y:Y(last) + 3, fill:'#3f4652' });
      lab.textContent = s.label;
      g.appendChild(lab);
    });
    return g;
  }
  /* 2. Venue-score trend small multiples. SHARED y-axis in every panel is
        the entire point: per-panel autoscaling would make a stable venue
        look as volatile as one that collapsed. */
  function smallMultiple(pts, w, hgt, lo, hi, median) {
    const W = w || 118, H = hgt || 30, pad = 2;
    const g = svg('svg', { width:W, height:H, class:'spark', role:'img' });
    const Y = (v) => H - pad - (H - pad * 2) * (v - lo) / Math.max(1e-9, hi - lo);
    if (isFinite(median)) g.appendChild(svg('line', { x1:0, x2:W, y1:Y(median), y2:Y(median),
      stroke:'#dfe3ea', 'stroke-width':1, 'stroke-dasharray':'2 2' }));
    let d = '';
    pts.forEach((v, i) => { d += (i ? ' L' : 'M') +
      (pad + (W - pad * 2) * (pts.length < 2 ? 0 : i / (pts.length - 1))).toFixed(1) + ' ' + Y(v).toFixed(1); });
    g.appendChild(svg('path', { d, fill:'none', stroke:'#3f4652', 'stroke-width':1.5 }));
    const lx = pad + (W - pad * 2), lv = pts[pts.length - 1];
    g.appendChild(svg('circle', { cx:lx, cy:Y(lv), r:2.5, fill:'#1c5cab' }));
    return g;
  }
  /* 3. Calibration curve, bin markers SIZED BY n. Earns its place because it
        is the only honest visual answer to "is this venue's price a
        probability I can trust", and sizing by n puts the sample size in the
        same view as the claim. */
  function calibration(bins, w, hgt) {
    const W = w || 240, H = hgt || 200, pad = 26;
    const g = svg('svg', { width:W, height:H, role:'img' });
    const X = (p) => pad + (W - pad - 8) * p;
    const Y = (p) => H - pad - (H - pad - 8) * p;
    for (let i = 0; i <= 4; i++) {
      const v = i / 4;
      g.appendChild(svg('line', { x1:X(0), x2:X(1), y1:Y(v), y2:Y(v), stroke:'#e7eaf0', 'stroke-width':1 }));
      const tx = svg('text', { x:4, y:Y(v) + 3 }); tx.textContent = v.toFixed(2); g.appendChild(tx);
      const ty = svg('text', { x:X(v) - 8, y:H - 10 }); ty.textContent = v.toFixed(2); g.appendChild(ty);
    }
    g.appendChild(svg('line', { x1:X(0), y1:Y(0), x2:X(1), y2:Y(1),
      stroke:'#b9c0cc', 'stroke-width':1, 'stroke-dasharray':'3 3' }));
    const maxN = Math.max.apply(null, bins.map(b => b.n).concat([1]));
    for (const b of bins) {
      const r = 2.5 + 5.5 * Math.sqrt(b.n / maxN);
      g.appendChild(svg('circle', { cx:X(b.pMean), cy:Y(b.oMean), r,
        fill:'#1c5cab', stroke:'#ffffff', 'stroke-width':2, 'fill-opacity':0.9 }));
    }
    const xl = svg('text', { x:X(0.5) - 22, y:H - 1 }); xl.textContent = 'implied prob';
    g.appendChild(xl);
    return g;
  }
  return { svg, movement, smallMultiple, calibration };
})();

/* ==================== L4  model orchestration + views ================== */
VB.model = (function () {
  const P = VB.pipe, SD = VB.seed;
  let M = null;

  function boot() {
    const t0 = performance.now();

       fabricated on the board. The seed generator remains in the file because
       the self-test suite exercises the math against known inputs, but it no
       longer produces a single row a user can see.
       The cost is real and is disclosed rather than hidden: without observed
       closing lines there is no closing-line accuracy and no Brier, so the
       venue leaderboard falls back to what a live snapshot genuinely
       measures -- hold, coverage and depth. */
    const stats = {};
    const tHist = 0;

    const venues = {}, S = VB.store.get();
    for (const v of SD.VENUES) {
      const c = VB.score.components(stats[v.id]);
      venues[v.id] = Object.assign({}, v, {
        claHist: c ? c.cla : 0,
        /* Consensus weighting uses the SHARPNESS sub-index only. For a
           reference venue you do not care about its limits or breadth, only
           whether its price is right; using the composite here would
           downweight a sharp low-limit book for an irrelevant reason. */
        sharp: 50,

    const t1 = performance.now();

    const manifest = { ev: [], arb: [], fakeArb: null, misMap: null, stale: [],

    const tSlate = performance.now() - t1;

          timing: { hist:tHist, slate:tSlate }, rows:null, byMarket:null };

  }

  /* PHASE A + B + C. M for the noise line is the count of markets EVALUATED,

     paid for. */
  function compute() {
    const t0 = performance.now();
    const S = VB.store.get(), st = S.settings;

       the filter literally on first run guarantees an empty board for a
       reason that has nothing to do with value -- which is precisely the
       "user reads an empty board as broken and loosens the gates" failure
       mode. Until at least one account is marked the filter cannot bind, so
       it is suspended and the suspension is stated on the board. This claims
       nothing on the user's behalf: it asserts no accounts, it just stops
       filtering on an empty set. */
    const nAcc = Object.keys(M.venues).filter(id => M.venues[id].accessible).length;
    const accSuspended = st.accessibleOnly && nAcc === 0;
    M.nAccessible = nAcc; M.accSuspended = accSuspended;
    const opts = Object.assign({}, P.DEFAULTS, {
      minEVPct:st.minEVPct, minEdgePP:st.minEdgePP, minT:st.minT,
      minClusters:st.minClusters, requireTier1:st.requireTier1,
      maxAgeMin:st.maxAgeMin, multiplicityAdjust:st.multiplicityAdjust,
      accessibleOnly: st.accessibleOnly && !accSuspended
    });
    let rows = [], byMarket = {};
    /* Join the feeds before pricing, never after. The consensus, the gates
       and the stake all read one market object, so a game split across two
       feeds has to be one market by the time it reaches phaseA -- otherwise
       the bettable book and the books that judge it are in different
       objects and no edge is computable. Raw per-source markets stay in
       M.slate.markets so refresh-in-place still works; the merge is derived
       and recomputed on every compute. */
    const priced = VB.live.mergeSources(M.slate.markets);
    M.merged = { input: M.slate.markets.length, output: priced.length,
                 joined: priced.filter(m => m.mergedFrom).length };
    for (const m of priced) {
      const a = P.phaseA(m, M.venues, opts);
      const arb = P.arbForMarket(m, a.rows);
      if (arb && arb.det.isArb) {
        for (const r of a.rows) {
          const isLeg = arb.best.some(b => b && b.venueId === r.venueId && b.side === r.side);
          r.inArb = isLeg;
          r.arbRoi = arb.det.roi;

             two-row pairing problem and buried every legitimate PASS
             underneath a SUSPECT verdict it had nothing to do with. */
          r.arbSuspect = arb.suspect && isLeg;

         link opened before the join still resolves after it. */
      if (m.mergedFrom) for (const alias of m.mergedFrom) byMarket[alias] = byMarket[m.id];
      rows = rows.concat(a.rows);

       claim from the consensus and must never be mistaken for one. */

  function medianECrit(rows) {

    return v.length ? v[Math.floor(v.length / 2)] : 0;

  async function loadReference() {

       an end-date window, and PAGINATION. The API silently caps at 100 rows
       per request no matter what `limit` says -- measured: limit=500 returns
       100. One page found 9 game totals and matched nothing; four pages find
       33 and match 3 of 5 DraftKings MLB totals. */
    const end = new Date(Date.now() + 4 * 86400e3).toISOString().slice(0, 10) + 'T00:00:00Z';
    const pages = [0, 100, 200, 300];
    let quotes = [], pagesOk = 0, err = null;
    for (const off of pages) {

                  '&order=volume24hr&ascending=false';

        if (!r.ok) { err = 'HTTP ' + r.status; break; }
        const raw = await r.json();
        if (!Array.isArray(raw) || !raw.length) break;

      } catch (e) { err = String(e.message || e); break; }
    }

                                 classify: err ? 'blocked_cors' : 'empty' };

  async function loadLive(adapterId, opts) {
    const A = VB.adapters, S = VB.store.get();
    const ad = A.byId[adapterId];
    if (!ad) return { ok:false, error:'unknown adapter' };
    const tk = A.take(ad.bucket, 1);
    if (!tk.ok) return { ok:false, error:'rate limited, retry in ' + Math.ceil(tk.waitMs/1000) + 's' };
    let url, cost = 0;

    else if (adapterId === 'polymarket') url = ad.quotesUrl(150);
    else {
      const key = (opts && opts.key) || '';
      if (!key) return { ok:false, error:'no API key' };
      url = ad.quotesUrl(key, opts.sportKey || 'americanfootball_nfl',
                         opts.markets || 'h2h,spreads,totals', 'us');

  function ingest(adapterId, raw, meta) {

    const norm = ad.normalize(raw, meta && meta.cat);
    const now = Date.now();
    let built = [], discovered = [];
    if (adapterId === 'oddsapi') {
      const b = VB.live.marketsFromOddsApi(norm, M.venues, now);
      built = b.markets; discovered = b.discovered;
    } else if (adapterId === 'espn') {
      built = VB.live.marketsFromEspn(norm, M.venues, now);
    } else {

    }

       markets from the same adapter -- and with the leagues fetched in
       parallel, whichever finished last won and the rest vanished. Measured:
       3 leagues loaded, 75 markets built, 0 rows survived. */
    const scope = (meta && meta.cat) ? String(meta.cat) : '_';

       nothing cannot zero out the ones that did. */
    let tm = 0, tq = 0;
    for (const k in scopes) { tm += scopes[k].markets; tq += scopes[k].quotes; }
    M.live[adapterId] = { at: now, markets: tm, quotes: tq, scopes,
                          rejected: norm.rejected, warnings: norm.warnings,
                          discovered, cost: (meta && meta.cost) || 0,
                          quota: (meta && meta.quota) || null };
    const S = VB.store.get();
    let anyLive = false;
    for (const k in M.live) if (M.live[k].markets > 0) anyLive = true;
    S.dataset.mode = anyLive ? 'mixed' : 'seed';
    compute();

             rejected: norm.rejected, warnings: norm.warnings, discovered,
             quota: (meta && meta.quota) || null };
  }
  /* Validate for free before spending credits. Reports the quota headers and
     how many sports the key can see, and classifies the failure so the
     remedy shown is the right one. */
  async function validateKey(key) {
    const ad = VB.adapters.oddsapi;
    try {
      const r = await fetch(ad.validateUrl(key), { mode:'cors', credentials:'omit' });
      const remaining = r.headers.get('x-requests-remaining');
      const used = r.headers.get('x-requests-used');
      if (r.status === 401 || r.status === 403) {
        const b = await r.text();

      }
      if (!r.ok) return { ok:false, classify:'http', error:'HTTP ' + r.status };

    }

    return out;
  }

    if (!M) return;
    M.slate.markets = M.slate.markets.filter(m => m.srcId !== adapterId);
    if (M.live) delete M.live[adapterId];
    const S = VB.store.get();
    S.dataset.mode = (M.live && Object.keys(M.live).length) ? 'mixed' : 'seed';
    compute();
  }

  /* AUTO-LOAD REAL LINES ON OPEN.
     Leaving the live fetch behind a button in Settings meant the app opened
     on synthetic data every time and the banner correctly said so -- which
     reads as "this thing is fake" no matter how much plumbing sits behind
     the button. Real lines are now the default and the seed is the fallback.
     Fired AFTER the first paint so a slow or absent network can never delay
     boot, and each league is independent so one failure does not sink the
     rest. */
  const AUTO_LEAGUES = ['NFL', 'NCAAF', 'MLB', 'NBA', 'NHL', 'NCAAB'];
  /* Multi-book leagues are fetched from The Odds API, which is METERED:
     1 credit = 1 sport x 1 market x 1 region, so h2h+spreads+totals on one
     league costs 3. The free tier is 500/month, so a naive fetch-on-every-
     open at 6 leagues would burn 18 credits a visit and exhaust the month in
     27 opens. Hence: a small default league set, and a cache with a TTL so
     reopening the page inside the window costs nothing. */
  const ODDS_LEAGUES = { NFL:'americanfootball_nfl', NCAAF:'americanfootball_ncaaf',
                         MLB:'baseball_mlb', NBA:'basketball_nba',
                         NHL:'icehockey_nhl', NCAAB:'basketball_ncaab' };
  const ODDS_DEFAULT = ['NFL', 'NCAAF'];
  const ODDS_TTL_MS = 15 * 60 * 1000;
  /* A cache is a cost saver, not a fallback of last resort. Serving a
     six-hour-old pull as if it were current would show yesterday's slate
     with today's date on it -- the worst kind of wrong, because it looks
     fine. Past this age the cache is discarded rather than displayed. */
  const ODDS_STALE_MAX_MS = 3 * 60 * 60 * 1000;
  const CACHE_KEY = 'vb.oddscache';

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function writeCache(c) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); return true; }
    catch (e) { return false; }   /* over quota: run uncached rather than fail */
  }

  /* Fetch one league from The Odds API, or serve it from cache. Returns the
     credits actually spent so the UI can report the real number. */
  async function loadOddsLeague(cat, key, opts) {
    const o = opts || {};
    const sportKey = ODDS_LEAGUES[cat];
    if (!sportKey) return { ok:false, error:'unknown league' };
    const cache = readCache();
    const hit = cache[cat];
    const fresh = hit && (Date.now() - hit.at) < ODDS_TTL_MS;
    if (o.cacheOnly) {
      const usable = hit && (Date.now() - hit.at) < ODDS_STALE_MAX_MS;
      if (!usable) return { ok:false, error:'no usable cache', credits:0 };
      const r = ingest('oddsapi', hit.raw, { cost:0, cat, cached:true });
      return Object.assign({ cached:true, credits:0, ageMs: Date.now() - hit.at }, r);
    }
    if (fresh && !o.force) {
      const r = ingest('oddsapi', hit.raw, { cost:0, cat, cached:true });
      return Object.assign({ cached:true, ageMs: Date.now() - hit.at, credits:0 }, r);
    }
    const ad = VB.adapters.oddsapi;
    /* us,eu — NOT us alone. Measured: the US region returns only retail
       books (DraftKings, FanDuel, BetMGM, BetRivers, Bovada, BetOnline), all
       tier 2/3, so the sharp-anchor gate correctly refused all 896 consensus
       rows with "no sharp venue in consensus". The EU region carries
       Pinnacle, Betfair and Matchbook — the three references the gate needs,
       and Pinnacle's hold measured 3.27% against retail's 4.0–6.4%.
       Cost is 2 regions x 3 markets = 6 credits per league. */
    /* REGION STRATEGY. `eu` alone carries Pinnacle, Betfair and Matchbook --
       measured: 21 books, all three sharp anchors -- for 3 credits. Adding
       `us` costs another 3 and mostly duplicates DraftKings/FanDuel/BetMGM,
       and DraftKings already arrives FREE from ESPN. So the default buys the
       REFERENCE and takes the bet target for nothing: same analysis, half
       the credits, 166 league-pulls a month instead of 83. */
    const regions = (VB.store.get().settings.oddsRegions) || 'eu';
    const url = ad.quotesUrl(key, sportKey, 'h2h,spreads,totals', regions);
    try {
      const resp = await fetch(url, { mode:'cors', credentials:'omit' });
      const remaining = resp.headers.get('x-requests-remaining');
      const used = resp.headers.get('x-requests-last');
      if (!resp.ok) {
        const b = await resp.text();
        /* Out of quota or bad key: fall back to a stale cache rather than
           showing nothing. */
        const usable = hit && (Date.now() - hit.at) < ODDS_STALE_MAX_MS;
        if (usable) {
          const r = ingest('oddsapi', hit.raw, { cost:0, cat, cached:true });
          return Object.assign({ cached:true, stale:true, credits:0,
            ageMs: Date.now() - hit.at,
            warn:'HTTP ' + resp.status + ' — showing a cached pull from ' +
                 Math.round((Date.now() - hit.at) / 60000) + 'm ago' }, r);
        }
        if (hit) return { ok:false, error:'HTTP ' + resp.status +
          ', and the cached pull is ' + Math.round((Date.now() - hit.at) / 3600000) +
          'h old — too stale to show', classify:'stale_cache' };
        return { ok:false, error:'HTTP ' + resp.status + ': ' + b.slice(0, 140),
                 classify: resp.status === 401 ? 'unauthorized'
                         : resp.status === 429 ? 'rate_limited' : 'http' };
      }
      const raw = await resp.json();
      VB.budget.record(Number(used) || 3, cat + ' ' + regions);
      cache[cat] = { at: Date.now(), raw };
      writeCache(cache);
      const r = ingest('oddsapi', raw, { cost: Number(used) || 3, cat, quota:{ remaining, used } });
      M.oddsQuota = { remaining, at: Date.now() };
      return Object.assign({ cached:false, credits: Number(used) || 3, remaining }, r);
    } catch (e) {
      const usable2 = hit && (Date.now() - hit.at) < ODDS_STALE_MAX_MS;
      if (usable2) {
        const r = ingest('oddsapi', hit.raw, { cost:0, cat, cached:true });
        return Object.assign({ cached:true, stale:true, credits:0,
          ageMs: Date.now() - hit.at,
          warn:'offline — showing a cached pull from ' +
               Math.round((Date.now() - hit.at) / 60000) + 'm ago' }, r);
      }
      return { ok:false, error:String(e.message || e), classify:'blocked_cors' };
    }
  }
  let autoState = { running:false, done:false, ok:0, failed:0, markets:0, errors:[] };
  function autoStatus() { return autoState; }

  async function autoLoadLive(onProgress) {
    if (autoState.running || autoState.done) return autoState;
    autoState.running = true;
    const refP = loadReference();
    /* Multi-book first: it is the only source that can produce a consensus,
       so it defines the board. ESPN then fills in leagues the key was not
       spent on. */
    const S0 = VB.store.get();
    const key = (S0.keys && S0.keys.oddsapi) || '';
    if (key) {
      autoState.oddsLeagues = [];
      /* SCOUT FREE FIRST. ESPN costs nothing and answers the only question
         that decides whether a paid pull is worth it: are there games, and
         when. Spending credits to discover that there are no games tonight
         is the single easiest way to waste this budget. */
      let gamesSoon = null;
      try {
        await Promise.all(ODDS_DEFAULT.map(c => loadLive('espn', { cat:c }).catch(() => null)));
        const horizon = VB.budget.VALUE_WINDOW_H * 3600;
        const evs = {};
        for (const r of (M.rows || [])) {
          if (ODDS_DEFAULT.indexOf(r.cat) < 0) continue;
          if (isFinite(r.startSec) && r.startSec <= horizon) evs[r.eventId] = 1;
        }
        gamesSoon = Object.keys(evs).length;
      } catch (e) { gamesSoon = null; }
      autoState.scout = { gamesSoon };

      for (const cat of ODDS_DEFAULT) {
        /* Do we already have something worth showing for this league? If
           not, the guards must not block the fetch. */
        const cache0 = readCache();
        const hit0 = cache0[cat];
        /* "Usable" has to mean usable FOR THE THING THE APP DOES. A cached
           pull carrying one or two books is bytes on disk, not a board: the
           consensus gate needs 3 independent groups, so a two-book cache
           leaves every market unpriced. Treating that as usable is what let
           the pace and no-games guards sit on a one-book board -- the guards
           were right, the predicate was wrong. */
        const fresh0 = !!(hit0 && (Date.now() - hit0.at) < ODDS_STALE_MAX_MS);
        let cachedBooks = 0;
        if (fresh0) {
          const seen = {};
          for (const ev of (Array.isArray(hit0.raw) ? hit0.raw : [])) {
            for (const bk of (ev.bookmakers || [])) seen[bk.key] = 1;
          }
          cachedBooks = Object.keys(seen).length;
        }
        const haveUsable = fresh0 && cachedBooks >= 3;
        const dec = VB.budget.decide({ gamesWithinH: gamesSoon, cost: 3,
          haveUsableData: haveUsable,
          remainingHeader: (M.oddsQuota && M.oddsQuota.remaining) });
        autoState.decision = dec;
        if (!dec.spend) {
          /* Serve whatever is cached rather than spending; if nothing is
             cached the free feeds already loaded above are the board. */
          const r = await loadOddsLeague(cat, key, { cacheOnly:true }).catch(() => null);
          autoState.oddsLeagues.push({ cat, ok:!!(r && r.ok), skipped:dec.reason,
            why:dec.why, credits:0, markets:(r && r.markets) || 0, cached:true });
          continue;
        }
        try {
          const r = await loadOddsLeague(cat, key, {});
          autoState.oddsLeagues.push({ cat, ok:!!r.ok, markets:r.markets || 0,
            books:(r.discovered || []).length, credits:r.credits || 0,
            cached:!!r.cached, stale:!!r.stale, ageMs:r.ageMs || 0,
            warn:r.warn, remaining:r.remaining, error:r.error });
          if (r.ok) { autoState.ok++; autoState.markets += (r.markets || 0); }
          else autoState.errors.push(cat + ': ' + (r.error || 'no data'));
        } catch (e) { autoState.errors.push(cat + ': ' + String(e.message || e)); }
      }
    }
    const espnOnly = AUTO_LEAGUES.filter(c => !key || ODDS_DEFAULT.indexOf(c) < 0);
    const results = await Promise.all(espnOnly.map(async (cat) => {
      try {
        const r = await loadLive('espn', { cat });
        return { cat, ok: !!r.ok, markets: r.markets || 0, error: r.error };
      } catch (e) { return { cat, ok:false, markets:0, error:String(e.message || e) }; }
    }));
    for (const r of results) {
      if (r.ok && r.markets) { autoState.ok++; autoState.markets += r.markets; }
      else if (!r.ok) { autoState.failed++; autoState.errors.push(r.cat + ': ' + (r.error || 'no data')); }
    }
    const refR = await refP;
    autoState.ref = refR;
    autoState.running = false; autoState.done = true;
    /* If real lines arrived, show them. Mixing 7,000 synthetic rows into the
       default view is what buried them last time. */
    if (autoState.markets > 0) {
      const S = VB.store.get();
      if (!S.ui.srcTouched) S.ui.src = 'real';
    }
    compute();
    if (onProgress) onProgress(autoState);
    return autoState;
  }

  /* ---------------------------------------------------------- REFRESH
     The two source classes cannot share a refresh policy, because one is
     free and one is metered.
       ESPN + Polymarket : free, so they refresh on a short timer.
       The Odds API      : 6 credits per league per pull. Two leagues is 12,
                           so a 15-minute loop would spend 48/hour and
                           exhaust a 500-credit month in about 10 hours of an
                           open tab. It is therefore MANUAL by default, with
                           an opt-in timer that states its burn rate.
     A hidden tab never refreshes either class -- polling a background tab is
     pure waste, and for the metered source it is waste that costs money. */
  const FREE_REFRESH_MS = 3 * 60 * 1000;
  let timers = { free:null, paid:null };
  let refreshState = { lastFree:0, lastPaid:0, paidAuto:false, running:false };

  async function refreshFree(onDone) {
    if (document.visibilityState === 'hidden') return;
    if (refreshState.running) return;
    refreshState.running = true;
    try {
      const key = (VB.store.get().keys || {}).oddsapi || '';
      const espnCats = AUTO_LEAGUES.filter(c => !key || ODDS_DEFAULT.indexOf(c) < 0);
      await Promise.all(espnCats.map(c => loadLive('espn', { cat:c }).catch(() => null)));
      await loadReference().catch(() => null);
      refreshState.lastFree = Date.now();
    } finally { refreshState.running = false; }
    compute();
    if (onDone) onDone();
  }

  async function refreshPaid(onDone, opts) {
    const o = opts || {};
    if (!o.force && document.visibilityState === 'hidden') return { skipped:'hidden' };
    const key = (VB.store.get().keys || {}).oddsapi || '';
    if (!key) return { skipped:'no key' };
    if (refreshState.running) return { skipped:'busy' };
    refreshState.running = true;
    let spent = 0, remaining = null;
    try {
      for (const cat of ODDS_DEFAULT) {
        const r = await loadOddsLeague(cat, key, { force: !!o.force });
        spent += r.credits || 0;
        if (r.remaining) remaining = r.remaining;
      }
      refreshState.lastPaid = Date.now();
    } finally { refreshState.running = false; }
    compute();
    if (onDone) onDone();
    return { spent, remaining };
  }

  /* Credit burn if the metered timer were left running. Shown BEFORE the
     toggle is flipped, not discovered afterwards. */
  function burnRate(intervalMin) {
    const perPull = ODDS_DEFAULT.length * 6;
    return { perPull, perHour: perPull * (60 / intervalMin),
             perDay: perPull * (1440 / intervalMin),
             hoursToExhaust: 500 / (perPull * (60 / intervalMin)) };
  }

  function startTimers(onTick) {
    if (timers.free) clearInterval(timers.free);
    timers.free = setInterval(() => refreshFree(onTick), FREE_REFRESH_MS);
    document.addEventListener('visibilitychange', () => {
      /* Catch up once on return rather than on a schedule while hidden. */
      if (document.visibilityState === 'visible' &&
          Date.now() - refreshState.lastFree > FREE_REFRESH_MS) refreshFree(onTick);
    });
  }
  function setPaidAuto(on, intervalMin, onTick) {
    refreshState.paidAuto = !!on;
    if (timers.paid) { clearInterval(timers.paid); timers.paid = null; }
    if (on) timers.paid = setInterval(() => refreshPaid(onTick), (intervalMin || 15) * 60000);
  }
  const refreshStatus = () => refreshState;

  const get = () => M;
  return { boot, compute, get, loadLive, ingest, liveStats, clearLive, validateKey,
           refreshFree, refreshPaid, startTimers, setPaidAuto, refreshStatus,
           burnRate, FREE_REFRESH_MS,
           autoLoadLive, autoStatus, AUTO_LEAGUES, loadReference,
           loadOddsLeague, ODDS_LEAGUES, ODDS_DEFAULT, ODDS_TTL_MS, readCache };
})();

VB.views = (function () {

  const O = VB.odds, K = VB.stake, MU = VB.multiplicity;

  /* --------------------------------------------------------- filter row */

  const GLOSS = {

  /* ------------------------------------------------------------- board */
  function board(cat, mode) {
    const S = VB.store.get(), M = VB.model.get(), st = S.settings;
    const wrap = h('div');
    const srcSel = 'real';
    let rows = M.rows.filter(r => cat === 'all' || r.cat === cat);
    const census = {};
    for (const r of rows) census[r.verdict] = (census[r.verdict] || 0) + 1;

    /* "Real only" is an explicit request to see real prices, so it is not
       then filtered down to bettable rows -- that combination is what made

    const cols = C;

    const thead = h('thead', {}, h('tr', {}, cols.map(c => {
      const on = S.ui.sort === c[0];

        'data-tip': gl || null, tabindex: gl ? '0' : null,

      /* The label is wrapped so the dotted underline marks exactly the text,

      th.appendChild(h('span', { class: gl ? 'gl' : '' }, c[1]));

    })));

    const tb = h('tbody');
    let linePlaced = false;
    for (const r of view) {
      /* The noise line is drawn LITERALLY across the sorted board. */
      /* The line marks where edge stops clearing e_crit -- NOT where the

      if (!linePlaced && S.ui.sort === 't' && dir < 0 && isFinite(r.eAdj) && r.eAdj <= 0) {

        linePlaced = true;
      }
      tb.appendChild(boardRow(r, cols, st));
    }
    const table = h('table', {}, [
      h('caption', {}, (function () {
        /* The caption has to describe THIS table, not the app's default
           state: labelling live DraftKings prices "synthetic" is exactly the

        const nReal = view.filter(r => r.srcId !== 'demo').length;
        const scope = (cat === 'all' ? 'all categories' : cat);
        const counts = view.length + ' of ' + rows.length + ' rows';
        let prov;
        if (nReal === view.length && view.length) {

        } else if (nReal) {

      })()),
      thead, tb]);
    wrap.appendChild(table);
    if (layout !== 'games' && rows.length > cap) {
      wrap.appendChild(h('div', { class:'small muted', style:'padding:6px 2px' },

    return wrap;

  const hasConsSort = (rows) => rows.some(r => r.nClusters >= 3 && isFinite(r.t));
  function pick(r, k) {
    if (k === 'event') return 0;
    if (k === 'venue') return 0;
    if (k === 'start') return -(r.startSec || 0);
    if (k === 'verdict' || k === 'why' || k === 'cat' || k === 'side' || k === 'market' || k === 'g') return 0;

        case 'event': td.className = 'k';

          td.textContent = trunc(r.eventLabel, 38);

          break;
        case 'market': td.textContent = r.marketLabel + (r.line !== null && r.line !== undefined ? ' ' + r.line : ''); break;
        case 'side': td.textContent = trunc(String(r.side), 10); break;
        case 'venue': {
          /* Brand chip + name. All the chroma in this app lives here: chrome
             is achromatic by measurement (a coloured accent collides with the
             coloured polarity pair at normal dE 9.9), so 19 distinct brand
             hues are what make a row scannable by book at a glance. */
          const cell = h('span', { class:'vcell' });
          cell.appendChild(VB.dom.venueChip(r.venueId, 18));
          cell.appendChild(h('span', {}, trunc(r.venueName, 13)));
          td.appendChild(cell);
          break;
        }
        case 'dGross': {
          /* A price is a thing you press, so it renders as a bordered pill

          td.className = 'r k';

        case 'qo': td.textContent = isFinite(r.qo) ? (r.qo * 100).toFixed(1) + '%' : '--'; break;
        case 'refFair': td.textContent =
