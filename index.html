<!DOCTYPE html>
<html lang="en" data-vb-boot="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO · Edge Board</title>
<!-- Error handlers install BEFORE anything else. A blank page with an error
     only in the console is the number one single-file failure mode, and most
     users never open devtools. This turns it into a visible message. -->
<script>
window.__vbErrs = [];
window.onerror = function (m, s, l, c, e) {
  window.__vbErrs.push({ m: String(m), l: l, c: c, stack: e && e.stack });
  document.documentElement.dataset.vbBoot = 'error';
};
window.onunhandledrejection = function (ev) {
  window.__vbErrs.push({ m: 'unhandled rejection: ' + ev.reason });
  document.documentElement.dataset.vbBoot = 'error';
};
</script>
<style>
/* ============================================================================
   EDGE BOARD — "SPORTSBOOK" visual system.

   Deliberately diverged from every other app on this machine. Measured, not
   guessed — these are the lanes already occupied and therefore forbidden:
     intrinsics      dark + neon green #00ff41 + heavy outer glow
     tarkov-companion dark warm olive/tan, 26 uppercase + 33 letter-spacing +
                      50 monospace rules, dense tables   <-- the collision
     hub-preview / fpa-hub  flat light cool grey + Indeed blue #2557a7
     finygles-live   dark brown/orange
     calculator      light, 16px radius, minimal
   So: cool white CARDS on cool grey, a cool near-black header (not warm),
   MIXED CASE with no tracking, BOLD SANS figures (not mono), 8px radius, and
   the chroma carried by per-venue BRAND CHIPS rather than by chrome. That last
   point is what makes it read as a book rather than a terminal, and it is also
   forced by measurement:

     navy #1c5cab + oxide #a3201a               CVD dE 22.9  PASS
     navy + oxide + indigo accent #4338ca       normal dE 9.9  FAIL

   A coloured brand accent collides with a coloured polarity pair. Chrome is
   therefore achromatic and the brand colour lives in the venue chips, where
   19 mutually distinct hues are the point.

   MEASURED text contrast (vs card #ffffff / page #f1f3f6 / head #12141a):
     ink        #101319   19.28 / 17.35 / —
     ink-2      #3f4652    9.61 /  8.65 / —
     ink-3      #667081    5.14 /  4.63 / —
     pos        #1c5cab    6.66 /  5.99 / —      neg #a3201a  7.59 / 6.83
     warn       #8a5a00    5.95 /  5.35          serious #9a4b12  6.22 / 5.60
     on-head    #f7f9fc    —    /  —    / 16.4
   ============================================================================ */
:root {
  --bg-page:#f1f3f6; --bg-surface:#ffffff; --bg-raised:#e7eaf0; --bg-row-alt:#fafbfc;
  --bg-hover:#eef1f6; --bg-head:#0b1220; --on-head:#f7fafd;
  --border:#dfe3ea; --border-strong:#b9c0cc; --rule:#eceff4;
  --text-primary:#101319; --text-secondary:#3f4652; --text-muted:#667081;
  --grid:#e7eaf0; --axis:#b9c0cc;
  /* POLARITY moved to the betting convention: green up, red down.
     Measured: green #0b7a3b vs red #c62828 is CVD dE 6.4 (deutan), which sits
     in the band that is legal ONLY with secondary encoding. This app ships
     four kinds — a leading +/- on every signed number, the 4-state density
     glyph, the verdict word, and a full no-colour mode — so the band is
     satisfied. It is also a real improvement on the 4.1 this pair scores at
     the usual brighter steps. The pair against the brand blue clears
     all-pairs: CVD 6.4, normal 29.1, ALL CHECKS PASS. */
  --pos:#0b7a3b; --neg:#c62828; --neg-mark:#a31515;
  --warn:#8a5a00; --serious:#9a4b12; --neutral:#3f4652;
  /* Brand blue is the interactive colour and it is measurably clear of both
     polarity inks (normal dE 29.1), so a price button can never be misread
     as a signed figure. */
  --brand:#1493ff; --brand-ink:#0a63b0; --brand-wash:#eaf4ff;
  --accent:#0a63b0; --focus:#1493ff; --tier1:#0a63b0;
  --s1:#00897b; --s2:#b8860b; --s3:#d55181;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:var(--sans);
  --row-h:32px; --r:10px; --r-sm:8px;
  --h-strip:26px; --h-nav:38px; --h-chrome:64px; --h-filters:84px;
  --shadow:0 1px 2px rgba(16,19,25,.06), 0 1px 8px rgba(16,19,25,.04);
}
html[data-nocolour="1"] {
  --pos:var(--text-primary); --neg:var(--text-primary); --neg-mark:var(--text-primary);
  --warn:var(--text-secondary); --serious:var(--text-secondary); --neutral:var(--text-secondary);
  --tier1:var(--text-primary); --s1:#101319; --s2:#3f4652; --s3:#667081;
}
html[data-nocolour="1"] .vchip{filter:grayscale(1)}
html[data-nocolour="1"] .spark path:nth-of-type(2){stroke-dasharray:5 3}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg-page);color:var(--text-primary);font-family:var(--sans);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-top:var(--h-chrome)}
a{color:var(--brand-ink);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}

/* Controls: soft, tappable, mixed case. No uppercase, no tracking — that
   register is what read as tarkov-companion. */
button,select,input{font-family:var(--sans);font-size:12.5px;color:var(--text-primary);
  background:var(--bg-surface);border:1px solid var(--border-strong);
  border-radius:var(--r-sm);padding:5px 11px}
button{cursor:pointer;font-weight:600;box-shadow:var(--shadow)}
button:hover{background:var(--bg-hover)}
button.pri{background:var(--brand);border-color:var(--brand);
  color:#fff;font-weight:700}
button.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
input{box-shadow:none}
input:focus,select:focus{border-color:var(--focus);outline:none;
  box-shadow:0 0 0 3px rgba(20,147,255,.22)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Figures are BOLD SANS + tabular. Mono is reserved for literal machine
   strings (ids, the filter arithmetic) and appears almost nowhere. */
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* SYNTHETIC BANNER — undismissable. Solid amber bar, no hatch: the hatch was
   part of the printed-instrument register. */
/* Fixed height and a single clipped line. A provenance strip that wraps
   pushes into the nav and breaks every sticky offset below it. */
#demostrip{position:fixed;top:0;left:0;right:0;height:var(--h-strip);z-index:60;
  background:#ffd24a;border-bottom:1px solid #d9a400;display:flex;align-items:center;
  gap:9px;padding:0 14px;font-size:11.5px;color:#3d2a00;font-weight:700;
  white-space:nowrap;overflow:hidden}
#demostrip>span:first-child{flex:0 0 auto}
#demostrip .sep{color:#5c4200;font-weight:500;overflow:hidden;text-overflow:ellipsis;
  min-width:0}
/* The strip is a provenance indicator, not decoration, so it changes state:
   amber = synthetic, blue = fetching, green = real lines loaded. */
#demostrip.fetching{background:#cfe6ff;border-bottom-color:#1493ff;color:#0a3c66}
#demostrip.fetching .sep{color:#14527f}
#demostrip.liveok{background:#d7f2dd;border-bottom-color:#0b7a3b;color:#0a3d1f}
#demostrip.liveok .sep{color:#155c31}

/* HEADER — a dark stadium band. Cool near-black, NOT the warm #0e100f that
   tarkov uses. Tabs are pills, mixed case. */
nav{position:fixed;top:var(--h-strip);left:0;right:0;height:var(--h-nav);z-index:55;
  background:var(--bg-head);border-bottom:0;display:flex;align-items:center;gap:3px;
  padding:0 12px;overflow-x:auto}
nav a{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:rgba(247,249,252,.62);white-space:nowrap;text-decoration:none}
nav a:hover{color:var(--on-head);background:rgba(255,255,255,.09)}
nav a.on{background:var(--brand);color:#fff;font-weight:700}
nav .grow{flex:1}
nav .clock{font-size:11.5px;color:rgba(247,249,252,.58);white-space:nowrap;
  font-variant-numeric:tabular-nums}

main{padding:12px 14px 64px}
/* The board is genuinely wider than most viewports. The PAGE scrolls
   horizontally rather than a wrapper div, because an overflow container
   would create a clipping context and break `position:sticky` on thead --
   the same trap as `overflow:hidden` on the table. */
.tscroll{overflow-x:visible}
.widehint{font-size:11.5px;color:var(--text-muted);padding:4px 2px 0}
h1{font-size:21px;font-weight:700;letter-spacing:-.012em;margin-bottom:3px}
h2{font-size:14px;font-weight:700;letter-spacing:-.004em;color:var(--text-primary);
  margin:18px 0 8px}
.sub{font-size:12.5px;color:var(--text-secondary);margin-bottom:10px;max-width:82ch}
.muted{color:var(--text-muted)}
.small{font-size:11.5px}

/* CARDS, not ruled blocks. Soft border, soft shadow, real radius. */
.panel{background:var(--bg-surface);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 14px;margin-bottom:11px;box-shadow:var(--shadow)}
.row{display:flex;gap:13px;flex-wrap:wrap;align-items:center}
.cols{display:flex;gap:11px;flex-wrap:wrap}
.cols>.panel{flex:1;min-width:290px}

#filters{position:sticky;top:var(--h-chrome);z-index:40;background:var(--bg-page);
  border:0;border-bottom:1px solid var(--border);border-radius:0;
  padding:8px 2px 7px;margin-bottom:2px}
#filters .row{flex-wrap:nowrap;gap:6px}
/* Sports scroll horizontally on their own line; the control row never
   scrolls, so the layout and mode toggles can never be clipped off-screen
   the way they were when all 21 chips shared one nowrap line. */
#filters .catrow{overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
#filters .ctlrow{overflow:visible;margin-top:7px;flex-wrap:wrap;row-gap:6px}
#filters .ctlrow>.row{gap:6px;flex-wrap:nowrap}
#filters .arith{font-family:var(--mono);font-size:11px;color:var(--text-muted);
  margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sport chips carry an ICON. Pills, mixed case, white on grey. */
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;
  border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:600;
  color:var(--text-secondary);cursor:pointer;background:var(--bg-surface);
  white-space:nowrap;box-shadow:var(--shadow)}
.chip:hover{background:var(--bg-hover);color:var(--text-primary)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;
  font-weight:700}
.chip .sicon{width:15px;height:15px;flex:0 0 15px}

/* ---------------------------------------------------------------- TABLE
   Still 22 columns and still dense, but it now sits INSIDE a white card with
   a radius, which is what stops it reading as a terminal. */
/* NOTE: no `overflow:hidden` here. It clips the border-radius nicely and it
   also creates a clipping context that BREAKS `position:sticky` on thead --
   the header detaches and floats mid-table. Corners are rounded on the edge
   cells instead, which keeps sticky working. */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow)}
thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r)}
tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r)}
caption{caption-side:top;text-align:left;font-size:11.5px;color:var(--text-muted);
  padding:2px 2px 7px;background:transparent}
thead th{position:sticky;top:calc(var(--h-chrome) + var(--h-filters) - 2px);z-index:30;
  background:var(--bg-raised);text-align:left;font-size:11px;font-weight:700;
  color:var(--text-secondary);padding:7px 9px;border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none}
thead th.r{text-align:right}
thead th:hover{color:var(--text-primary)}
tbody td{padding:4px 9px;border-bottom:1px solid var(--rule);height:var(--row-h);
  white-space:nowrap;vertical-align:middle}
tbody td.r{text-align:right;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1}
tbody tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:var(--bg-row-alt)}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.sel,tbody tr.sel:hover{background:var(--brand-wash);
  box-shadow:inset 3px 0 0 var(--brand)}
tbody tr.v-PASS td,tbody tr.v-NOPRICE td{color:var(--text-muted)}
tbody tr.v-BET td{color:var(--text-primary)}
tbody tr.v-BET td.k{font-weight:700}
tbody td.k{font-weight:600}

/* Density glyph: kept, because it is the CVD/greyscale carrier, but demoted
   to a quiet margin so it no longer dominates the row. */
.g{font-family:var(--mono);font-size:11px;letter-spacing:-1px;color:var(--border-strong);
  text-align:center;width:1%;padding:0 6px}
.pos{color:var(--pos);font-weight:600}
.neg{color:var(--neg);font-weight:600}
.warn{color:var(--warn);font-weight:600}

/* ODDS PILL — the single most book-like element. A price is a thing you press,
   so it is a bordered pill with a bold figure, not a bare table number. */
/* THE ANSWER TILE — verdict, one sentence, and a fair-vs-best grid. This is
   the whole point of clicking into a game: an answer, not a reading task. */
.answer{background:var(--bg-surface);border:1px solid var(--border);
  border-left:4px solid var(--neg);border-radius:var(--r);padding:14px 16px;
  margin:10px 0 12px;box-shadow:var(--shadow)}
.answer.yes{border-left-color:var(--pos)}
.ahead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.averdict{font-size:13px;font-weight:800;letter-spacing:.02em;padding:3px 11px;
  border-radius:999px;color:#fff;white-space:nowrap}
.averdict.no{background:var(--neg)}
.averdict.yes{background:var(--pos)}
/* NO CALL is not a negative verdict, it is the absence of one, so it must not
   wear the same red as "we priced this and it is bad". */
.averdict.na{background:var(--text-muted)}
.answer.na{border-left-color:var(--border-strong)}
.aline{font-size:17px;font-weight:700;letter-spacing:-.01em}
.asent{margin-top:9px;font-size:13px;color:var(--text-secondary);max-width:88ch;
  line-height:1.5}
.agrid{display:grid;grid-template-columns:minmax(90px,1fr) 110px minmax(190px,1.3fr) 90px;
  gap:7px 14px;margin-top:13px;align-items:center}
.agrid .ah{font-size:10.5px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.06em}
.agrid .an{font-weight:700;font-size:13.5px}
.agrid .av{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;
  display:flex;align-items:center;gap:9px}
.abook{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--text-secondary)}
.afoot{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule);
  font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
/* Evidence is available, not in the way. */
details.ev{margin:10px 0}
details.ev>summary{cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--brand-ink);padding:7px 0;list-style:none}
details.ev>summary::-webkit-details-marker{display:none}
details.ev>summary::before{content:'▸ ';color:var(--text-muted)}
details.ev[open]>summary::before{content:'▾ '}
details.ev>summary:hover{text-decoration:underline}

/* GAME-GROUPED LAYOUT — one band per matchup, one line per team, markets as
   columns. This is how every book prints a slate, and it turns the six rows a
   single game produced in the per-outcome table into two. */
table.gtable{font-size:13px;table-layout:fixed}
table.gtable th:first-child,table.gtable td:first-child{width:32%}
table.gtable th:nth-child(2),table.gtable td:nth-child(2),
table.gtable th:nth-child(3),table.gtable td:nth-child(3),
table.gtable th:nth-child(4),table.gtable td:nth-child(4){width:16%}
table.gtable th:last-child,table.gtable td:last-child{width:20%}
table.gtable th{text-align:center}
table.gtable th:first-child{text-align:left}
table.gtable thead th{font-size:11.5px;padding:8px 12px}
tr.ghead td{background:var(--bg-raised);padding:7px 12px;height:auto;
  border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
tr.ghead:hover td,tr.ghead:hover{background:var(--bg-raised)}
.gcat{display:inline-block;font-size:10.5px;font-weight:700;color:var(--text-muted);
  min-width:48px}
.gstart{display:inline-block;font-size:11.5px;font-weight:600;color:var(--text-secondary);
  min-width:64px;font-variant-numeric:tabular-nums}
.gname{font-weight:700;font-size:13px;color:var(--text-primary);margin-right:9px}
.tag.live{border-color:var(--pos);color:#fff;background:var(--pos);font-size:10px}
.tag.bet{border-color:var(--pos);color:var(--pos);background:#e7f5ec;font-size:10.5px;
  font-weight:700}
tr.grow td{height:46px;cursor:pointer}
/* The flex goes on a WRAPPER inside the cell, never on the <td> itself:
   `display:flex` on a table cell removes it from table layout, so
   `table-layout:fixed` stops applying to it and its border renders as a
   stray rule under the content. */
.gteam{font-weight:600;padding-left:14px!important;white-space:nowrap;
  vertical-align:middle}
.gteamin{display:flex;align-items:center;gap:9px;min-width:0}
.gteamin>span{overflow:hidden;text-overflow:ellipsis}
.gteam .vchip{margin:0;flex:0 0 20px}
.gcell{text-align:center}
.gprice{display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.gline{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;
  font-weight:600}
.gedge{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
/* The reference edge is visually distinct from a consensus edge, because it
   is a weaker claim: two venues, not three-plus clusters. */
.gedge.gref{cursor:help;border-bottom:1px dotted currentColor;padding-bottom:1px}
.refbadge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
  background:var(--pos);color:#fff;font-size:10.5px;font-weight:700}
.gtable .oddspill{min-width:76px;padding:7px 12px;font-size:13.5px}
.gtable .oddspill.bet{border-color:var(--brand);background:var(--brand);color:#fff}
.gtable tbody tr.grow:hover .oddspill{border-color:var(--brand-ink);
  background:var(--brand-wash);color:var(--brand-ink)}
.gtable tbody tr.grow:hover .oddspill.bet{background:var(--brand-ink);color:#fff}

/* THE ODDS BUTTON. On a real book a price is the primary tap target, so it
   gets button geometry: a filled rounded rect, bold tabular figure, and a
   brand-blue treatment when the row is actionable. */
.oddspill{display:inline-block;min-width:62px;padding:5px 11px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--bg-raised);
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;
  text-align:center;line-height:1.15;color:var(--text-primary)}
tr.v-BET .oddspill{border-color:var(--brand);color:#fff;background:var(--brand)}
tr:hover .oddspill{border-color:var(--brand-ink);background:var(--brand-wash);
  color:var(--brand-ink)}
tr.v-BET:hover .oddspill{background:var(--brand-ink);color:#fff}

/* VENUE CHIP — brand-coloured tile + name. This is where all the chroma
   lives, and it is what makes a row scannable by book at a glance. */
.vcell{display:inline-flex;align-items:center;gap:7px;min-width:0}
/* Real logos arrive at mixed sizes (16px ICO up to 128px PNG) and some are
   transparent PNGs that vanish on a white card, so every chip gets a fixed
   box, a hairline ring and object-fit containment. */
.vchip{width:20px;height:20px;flex:0 0 20px;border-radius:5px;display:block;
  object-fit:contain;background:#fff;border:1px solid var(--border);
  padding:1px;image-rendering:auto}
.vchip-lg{width:26px;height:26px;flex:0 0 26px;border-radius:6px}
.sicon{width:16px;height:16px;vertical-align:-3px;flex:0 0 16px;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;
  stroke-linejoin:round;shape-rendering:geometricPrecision}

/* The verdict cell is a flex box so the pill centres on the row instead of
   sitting on the text baseline -- inline-block pills in a fixed-height row
   ride high, which is what made this column look broken. */
/* The pill class belongs to the SPAN, never to the cell. Putting `.vd` on a
   <th> made the header cell itself render as a floating white pill outside
   the tinted band — which is exactly what it looked like. */
tbody td.vdcell{padding-top:0;padding-bottom:0}
thead th.vdcell{text-align:left}
.vd{font-size:11px;font-weight:700;display:inline-flex;align-items:center;
  line-height:1;padding:4px 9px;border-radius:999px;border:1px solid transparent;
  white-space:nowrap;vertical-align:middle}
.vd-BET{background:var(--pos);border-color:var(--pos);color:#fff;
  box-shadow:0 1px 3px rgba(11,122,59,.28)}
.vd-THIN{color:var(--warn);border-color:#e5cf9a;background:#fdf6e6}
.vd-AGED{color:var(--serious);border-color:#e8c9b0;background:#fdf1e9;
  border-style:dashed}
.vd-SUSPECT{color:var(--neg-mark);border-color:#e6bbb7;background:#fdeceb;
  border-style:dotted}
.vd-LIMITED{color:var(--text-secondary);border-color:var(--border);background:var(--bg-raised)}
.vd-PASS,.vd-NOPRICE{color:var(--text-muted);font-weight:500;border-color:transparent;
  background:transparent;padding-left:0;padding-right:0}

/* A column whose name is jargon must LOOK explainable. The dotted underline
   is the affordance; the title attribute is the explanation. Applied to the
   label span rather than the cell so a right-aligned numeric header does not
   show a rule floating away from its own word. */
/* The tooltip itself. Appears instantly, wraps to a readable measure, and is
   clamped to the viewport by the positioning code. */
#vbtip{position:fixed;z-index:200;max-width:330px;padding:9px 12px;
  background:#0b1220;color:#f7fafd;border-radius:8px;font-size:12.5px;
  line-height:1.42;font-weight:400;pointer-events:none;opacity:0;
  visibility:hidden;box-shadow:0 6px 22px rgba(11,18,32,.32);
  transition:opacity .09s ease}
#vbtip.on{opacity:1;visibility:visible}

thead th.hasgloss{cursor:help}
thead th .gl{border-bottom:1px dotted var(--border-strong);padding-bottom:1px}
thead th.hasgloss:hover .gl{border-bottom-color:var(--brand);color:var(--brand-ink)}

.why{color:var(--text-muted);font-size:11.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:240px}
/* Real matchup names need room; the synthetic slate did not. */
tbody td.k[data-tip]{cursor:help}
.lowN{color:var(--text-muted)}
.tie{color:var(--text-muted);font-size:11px;font-weight:600}

tr.noiseline td{border-top:2px dashed var(--border-strong);border-bottom:none;
  height:26px;padding:6px 9px 4px;color:var(--text-muted);font-size:11.5px;
  background:var(--bg-row-alt);font-weight:600}
tr.noiseline:hover,tr.noiseline:hover td{background:var(--bg-row-alt)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px}
.kv dt{color:var(--text-muted);white-space:nowrap;font-size:12px}
.kv dd{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}

.bar{height:8px;background:var(--bg-raised);border:0;border-radius:999px;
  overflow:hidden;min-width:96px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:999px}

.tag{display:inline-block;padding:1px 7px;border:1px solid var(--border);
  border-radius:999px;font-size:11px;color:var(--text-secondary);
  background:var(--bg-raised);font-weight:600}
.tag.t1{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-wash)}
.tag.demo{border-color:#d9a400;color:#3d2a00;background:#ffd24a}

.note{border:1px solid var(--border);border-left:3px solid var(--border-strong);
  border-radius:var(--r-sm);padding:8px 11px;color:var(--text-secondary);
  font-size:12.5px;margin:9px 0;background:var(--bg-surface)}
.note.w{border-left-color:var(--warn);background:#fffdf6}
.note.c{border-left-color:var(--neg-mark);background:#fffaf9}

.empty{padding:38px 14px;color:var(--text-secondary);font-size:13px;text-align:center;
  background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r)}
.empty b{display:block;font-size:17px;font-weight:700;color:var(--text-primary);
  margin-bottom:7px}

#scrim{position:fixed;inset:0;background:rgba(16,19,25,.5);z-index:100;display:none;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#scrim.on{display:flex}
#scrim .box{background:var(--bg-surface);border:0;border-radius:14px;max-width:620px;
  width:100%;padding:22px 24px;max-height:92vh;overflow:auto;
  box-shadow:0 18px 50px rgba(16,19,25,.28)}

#boot{display:none;position:fixed;top:var(--h-strip);left:0;right:0;z-index:90;
  background:#fdeceb;border-bottom:1px solid var(--neg-mark);color:var(--neg-mark);
  padding:9px 14px;font-family:var(--mono);font-size:11.5px}
html[data-vb-boot="error"] #boot{display:block}
#badge{position:fixed;bottom:8px;right:8px;z-index:70;background:var(--bg-head);
  border:0;border-radius:999px;padding:4px 12px;font-size:11px;
  color:rgba(247,249,252,.72);font-variant-numeric:tabular-nums;
  box-shadow:0 2px 10px rgba(16,19,25,.2)}
#rgfoot{position:fixed;bottom:0;left:0;z-index:65;padding:5px 12px;font-size:11px;
  color:var(--text-muted)}

svg text{font-family:var(--sans);font-size:10px;fill:var(--text-muted);
  font-variant-numeric:tabular-nums}
.spark{display:block}
@media (prefers-reduced-motion:no-preference){
  tbody tr{transition:background .1s}
  button,.chip,.oddspill{transition:background .12s,border-color .12s}
}
@media print{
  html,body{background:#fff;padding-top:0}
  nav,#badge,#rgfoot,#scrim,button{display:none!important}
  #demostrip,#boot,#filters,thead th{position:static}
  main{padding:0}
  .panel,tbody tr,table{break-inside:avoid;box-shadow:none}
}
@media (forced-colors:active){
  .chip.on,.vd-BET,button.pri{forced-color-adjust:none}
  .bar{border:1px solid CanvasText}
  .bar>i{background:CanvasText}
}

/* ---------------------------------------------------------------- L0 util */
VB.util = (function () {

     not 0.1, and kelly(0.70,2.00) is 0.3999999999999999, not 0.4. */
  const tolerantEq = (a, b, tol) => Math.abs(a - b) <= (tol === undefined ? 1e-12 : tol);

  /* mulberry32: 32-bit state, deterministic across V8 and browsers.
     Math.random is banned everywhere in this app -- reproducibility is a
     requirement, not a nicety, because the demo leaderboard must be stable. */
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;

     independent stream. Keying a stream on a market id means regenerating
     one market does not shift every subsequent draw. */
  function xmur3(str) {

      h = Math.imul(h ^ h >>> 13, 3266489909);

    let u = 0, v = 0;

/* --------------------------------------------------------------- L1 odds */
VB.odds = (function () {
  const { clamp } = VB.util;

  /* American odds are a TWO-BRANCH map from d in (1,inf) onto
     (-inf,-100] U [+100,inf). The interval (-100,+100) is NOT in the range --
     the "discontinuity at zero" is a gap in the codomain, not a removable
     singularity. There is no A=0, no A=+50. */
  function americanToDecimal(a) {
    if (!isFinite(a) || Math.abs(a) < 100) return NaN;
    return a > 0 ? 1 + a / 100 : 1 - 100 / a;
  }

  /* d=2 maps to +100 and -100 equally, so this is not a bijection. We
     canonicalize evens to +100 (the conventional quote). Consequence:
     sign(A) is NOT a valid favourite/underdog test -- use d vs 2. */
  const canonicalizeAmerican = (a) => (a === -100 ? 100 : a);
  function decimalToAmerican(d) {
    if (!(d > 1)) return NaN;
    if (Math.abs(d - 2) < 1e-6) return 100;      /* float noise flips the branch */
    const a = d >= 2 ? (d - 1) * 100 : -100 / (d - 1);
    return canonicalizeAmerican(a);
  }

  /* A feed value in (-100,+100) is not an American price. If it looks like
     a decimal odd misrouted into an American field, say so -- never coerce. */
  function sniffPrice(raw) {
    const v = typeof raw === 'string' ? raw.trim().toUpperCase() : raw;
    if (v === 'EVEN' || v === 'EV' || v === 'PK') return { format: 'american', value: 100 };
    const n = Number(v);
    if (!isFinite(n) || n === 0) return { format: 'reject', reason: 'null-or-zero' };
    if (Math.abs(n) >= 100) return { format: 'american', value: n };
    if (n > 1 && n < 20) return { format: 'suspect_decimal', value: n,
                                  reason: 'in (1,20): likely a decimal odd in an American field' };
    return { format: 'reject', reason: 'in (-100,+100): not a valid American price' };
  }

  const fractionalToDecimal = (n, m) => 1 + n / m;
  const probToDecimal = (p) => 1 / p;
  const decimalToProb = (d) => 1 / d;

  /* Best rational approximation via continued-fraction convergents.
     1/(1/d) round-trips exactly in float64; d -> n/m -> d does not. */
  function toFraction(dec, maxDen) {
    const cap = maxDen || 1000;
    let x = dec - 1, h1 = 1, h0 = 0, k1 = 0, k0 = 1, b = x, best = [1, 1];
    for (let i = 0; i < 32; i++) {
      const a = Math.floor(b);
      const nh = a * h1 + h0; h0 = h1; h1 = nh;
      const nk = a * k1 + k0; k0 = k1; k1 = nk;
      if (k1 > cap) break;
      best = [h1, k1];
      if (b === a) break;
      b = 1 / (b - a);
    }
    return best;
  }

  /* Prediction markets quote integer cents and the contract pays $1, so
     d = 100/c. Reading 40c as +150 by analogy is the classic bug; NO at
     (100-c) is a separate tradable outcome with its own book, not a mirror.
     c=0 is UNPRICED -- clamping it to an epsilon is how you generate a
     900% EV bet on nothing. */
  function centsToDecimal(c) {
    if (!(c > 0)) return Infinity;               /* unpriced, not a bet */
    return 100 / c;
  }
  const decimalToCents = (d) => 100 / d;
  const PM_TICK = { kalshi: [1, 99], polymarket: [0.1, 99.9] };

  /* Prediction-market booksum from the two asks, so PM venues drop straight
     into the hold component. YES_ask + NO_ask >= 100 always. */
  const pmBookSum = (yesAskCents, noAskCents) => (yesAskCents + noAskCents) / 100;

  /* PM capital is locked until settlement, so a contract is a DISCOUNTED
     claim: PM prices systematically UNDERSTATE probability on long-dated
     markets. At r=5% and T=0.5yr this is a 2.5% relative adjustment --
     larger than the median edge this app reports. Applied above 30 days. */
  function pmTimeValue(pRaw, years, r) {
    if (!(years > 30 / 365)) return pRaw;
    return Math.min(0.9999, pRaw * Math.pow(1 + (r === undefined ? 0.05 : r), years));
  }

     comes from, so it happens before the board sees the price, not after.
     Steps: 5 below 300, 10 below 1000, 25 above. */
  function snapToGrid(d, mode) {
    if (mode === 'cents') return centsToDecimal(clamp(Math.round(decimalToCents(d)), 1, 99));
    const a = d >= 2 ? (d - 1) * 100 : -100 / (d - 1);
    const m = Math.abs(a);
    const step = m < 300 ? 5 : m < 1000 ? 10 : 25;
    let s = Math.round(a / step) * step;
    if (Math.abs(s) < 100) s = a < 0 ? -100 : 100;
    return americanToDecimal(s);
  }

  /* One American cent near even money is worth ~0.23 probability points --
     about a quarter of the app's whole minimum edge. So decimal is stored
     and American is display-only; a d -> round(A) -> d round trip at -110
     injects up to 0.11pp of error and we are hunting 1-2pp. */
  const centSensitivity = (a) => 100 / Math.pow(Math.abs(a) + 100, 2);

  const bookSum = (ds) => ds.reduce((s, d) => s + 1 / d, 0);
  const hold = (ds) => 1 - 1 / bookSum(ds);

  /* Commission is charged on net winnings, so it bites long prices far
     harder than short ones -- the opposite of a book's vig profile. */
  const commissionAdjusted = (d, c) => 1 + (d - 1) * (1 - c);

  /* Kalshi-form per-contract fee, maximal at P=0.50 and vanishing in the
     tails: at a 4pp edge it eats 25-50% of gross EV and erases a 2pp edge
     outright. Fee dispatch is by formula id, never a sprinkled constant. */
  function pmFeeAdjusted(d, k) {
    const P = 1 / d, kk = (k === undefined ? 0.07 : k);
    return 1 / (P * (1 + kk * (1 - P)));
  }

  const fmtAmerican = (a) => (!isFinite(a) ? '--' : (a > 0 ? '+' : '') + Math.round(a));
  return { americanToDecimal, decimalToAmerican, canonicalizeAmerican, sniffPrice,
           fractionalToDecimal, probToDecimal, decimalToProb, toFraction,
           centsToDecimal, decimalToCents, pmBookSum, pmTimeValue, PM_TICK,
           snapToGrid, centSensitivity, bookSum, hold,
           commissionAdjusted, pmFeeAdjusted, fmtAmerican };
})();

/* -------------------------------------------------------------- L1 devig */
VB.devig = (function () {
  const { clamp } = VB.util;

  /* DEVIGGING IS NOT IDENTIFIED FROM DATA. It is a modelling assumption.
     Every method below closes an under-determined system by imposing a
     one-parameter margin-allocation rule, and no amount of price data from
     a single venue can distinguish them. On a -500/+380 line the four
     methods disagree by 1.95pp / 54 American cents -- LARGER than the
     median edge this app reports. That is why all four are computed and a
     sign flip across them refuses the bet. On a symmetric two-way market
     (-110/-110, and every standard spread or total) all four coincide. */

  /* (a) Proportional. Assumes margin is a constant proportional markup, so
     it preserves true probability ratios. Removes NONE of the margin that
     books load onto longshots, so p_longshot comes out too HIGH -- it
     manufactures false positive edges on underdogs, which is the failure
     mode this app least wants. */
  function multiplicative(ds) {
    const q = ds.map(d => 1 / d), S = q.reduce((a, b) => a + b, 0);
    return { p: q.map(x => x / S), S };
  }

  /* (b) Equal-margin. Assumes a flat absolute margin per outcome. Fails
     hard for large n: p_i < 0 whenever q_i < M/n, so a 24-runner field with
     M=0.25 drives every 50/1 shot negative. Clamping silently converts it
     into a hybrid and destroys its defining property, so it is rejected
     rather than patched. Agrees with multiplicative exactly iff all q equal. */
  function additive(ds) {
    const q = ds.map(d => 1 / d), S = q.reduce((a, b) => a + b, 0);
    const n = q.length, M = S - 1, adj = M / n;
    const minQ = Math.min.apply(null, q);
    if (minQ < 1.5 * adj) return { p: null, S, rejected: 'negative-probability risk' };
    const p = q.map(x => x - adj), T = p.reduce((a, b) => a + b, 0);
    return { p: p.map(x => x / T), S };
  }

  /* (c) Power. Solve sum(q_i^k) = 1. f'(k) = sum(q^k ln q) < 0 so f is
     strictly decreasing: a unique root always exists, k>1 iff S>1, and
     p in (0,1) summing to 1 is GUARANTEED for any n with no negative-
     probability escape hatch. Relative haircut p/q = q^(k-1) is smaller for
     smaller q, so it strips proportionally more margin from longshots --
     the direction favourite-longshot bias requires. It is the most
     aggressive longshot corrector of the four, so where the true loading is
     mild it over-corrects and costs missed bets rather than lost money.
     Newton seeded from a log-space linearization, bisection bracket kept so
     a bad Newton step degrades instead of diverging: 3-5 iterations to
     1e-12 versus ~56 for pure bisection. */
  function power(ds, tol, maxIter) {
    const t = tol || 1e-12, mx = maxIter || 60;
    const qc = ds.map(d => clamp(1 / d, 1e-6, 1 - 1e-6));
    const S = qc.reduce((a, b) => a + b, 0);
    if (Math.abs(S - 1) < 1e-12) return { p: qc.slice(), k: 1, S, iters: 0 };
    const lq = qc.map(Math.log);
    const f = (k) => qc.reduce((s, x, i) => s + Math.exp(k * lq[i]), 0) - 1;
    const fp = (k) => qc.reduce((s, x, i) => s + Math.exp(k * lq[i]) * lq[i], 0);

    let lo, hi;
    if (S > 1) { lo = 1; hi = 2; while (f(hi) > 0 && hi < 64) hi *= 2; }
    else { hi = 1; lo = 0.5; while (f(lo) < 0 && lo > 1e-3) lo /= 2; }

    const meanNegLog = -lq.reduce((a, b) => a + b, 0) / lq.length;
    let k = clamp(1 + Math.log(S) / meanNegLog, lo, hi), iters = 0;
    for (let i = 0; i < mx; i++) {
      iters = i + 1;
      const v = f(k);
      if (Math.abs(v) < t) break;
      if (v > 0) lo = k; else hi = k;
      const kn = k - v / fp(k);
      k = (kn > lo && kn < hi && isFinite(kn)) ? kn : 0.5 * (lo + hi);
      if (hi - lo < 1e-14) break;
    }
    const raw = qc.map((x, i) => Math.exp(k * lq[i]));
    const Z = raw.reduce((a, b) => a + b, 0);
    return { p: raw.map(x => x / Z), k, S, iters };
  }

  /* (d) Shin. Models a book pricing to break even against a fraction z of
     insider money. Normalization: sum(sqrt(z^2 + 4(1-z)q^2/S)) = 2(1-z) + nz.
     At z=0 it gives p = q/sqrt(S) which sums to sqrt(S), so z=0 solves it
     iff S=1 and z>0 strictly whenever S>1. Bisection only -- the derivative
     is ugly and the function is cheap; 32 iterations to 1e-10 on a 0.5
     bracket. NO closed form is used: the circulating n=2 closed form failed
     a residual check by 0.003 in z (0.3pp in p).
     z has no meaning for an exchange or prediction market, where no
     bookmaker is balancing against insiders -- never apply Shin to PM prices. */
  function shin(ds, tol) {
    const t = tol || 1e-12;
    const q = ds.map(d => 1 / d), n = q.length;
    const S = q.reduce((a, b) => a + b, 0);
    if (S <= 1 + 1e-12) return { p: multiplicative(ds).p, z: 0, S, degenerate: true };
    const g = (z) => q.reduce((s, x) =>
      s + Math.sqrt(z * z + 4 * (1 - z) * x * x / S), 0) - 2 * (1 - z) - n * z;
    let lo = 0, hi = 0.5;
    while (g(lo) * g(hi) > 0 && hi < 0.999) hi = Math.min(0.999, hi * 1.5);
    if (g(lo) * g(hi) > 0) return { p: power(ds).p, z: NaN, S, fallback: 'power' };
    let z = 0;
    for (let i = 0; i < 200; i++) {
      z = 0.5 * (lo + hi);
      const v = g(z);
      if (Math.abs(v) < t || hi - lo < 1e-15) break;
      if (g(lo) * v <= 0) hi = z; else lo = z;
    }
    if (z < 1e-9) return { p: multiplicative(ds).p, z: 0, S, degenerate: true };
    const den = 2 * (1 - z);
    const raw = q.map(x => (Math.sqrt(z * z + 4 * (1 - z) * x * x / S) - z) / den);
    const Z = raw.reduce((a, b) => a + b, 0);
    return { p: raw.map(x => x / Z), z, S };
  }

  /* RATIFIED: there is NO default method. The fair probability used
     everywhere is the MEDIAN of the applicable methods, per venue per
     market. Picking one winner among four methods measured to disagree by
     1.95pp -- larger than the median edge this app reports -- is picking a
     number, not computing one. The median makes the displayed figure
     consistent with the gate that guards it, and turns the disagreement
     into a QUANTITY (half the method spread becomes b_devig in the error
     budget) instead of a hidden modelling choice.
     No user setting changes which number the board uses: a method switcher
     is a method-shopping tool. All four stay visible on the drill-down as a
     diagnostic. */
  function medianDevig(ds) {
    const applicable = {}, flags = [];
    applicable.multiplicative = multiplicative(ds).p;
    const add = additive(ds);
    if (add.p) applicable.additive = add.p;
    else flags.push('additive_clipped');
    const pw = power(ds);
    applicable.power = pw.p;
    const sh = shin(ds);
    if (sh.degenerate) flags.push('shin_degenerate');
    else if (sh.fallback) flags.push('shin_fallback');
    else applicable.shin = sh.p;

    const names = Object.keys(applicable);
    const n = ds.length;
    const p = [];
    for (let i = 0; i < n; i++) {
      const vals = names.map(m => applicable[m][i]).sort((a, b) => a - b);
      const k = vals.length;
      p.push(k % 2 ? vals[(k - 1) / 2] : 0.5 * (vals[k / 2 - 1] + vals[k / 2]));
    }
    /* One multiplicative renormalization -- the median of per-outcome
       medians does not sum to 1 in general. */
    const Z = p.reduce((a, b) => a + b, 0);
    const pn = p.map(x => x / Z);

    /* Method spread per outcome, and the b_devig convention: half the
       spread. Stated convention, not a derivation. */
    const spread = [];
    for (let i = 0; i < n; i++) {
      let lo = Infinity, hi = -Infinity;
      for (const m of names) {
        const v = applicable[m][i];
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
      spread.push(hi - lo);
    }
    return { p: pn, methods: applicable, names, spread,
             bDevig: spread.map(x => x / 2), flags };
  }

  /* signStable is evaluated across the SAME applicable set the median used.
     A market where multiplicative says positive and Shin says negative
     renders PASS with "devig sign unstable", regardless of EV%. */
  function signStableFor(md, ix, offeredDecimal) {
    const q = 1 / offeredDecimal;
    let pos = 0, tot = 0;
    for (const m of md.names) { tot++; if (md.methods[m][ix] - q > 0) pos++; }
    return tot > 0 && (pos === tot || pos === 0);
  }

  const METHODS = ['multiplicative', 'additive', 'power', 'shin'];
  const DEFAULT_METHOD = 'power';     /* failure-mode grounds, not proven optimum */

  function apply(ds, method) {
    switch (method) {
      case 'additive': { const r = additive(ds); return r.p || multiplicative(ds).p; }
      case 'power': return power(ds).p;
      case 'shin': return shin(ds).p;
      default: return multiplicative(ds).p;
    }
  }

  /* Exchanges and prediction markets are NOT devigged. The mid of a
     two-sided book is already near vig-free; commission and per-contract
     fees apply to YOUR EXECUTION, not to the venue's implied probability.
     Devigging a Betfair mid double-counts. Signal = mid, execution = ask. */
  const midpoint = (bidProb, askProb) => (bidProb + askProb) / 2;

  function allMethods(ds) {
    const out = {};
    for (const m of METHODS) {
      const p = apply(ds, m);
      if (p) out[m] = p;
    }
    return out;
  }

  /* The identification problem turned into a visible filter rather than a
     hidden bias: if the sign of the edge flips across the four methods the
     bet is not recommended, it is labelled method-sensitive with the range. */
  function methodSensitivity(ds, ix, offeredDecimal) {
    const q = 1 / offeredDecimal, all = allMethods(ds);
    const edges = {}; let lo = Infinity, hi = -Infinity, pos = 0, tot = 0;
    for (const m in all) {
      const e = all[m][ix] - q;
      edges[m] = e; tot++;
      if (e > 0) pos++;
      if (e < lo) lo = e;
      if (e > hi) hi = e;
    }
    return { edges, min: lo, max: hi, spread: hi - lo,
             signStable: (pos === tot || pos === 0), nMethods: tot };
  }
  return { multiplicative, additive, power, shin, apply, allMethods, midpoint,
           methodSensitivity, medianDevig, signStableFor, METHODS, DEFAULT_METHOD };
})();

/* ---------------------------------------------------------- L1 consensus */
VB.consensus = (function () {
  const { clamp, logit, sig } = VB.util;

  const BETA = 0.6;            /* softmax temperature: a 20pt sharpness gap = 3.32x weight */
  const CLUSTER_CAP = 0.35;    /* no pricing vendor / parent may exceed this share */
  const TAU_PREGAME = 600;     /* staleness decay, seconds */
  const TAU_INPLAY = 20;
  const TRIM_Z = 3.5;          /* Iglewicz-Hoaglin */
  const MIN_VEFF = 3;

  /* Liquidity factor. Exchanges and PMs are judged on spread, books on
     posted limit. A PM wider than 6c is excluded outright, not downweighted:
     a 7c spread is not an opinion about probability. */
  function liquidityFactor(v) {
    if (v.model === 'order_book') {
      if (!(v.spreadCents >= 0)) return 0;
      if (v.spreadCents > 6) return 0;
      const h = v.spreadCents / 2;
      return 1 / (1 + h * h);
    }
    const lim = v.limitUsd;
    if (!(lim > 0)) return 0.4;
    return lim >= 500 ? 1 : lim >= 100 ? 0.7 : 0.4;
  }

  /* Staleness decay, and a hard exclusion at 5 tau. A stale venue must not
     be allowed to drag the consensus toward its own stale opinion, which
     would make the whole market look like edge. Note the two separate
     budgets: consensus membership is TIGHTER than display. */
  function stalenessFactor(ageSec, isLive) {
    const tau = isLive ? TAU_INPLAY : TAU_PREGAME;
    if (!(ageSec >= 0)) return 0;
    if (ageSec > 5 * tau) return 0;
    return Math.exp(-ageSec / tau);
  }

  /* Raw weights from the SHARPNESS sub-index -- never the composite score.
     For a reference venue you do not care about its limits or breadth, only
     whether its price is right. Using the composite here would downweight a
     sharp low-limit book for a reason irrelevant to its role. */
  function rawWeights(venues, isLive) {
    return venues.map(v => {
      const z = ((v.sharp === undefined ? 50 : v.sharp) - 50) / 10;
      const L = liquidityFactor(v);
      const R = stalenessFactor(v.ageSec, isLive);
      return Math.exp(BETA * z) * L * R;
    });
  }

  /* Cluster caps. Five venues on one pricing feed are ONE opinion counted
     five times, and sum(w)=1 does nothing to stop it. Cap per cluster,
     redistribute the excess proportionally, iterate. Without this the
     consensus is overconfident and manufactures edge at the one venue with
     an independent view -- frequently the sharpest one, so the board would
     recommend betting AGAINST the best-informed venue. */
  function normalizeWithCaps(venues, raw) {
    const T0 = raw.reduce((a, b) => a + b, 0);
    if (!(T0 > 0)) return { w: raw.map(() => 0), clusters: {}, vEff: 0, effCap: CLUSTER_CAP };

    /* Aggregate to cluster level first. */
    const cRaw = {}, cMembers = {};
    venues.forEach((v, i) => {
      const c = v.cluster || v.id;
      if (!(raw[i] > 0)) return;
      cRaw[c] = (cRaw[c] || 0) + raw[i];
      (cMembers[c] = cMembers[c] || []).push(i);
    });
    const names = Object.keys(cRaw);
    const nC = names.length;
    if (!nC) return { w: raw.map(() => 0), clusters: {}, vEff: 0, effCap: CLUSTER_CAP };

    /* A 0.35 cap needs at least 3 clusters to be satisfiable. With two
       clusters it is arithmetically impossible, so the cap relaxes to
       1/nClusters rather than silently failing to sum to 1. */
    const effCap = Math.max(CLUSTER_CAP, 1 / nC);

    /* Water-filling: pin any cluster over the cap, redistribute the balance
       proportionally among the unpinned. The pinned set only grows, so this
       terminates -- unlike proportional redistribution, which oscillates
       when two clusters both breach. */
    const share = {};
    let active = names.slice(), remaining = 1;
    for (let guard = 0; guard <= nC; guard++) {
      const actRaw = active.reduce((s, c) => s + cRaw[c], 0);
      if (!(actRaw > 0)) break;
      const over = [];
      for (const c of active) {
        if (remaining * cRaw[c] / actRaw > effCap + 1e-12) over.push(c);
      }
      if (!over.length) {
        for (const c of active) share[c] = remaining * cRaw[c] / actRaw;
        break;
      }
      for (const c of over) { share[c] = effCap; remaining -= effCap; }
      active = active.filter(c => over.indexOf(c) === -1);
      if (!active.length) break;
    }

    /* Push each cluster's share down to its members, pro rata within cluster. */
    const w = raw.map(() => 0);
    for (const c of names) {
      const mem = cMembers[c], tot = mem.reduce((s, i) => s + raw[i], 0);
      if (!(tot > 0)) continue;
      for (const i of mem) w[i] = (share[c] || 0) * (raw[i] / tot);
    }
    /* Effective sample size at CLUSTER level, not venue level. */
    const vEff = 1 / names.reduce((s, c) => s + (share[c] || 0) * (share[c] || 0), 0);
    return { w, clusters: share, vEff, effCap };
  }

  /* Weighted median and MAD in logit space. */
  function weightedQuantile(vals, wts, q) {
    const ix = vals.map((v, i) => i).sort((a, b) => vals[a] - vals[b]);
    const T = wts.reduce((a, b) => a + b, 0);
    let acc = 0;
    for (const i of ix) { acc += wts[i]; if (acc >= q * T) return vals[i]; }
    return vals[ix[ix.length - 1]];
  }

  /* An outlier is EXACTLY what we are hunting, so trimming is dangerous.
     Resolution: trim the consensus, never the offer being evaluated (which
     is excluded by construction anyway, so it can never be trimmed away).
     Below 5 venues there is no power to identify an outlier and MAD is
     degenerate, so winsorize instead of trimming. */
  function trimLogits(ells, wts) {
    const n = ells.length;
    if (n < 5) {
      const lo = weightedQuantile(ells, wts, 0.10);
      const hi = weightedQuantile(ells, wts, 0.90);
      return { ells: ells.map(x => clamp(x, lo, hi)), dropped: [], mode: 'winsorized' };
    }
    const m = weightedQuantile(ells, wts, 0.5);
    const devs = ells.map(x => Math.abs(x - m));
    const mad = weightedQuantile(devs, wts, 0.5);
    if (!(mad > 0)) return { ells, dropped: [], mode: 'no-dispersion' };
    const dropped = [];
    ells.forEach((x, i) => {
      if (Math.abs(x - m) / (1.4826 * mad) > TRIM_Z) dropped.push(i);
    });
    return { ells, dropped, mode: 'trimmed' };
  }

  /* Weighted LOG-LINEAR (geometric) pool. For n=2 this is exactly logit
     averaging, so one rule covers both cases. sum(w)=1 is required, not
     cosmetic: it is the idempotence condition, so a unanimous market is
     reported unchanged.
     Logit pooling is SHARPER than arithmetic averaging -- venues at 0.20 and
     0.40 pool to 0.28993, not 0.30000. On a longshot that means a lower
     consensus probability, a smaller measured edge, and fewer false
     positives on dogs. Jensen guarantees the sign. */
  function pool(perVenueProbs, weights) {
    const nOut = perVenueProbs[0].length;
    const lnp = new Array(nOut).fill(0);
    let W = 0;
    for (let v = 0; v < perVenueProbs.length; v++) {
      const w = weights[v];
      if (!(w > 0)) continue;
      W += w;
      for (let i = 0; i < nOut; i++) {
        lnp[i] += w * Math.log(clamp(perVenueProbs[v][i], 1e-9, 1 - 1e-9));
      }
    }
    if (!(W > 0)) return null;
    const raw = lnp.map(x => Math.exp(x / W));
    const Z = raw.reduce((a, b) => a + b, 0);
    return raw.map(x => x / Z);
  }

  /* Build a fair line, optionally excluding an entire correlated CLUSTER.
     Leave-one-CLUSTER-out, not leave-one-venue-out: if the offer is one of
     five venues on the same feed, removing it alone leaves its price in the
     consensus four more times. */
  function build(venues, perVenueProbs, opts) {
    const o = opts || {};
    const excludeCluster = o.excludeCluster || null;
    const keep = [];
    let unusable = 0;
    venues.forEach((v, i) => {
      if (excludeCluster && (v.cluster || v.id) === excludeCluster) return;
      if (!v.includeInConsensus) return;
      /* A logit pool has no immunity to one bad member: a single non-finite
         probability propagates through the weighted mean and every outcome
         comes back NaN, with ok:true, so the caller reports a fair price of
         "--" on every row instead of a failure. Screen the members here, at
         the point where the invariant is cheap to state: a voter must carry
         a finite probability strictly inside (0,1) for every outcome. */
      const pv = perVenueProbs[i];
      if (!pv || pv.length !== (perVenueProbs[0] || []).length) { unusable++; return; }
      for (let k = 0; k < pv.length; k++) {
        if (!(Number.isFinite(pv[k]) && pv[k] > 0 && pv[k] < 1)) { unusable++; return; }
      }
      keep.push(i);
    });
    if (!keep.length) {
      return { ok: false, reason: unusable ? 'no_usable_probs' : 'no_voters', unusable };
    }

    const kv = keep.map(i => venues[i]);
    const raw = rawWeights(kv, o.isLive);
    if (!raw.some(x => x > 0)) return { ok: false, reason: 'all_excluded_stale_or_wide' };

    /* Trim in logit space on the FAVOURITE outcome as the dispersion proxy,
       then drop those venues from the pool entirely. */
    const norm0 = normalizeWithCaps(kv, raw);
    const ell0 = keep.map(i => logit(clamp(perVenueProbs[i][0], 1e-6, 1 - 1e-6)));
    const tr = trimLogits(ell0, norm0.w);
    const kept2 = keep.filter((_, j) => tr.dropped.indexOf(j) === -1);
    if (!kept2.length) return { ok: false, reason: 'all_trimmed' };

    const kv2 = kept2.map(i => venues[i]);
    const raw2 = rawWeights(kv2, o.isLive);
    const norm = normalizeWithCaps(kv2, raw2);
    const probs = kept2.map(i => perVenueProbs[i]);
    const p = pool(probs, norm.w);
    if (!p) return { ok: false, reason: 'no_weight' };

    /* Hard rule: with no tier-1 venue present there is no fair line for
       value purposes. A consensus of five retail books that all buy the
       same feed is not a fair line, it is one soft line with error bars. */
    const hasT1 = kv2.some(v => v.tier === 1);

    /* Dispersion must be computed PER OUTCOME. Using outcome 0's dispersion
       for every row understates the SE on all other outcomes and inflates
       t -- which drives both the default sort and the significance gate, so
       the error would put the least reliable rows at the top of the board.
       It matters most on multi-outcome markets, where a tight favourite and
       a widely-disagreed longshot are in the same market. */
    const wbar = norm.w;
    const sumW2 = wbar.reduce((s, x) => s + x * x, 0);
    const nOut = perVenueProbs[kept2[0]].length;
    const seLogitByOutcome = [], sLogitByOutcome = [];
    for (let k = 0; k < nOut; k++) {
      const ellK = kept2.map(i => logit(clamp(perVenueProbs[i][k], 1e-6, 1 - 1e-6)));
      const muK = ellK.reduce((s, x, j) => s + wbar[j] * x, 0);
      const varK = ellK.reduce((s, x, j) => s + wbar[j] * (x - muK) * (x - muK), 0);
      sLogitByOutcome.push(Math.sqrt(varK));
      seLogitByOutcome.push(Math.sqrt(varK * sumW2));
    }
    const seLogit = seLogitByOutcome[0];
    const varL = sLogitByOutcome[0] * sLogitByOutcome[0];

    return { ok: true, p, weights: wbar, venueIx: kept2, clusters: norm.clusters,
             vEff: norm.vEff, hasT1, seLogit, sLogit: Math.sqrt(varL),
             seLogitByOutcome, sLogitByOutcome,

             nVoters: kept2.length, nClusters: Object.keys(norm.clusters).length };
  }

  /* SE of the consensus probability. Sampling error shrinks with more
     venues; the devig and staleness terms are BIAS and do not shrink. In a
     realistic three-sharp-venue case SE_total is 41% of the signal, and
     that is a GOOD case. */
  const B_DEVIG = 0.004, B_STALE = 0.003;
  function seTotal(p, seLogit) {
    const seSamp = p * (1 - p) * seLogit;
    return { seSamp, seTotal: Math.sqrt(seSamp * seSamp + B_DEVIG * B_DEVIG + B_STALE * B_STALE) };
  }

  /* The algebraic LOO shortcut is exact ONLY if the weights are unchanged by
     removing the offer -- and with cluster caps they are not, because
     removing a venue frees cap headroom that gets reallocated. Measured
     discrepancy 0.014pp in the reference case, larger when the offer sits
     inside a capped cluster. So the full pipeline is re-run per offer;
     it is O(V^2 n) floating-point ops, which is nothing in a browser. */
  const looShortcut = (lbar, wo, lo) => (lbar - wo * lo) / (1 - wo);

  return { build, pool, rawWeights, normalizeWithCaps, trimLogits, weightedQuantile,
           liquidityFactor, stalenessFactor, seTotal, looShortcut,
           BETA, CLUSTER_CAP, MIN_VEFF, TRIM_Z, B_DEVIG, B_STALE };
})();

/* -------------------------------------------------------------- L1 stake */
VB.stake = (function () {
  const { clamp, Phi } = VB.util;

  /* R is an EDGE CORRECTION, not a risk preference, and the distinction is
     load-bearing. Shrinking the probability toward the offer and then
     running Kelly is algebraically identical to shrinking the Kelly
     fraction:  p_adj = q + R(p-q)  =>  f*_adj = R*f*  exactly.
     So R belongs to the estimator. The consequence: if R is doing its job
     then R*f* IS true Kelly, which is a 50% chance of ever halving the
     bankroll. That is why lambda is separately required -- applying both is
     not double-haircutting, and calling lambda an estimation correction
     would be. */
  const R_PRIOR = 0.35;              /* replaced by beta-hat from the CLV regression at N>=200 */
  const R_MIN_OBS = 200;
  const LAMBDA_DEFAULT = 0.25;       /* Conservative */
  const U_FRAC = 0.01;               /* 1 unit = 1% of bankroll */

  /* EV per unit staked. p is the leave-one-CLUSTER-out consensus fair
     probability and d is the RAW OFFERED price. Comparing a venue against
     its OWN devigged probability is the most expensive bug in this class of
     app: it manufactures edge out of vig and roughly doubles the answer
     (0.101 against the correct 0.0505). */
  const ev = (p, d) => p * d - 1;
  const edgeProb = (p, d) => p - 1 / d;

  /* EV% = e_p / q_o. A fixed probability edge is worth wildly different EV%
     at different prices -- 1pp is 2.0% EV at even money and 33.3% at 3c.
     So the board must threshold on BOTH, and the ladder must never be built
     on EV%. */
  const evPctFromEdge = (ep, qo) => ep / qo;

  /* f* = (p*d - 1)/(d - 1) = EV%/b. That identity is why a 5% EV is a 3.4%
     stake at +145 but a 15.0% stake at -300: an EV%-based ladder is a 4.4x
     sizing error at the extremes, and it is the single most common flaw in
     edge-to-unit mappings. */
  function kelly(p, d) {
    const b = d - 1;
    if (!(b > 0)) return 0;
    const f = (p * d - 1) / b;
    return f > 0 ? f : 0;
  }

  /* Pushes return the stake rather than losing it, so they INCREASE the
     optimal stake: f* = (pb - q)/(b(1 - pPush)). A -110 bet on an NFL 3
     with pPush=0.09 gets a 1.10x larger Kelly than the naive formula. */
  function kellyWithPush(p, d, pPush) {
    const b = d - 1, q = 1 - p - pPush;
    if (!(b > 0)) return 0;
    const f = (p * b - q) / (b * (1 - pPush));
    return f > 0 ? f : 0;
  }

  /* Homogeneous-correlation haircut, exact for the equicorrelation case.
     Three bets on one game at rho=0.75 -> 40% of standalone size each. */
  const corrHaircut = (k, rho) => 1 / (1 + Math.max(0, k - 1) * rho);
  const RHO = { same_game_same_side: 0.75, same_game_aligned: 0.30,
                same_player: 0.50, same_league_same_day: 0.05, different_sport: 0.02 };

  /* Rung boundaries are GEOMETRIC midpoints, not arithmetic. Growth loss
     near f* is proportional to the squared RELATIVE stake error, so
     equalizing relative error across rungs equalizes worst-case growth loss.
     The ladder bottoms at 0.25u because a properly de-biased quarter-Kelly
     regime genuinely produces stake fractions that small -- a ladder
     starting at 0.5u would silently delete qualifying bets, which is what a
     0.7071 floor was measured doing. */
  const RUNGS = [0.25, 0.5, 1.0, 1.5, 2.0];
  const RUNG_BOUNDS = [0.17677669529663687,   /* 0.25 / sqrt(2) */
                       0.35355339059327373,   /* sqrt(0.25*0.5) */
                       0.70710678118654752,   /* sqrt(0.5*1.0)  */
                       1.22474487139158905,   /* sqrt(1.0*1.5)  */
                       1.73205080756887729];  /* sqrt(1.5*2.0)  */
  const FLOOR_U = RUNG_BOUNDS[0];
  function quantize(uRaw) {
    if (!(uRaw >= RUNG_BOUNDS[0])) return 0;
    for (let i = 1; i < RUNG_BOUNDS.length; i++) {
      if (uRaw < RUNG_BOUNDS[i]) return RUNGS[i - 1];
    }
    return 2.0;                      /* hard per-bet cap */
  }

  /* THE RATIFIED SIZING CHAIN. ONE multiplication chain, ONE quantization,
     at the end. Quantizing f_final rather than an intermediate is what makes
     1.0u === unit_$ true BY CONSTRUCTION -- so the unit column and the money
     column are the same number and the app never has to explain that it
     redefined the user's own word.
       R  de-biases the EDGE ESTIMATE. Without it every stake is inflated by
          ~1/0.35 = 2.9x. Read-only: an editable R is a control that disables
          the bias correction while wearing the costume of a risk preference.
       l  controls DRAWDOWN against an unbiased edge. Without it the user is
          at full Kelly relative to truth -- a 50% chance of ever halving.
     Both are required; applying either twice is the bug. */
  function size(args) {
    const p = args.pFair, d = args.dNet;
    const R = (args.R === undefined ? R_PRIOR : args.R);
    const lambda = (args.lambda === undefined ? LAMBDA_DEFAULT : args.lambda);
    const unitUsd = args.unitUsd;
    const bankroll = args.bankroll;
    if (!(bankroll > 0) || !(unitUsd > 0)) return { unset: true };

    const evNet = ev(p, d);
    const fKelly = args.pPush ? kellyWithPush(p, d, args.pPush) : kelly(p, d);
    const fDebiased = R * fKelly;
    const fFinal = lambda * fDebiased * corrHaircut(args.nCorr || 1, args.rho || 0);
    const uRaw = fFinal * bankroll / unitUsd;

    const amount = rung * unitUsd;   /* exactly. no further multiplier. */

    return { evNet, fKelly, R, fDebiased, lambda, fFinal, uRaw, rung, amount,
             bankroll, unitUsd, uFracImplied: unitUsd / bankroll,
             suppressed: rung === 0 ? 'below_floor' : null };
  }

  /* What bankroll would make 1.0u a typical qualifying bet, and what unit
     would make 1.0u typical at the user's actual bankroll. Both are
     first-run disclosures, not settings the app changes on its own. */
  function impliedBankrollFor1u(typicalFFinal, unitUsd) {
    if (!(typicalFFinal > 0)) return NaN;
    return unitUsd / typicalFFinal;
  }
  function suggestedUnitFor1u(typicalFFinal, bankroll) {
    if (!(typicalFFinal > 0)) return NaN;
    return typicalFFinal * bankroll;
  }

  /* Cap cascade. Returns WHICH cap bound, as a string, because a stake the
     user cannot explain is a stake the user will not place. */
  function applyCaps(stakeUsd, caps, bankroll, unitUsd, venueLimit) {
    let s = stakeUsd, by = 'none';
    const cand = [['maxStakePctBankroll', caps.maxStakePctBankroll * bankroll],
                  ['maxStakeUnits', caps.maxStakeUnits * unitUsd],
                  ['maxStakeAbs', caps.maxStakeAbs],
                  ['venueLimit', (venueLimit > 0 ? venueLimit : null)]];
    for (let i = 0; i < cand.length; i++) {
      const lim = cand[i][1];
      if (lim !== null && lim !== undefined && isFinite(lim) && lim < s) { s = lim; by = cand[i][0]; }
    }

  }

  /* Rounding must never breach a cap, so it always rounds DOWN. */
  function roundStake(s, inc) {
    if (!(inc > 0)) return Math.floor(s * 100) / 100;
    return Math.floor(s / inc) * inc;
  }

  /* Proportional scaling is the EXACT solution to maximizing the quadratic
     growth approximation under a total-exposure constraint when pairwise
     correlations are homogeneous; it is an approximation otherwise. */
  function scaleToExposure(stakes, maxTotal) {
    const T = stakes.reduce((a, b) => a + b, 0);
    if (!(T > maxTotal) || !(T > 0)) return { stakes, scale: 1 };
    const k = maxTotal / T;
    return { stakes: stakes.map(x => x * k), scale: k };
  }

  /* Growth retained at lambda relative to true Kelly is lambda(2-lambda):
     zero at 2x Kelly and NEGATIVE beyond. Over-betting is not symmetric
     with under-betting, which is why the default is conservative while R is
     still a seeded prior. */
  const growthRetained = (lambda) => lambda * (2 - lambda);

  /* P(bankroll ever falls to fraction x) = x^(2/lambda - 1).
     Full Kelly carries a 50% chance of EVER halving the bankroll -- a
     property of the growth-optimal strategy, not a criticism of it.
     Caveat that must ship with it: this is lambda relative to TRUE Kelly,
     so if R is overstated the effective lambda is larger and these numbers
     are optimistic. If the true edge is zero, P(ruin) = 1. */
  const pEverDrawdown = (x, lambda) => Math.pow(x, 2 / lambda - 1);

  /* P(down after N bets). The normal approximation UNDERSTATES the risk for
     long prices because the return distribution is right-skewed and the
     median result is worse than the mean, so the exact binomial is used
     below N=200. */
  function pDownAfterN(p, d, N) {
    const mu = p * d - 1, sd = Math.sqrt(p * (1 - p)) * d;
    if (!(sd > 0)) return NaN;
    if (N < 200) return pDownExact(p, d, N);
    return Phi(-Math.sqrt(N) * mu / sd);
  }
  function pDownExact(p, d, N) {
    const need = Math.ceil(N / d);            /* wins required to break even */
    let lp = N * Math.log(1 - p), acc = 0;
    for (let k = 0; k < need; k++) {
      if (k > 0) lp += Math.log((N - k + 1) / k) + Math.log(p / (1 - p));
      acc += Math.exp(lp);

     overstates reliability the effective lambda is LARGER and every risk
     figure computed from lambda alone is optimistic. No drawdown number
     computed from an assumed-exact R may ever be displayed without its
     sensitivity row beside it. */
  const lambdaEff = (lambda, rShipped, rTrue) => lambda * (rShipped / rTrue);
  const R_SENSITIVITY = 0.20;        /* pessimistic R until the CLV regression lands */

  return { ev, edgeProb, evPctFromEdge, kelly, kellyWithPush, corrHaircut, RHO,
           quantize, snapLadder, size, applyCaps, roundStake, scaleToExposure,
           growthRetained, pEverDrawdown, pDownAfterN, pDownExact, sharpe,
           lambdaEff, impliedBankrollFor1u, suggestedUnitFor1u,
           R_PRIOR, R_MIN_OBS, R_SENSITIVITY, LAMBDA_DEFAULT, U_FRAC,
           FLOOR_U, RUNGS, RUNG_BOUNDS };
})();

/* ---------------------------------------------------------------- L1 arb */
VB.arb = (function () {
  /* Best net price per outcome across venues. S* < 1 is an arbitrage;
     R = 1/S* - 1 per unit of total outlay, split s_i = (1/d_i)/S*, which
     equalizes payoff across outcomes by construction. Fees and commission
     must already be inside the decimals -- a fee-blind detector prints
     arbitrages that do not exist. */
  function detect(bestNetDecimals, eps) {
    const e = (eps === undefined ? 1e-9 : eps);
    const S = bestNetDecimals.reduce((s, d) => s + 1 / d, 0);
    const roi = 1 / S - 1;
    const split = bestNetDecimals.map(d => (1 / d) / S);
    return { S, isArb: S < 1 - e, roi, split };
  }
  const stakes = (ds, total) => detect(ds).split.map(f => f * total);

  /* A large apparent arb is a data-quality alarm, not an opportunity: the
     4-8% band is exactly where realistic entity mis-mappings land, and a
     fake arb is indistinguishable from a real one by inspection. Threshold
     is set at the honest edge of genuine, NOT calibrated to the one case we
     planted in the demo -- that would be calibrating to our own fixture. */
  const SUSPECT_ROI = 0.04;
  const isSuspect = (roi) => roi >= SUSPECT_ROI;

  /* A middle needs a DISTRIBUTION, not a price. Read the CDF off the
     alternate-lines ladder; never fit a normal to NFL margin, where the
     entire value of a 2.5/3.5 middle is the point mass at exactly 3 that a
     continuous fit smears away. */
  function middle(dA, dB, pMid, pHi) {
    const sA = (1 / dA) / (1 / dA + 1 / dB);
    const sB = 1 - sA;
    const X = sA * dA - 1, Y = sB * dB - 1;
    const ev = Y + pHi * (X - Y) + pMid * sA * dA;
    const pMidBreakeven = -(Y + pHi * (X - Y)) / (sA * dA);
    return { sA, sB, maxLossPerUnit: Math.min(X, Y), ev, pMidBreakeven,
             isFreeMiddle: (1 / dA + 1 / dB) <= 1 };
  }

  /* A quote deviating far from an established consensus is usually a mapping
     error, not alpha -- but "far" MUST be measured against that venue's own
     known dispersion, not a flat threshold.
     A flat 6pp gate is a calibration error: a soft book's designed logit
     noise of 0.21 produces ~5pp of probability deviation as a matter of
     course, so a flat gate quarantines precisely the soft prices this app
     exists to find. Meanwhile 6pp from a sharp book IS almost certainly a
     data error.
     So: quarantine at 4 standard deviations of the VENUE'S OWN historical
     deviation, floored at 6pp so a venue with no history is still guarded.
     sqrt(CLA) is exactly that per-venue SD and the leaderboard already
     computes it, so this costs nothing. */
  const QUOTE_OUTLIER_PP = 0.06;
  const QUOTE_OUTLIER_SD = 4;
  function quoteOutlierThreshold(venueCla) {
    const sd = (venueCla > 0) ? Math.sqrt(venueCla) : 0;
    return Math.max(QUOTE_OUTLIER_PP, QUOTE_OUTLIER_SD * sd);
  }
  function isQuoteOutlier(pVenue, pConsensus, nVenues, venueCla) {
    if (nVenues < 5) return false;
    return Math.abs(pVenue - pConsensus) > quoteOutlierThreshold(venueCla);
  }

  return { detect, stakes, isSuspect, middle, isQuoteOutlier,
           quoteOutlierThreshold, SUSPECT_ROI, QUOTE_OUTLIER_PP, QUOTE_OUTLIER_SD };
})();

/* ------------------------------------------------------- L1 multiplicity */
VB.multiplicity = (function () {
  /* THE MOST IMPORTANT HONESTY MECHANISM IN THE PRODUCT, and it is ON by
     default with no toggle.
     The board shows the user the MAXIMUM of many noisy estimates, and the
     maximum of noise looks exactly like edge. For M markets evaluated with
     edge-estimate noise SD s, the expected largest pure-noise value is
     s*a(M). At M=500 and s=0.73pp that is 2.12pp of apparent edge with NO
     real mispricing anywhere -- which EXCEEDS the 1.78pp edge in the
     reference calculation. */
  function a(M) {
    const m = Math.max(2, M);
    const L = Math.sqrt(2 * Math.log(m));
    return L - (Math.log(Math.log(m)) + Math.log(4 * Math.PI)) / (2 * L);
  }

  /* M is the count of markets EVALUATED this render, not the count
     displayed. Filtering the board does not reduce the multiplicity you
     already paid for. */
  const eCrit = (seTotal, M) => seTotal * a(M);
  const eAdj = (ep, seTotal, M) => ep - eCrit(seTotal, M);

  /* Staleness bias, fitted to the three measured drift points:
     0.12pp at 1 min, 0.48pp at 15 min, 0.97pp at 60 min. At a 2pp gate a
     one-hour-old quote contributes roughly half the threshold in pure
     noise, so this is not a rounding term. */
  const B_STALE_A = 0.0012, B_STALE_B = 0.512;
  const bStale = (ageMin) => B_STALE_A * Math.pow(Math.max(ageMin, 1), B_STALE_B);

  /* The relief valve is a SMALLER M, not a lower floor -- and the user must
     be told the lever is weak, because a(M) grows like sqrt(ln M). */
  function scopeRelief(mWide, mNarrow, seTotal) {
    return { wide: eCrit(seTotal, mWide), narrow: eCrit(seTotal, mNarrow),
             gainPP: (eCrit(seTotal, mWide) - eCrit(seTotal, mNarrow)) * 100 };
  }
  return { a, eCrit, eAdj, bStale, scopeRelief, B_STALE_A, B_STALE_B };
})();

/* -------------------------------------------------------------- L1 score */
VB.score = (function () {
  const { clamp, sig } = VB.util;

  /* TWO SCORES, NO COMPOSITE. The leaderboard answers two opposite
     questions and one blended number is wrong for both:
       SHARP -- whose price to trust. Weights the consensus. Sharp venues rise.
       USE   -- where to bet. Ranks bet targets. SOFT venues rise, because
                that is where the edges are.
     A composite would hide exactly the venue that is sharp AND unusable. */

  const SHARP_W = { cla: 0.60, calib: 0.20, logLoss: 0.10, brier: 0.10 };
  const USE_W = { hold: 0.45, depth: 0.35, breadth: 0.20 };

  /* n gates. Closing-line accuracy recovers a known injected ordering at
     n=500 with adjacent t-stats of 4.7-7.7. Outcome-based Brier gets the
     ordering WRONG at n=6,000 and needs ~20,000, so it is gated hard and
     carries a tenth of the weight -- a weight set that gave Brier 0.15 and
     CLA 0.30 would spend a third of its budget on decoration. */
  const N_GATE = { cla: 300, calib: 500, logLoss: 1000, brier: 1000 };

  /* Shrinkage k = sigma_within^2 / sigma_between^2 -- derived, not taste.
     k_brier ~ 1500 means at 300 settled observations the Brier component is
     83% prior and 17% data. k_cla ~ 80 means CLA is genuinely MEASURED
     within weeks. */
  const K = { cla: 80, calib: 800, logLoss: 1200, brier: 1500, hold: 10 };
  const TIER_PRIOR = { 1: 62, 2: 50, 3: 42 };

  /* Naive ECE is biased upward by sqrt(2/pi)*sqrt(p(1-p)/n_b) per bin: a
     PERFECTLY calibrated venue with 300 settled bets scores ~7pp of pure
     noise. Uncorrected, the calibration component is a sample-size proxy. */
  function eceAdjusted(bins) {
    let ece = 0, N = 0;
    for (const b of bins) N += b.n;
    if (!N) return NaN;
    for (const b of bins) {
      if (!b.n) continue;
      const noise = Math.sqrt(2 / Math.PI) * Math.sqrt(b.pMean * (1 - b.pMean) / b.n);
      ece += (b.n / N) * Math.max(0, Math.abs(b.oMean - b.pMean) - noise);
    }
    return ece;
  }

  /* Favourite-longshot fingerprint: logit(observed) = alpha + beta*logit(pred).
     beta < 1 means the venue's prices are over-extreme; alpha != 0 means a
     systematic side lean. |beta - 1| feeds the calibration score. */
  function flsFit(bins) {
    const pts = bins.filter(b => b.n > 0 && b.pMean > 0 && b.pMean < 1

    if (pts.length < 3) return { alpha: NaN, beta: NaN, n: pts.length };
    const lx = pts.map(b => Math.log(b.pMean / (1 - b.pMean)));
    const ly = pts.map(b => Math.log(b.oMean / (1 - b.oMean)));
    const w = pts.map(b => b.n), W = w.reduce((a, b) => a + b, 0);
    const mx = lx.reduce((s, x, i) => s + w[i] * x, 0) / W;
    const my = ly.reduce((s, y, i) => s + w[i] * y, 0) / W;
    let sxy = 0, sxx = 0;
    for (let i = 0; i < pts.length; i++) {

      sxx += w[i] * (lx[i] - mx) * (lx[i] - mx);

    return { alpha: my - beta * mx, beta, n: pts.length };

     35 numbers per venue recovers every metric AND its standard error. */
  function components(s) {
    if (!s || !s.n) return null;
    const n = s.n;
    const cla = s.claSum / n;
    const claSE = Math.sqrt(Math.max(0, s.claSumSq / n - cla * cla) / n);
    const brier = s.nSettled ? s.brierSum / s.nSettled : NaN;
    const brierSE = s.nSettled
      ? Math.sqrt(Math.max(0, s.brierSumSq / s.nSettled - brier * brier) / s.nSettled)
      : NaN;
    return { n, nSettled: s.nSettled || 0,
             cla, claSE, claT: claSE > 0 ? cla / claSE : NaN,
             brier, brierSE, logLoss: s.nSettled ? s.logSum / s.nSettled : NaN,
             ece: s.bins ? eceAdjusted(s.bins) : NaN,
             fls: s.bins ? flsFit(s.bins) : null,

             breadth: s.breadth, depthTier: s.depthTier };
  }

  /* Robust standardize against the cohort, then ONE logistic at the end.
     Robust z over mean/SD because with 19 venues one broken adapter destroys
     a mean and inflates an SD. Logistic over min-max because min-max is
     wrecked by a single outlier and rescales everyone when a venue is added. */
  function robustZ(x, vals) {
    const v = vals.filter(isFinite).slice().sort((a, b) => a - b);
    if (v.length < 3 || !isFinite(x)) return 0;
    const med = v[Math.floor(v.length / 2)];
    const devs = v.map(y => Math.abs(y - med)).sort((a, b) => a - b);
    const mad = devs[Math.floor(devs.length / 2)];

    return (x - med) / (1.4826 * mad);

  const shrinkZ = (z, n, k) => z * (n / (n + k));

  const holdScore = (h) => 100 * clamp(1 - (h - 0.01) / (0.12 - 0.01), 0, 1);

  /* Any component below its n gate renders "insufficient data" and its
     weight is REDISTRIBUTED PROPORTIONALLY, with the redistribution
     disclosed and asserted to sum to 1.000. No back-filling with priors,
     no "provisional score". */
  function redistribute(weights, available) {
    const live = Object.keys(weights).filter(k => available[k]);
    const lost = Object.keys(weights).filter(k => !available[k]);
    const kept = live.reduce((s, k) => s + weights[k], 0);
    const out = {};
    if (!(kept > 0)) return { weights: out, dropped: lost, ok: false };
    for (const k of live) out[k] = weights[k] / kept;
    return { weights: out, dropped: lost, ok: true };
  }

  function sharp(c, cohort, tier) {
    if (!c) return { state: 'unrated', n: 0 };
    const avail = {
      cla: c.n >= N_GATE.cla && isFinite(c.cla),
      calib: c.nSettled >= N_GATE.calib && isFinite(c.ece),
      logLoss: c.nSettled >= N_GATE.logLoss && isFinite(c.logLoss),
      brier: c.nSettled >= N_GATE.brier && isFinite(c.brier) && c.publishesProbability
    };
    const rd = redistribute(SHARP_W, avail);
    if (!rd.ok) return { state: 'prior_only', prior: TIER_PRIOR[tier] || 50,
                         n: c.n, nSettled: c.nSettled, dropped: rd.dropped };
    /* Lower is better for every error metric, so negate before scoring. */
    let zsum = 0;
    const parts = {};
    if (avail.cla) {
      const z = shrinkZ(robustZ(-c.cla, cohort.cla.map(x => -x)), c.n, K.cla);
      parts.cla = z; zsum += rd.weights.cla * z;
    }
    if (avail.calib) {
      const pen = -(c.ece + (c.fls && isFinite(c.fls.beta) ? Math.abs(c.fls.beta - 1) * 0.05 : 0));
      const z = shrinkZ(robustZ(pen, cohort.calib.map(x => -x)), c.nSettled, K.calib);
      parts.calib = z; zsum += rd.weights.calib * z;
    }
    if (avail.logLoss) {
      const z = shrinkZ(robustZ(-c.logLoss, cohort.logLoss.map(x => -x)), c.nSettled, K.logLoss);
      parts.logLoss = z; zsum += rd.weights.logLoss * z;
    }
    if (avail.brier) {
      const z = shrinkZ(robustZ(-c.brier, cohort.brier.map(x => -x)), c.nSettled, K.brier);
      parts.brier = z; zsum += rd.weights.brier * z;
    }
    return { state: 'rated', score: toScore(zsum), z: zsum, parts,
             weights: rd.weights, dropped: rd.dropped, n: c.n, nSettled: c.nSettled,
             claT: c.claT };
  }

  function use(c, cohort) {
    if (!c) return { state: 'unrated' };
    const avail = { hold: isFinite(c.hold), depth: isFinite(c.depthTier),
                    breadth: isFinite(c.breadth) };
    const rd = redistribute(USE_W, avail);
    if (!rd.ok) return { state: 'unrated' };
    let sc = 0;
    if (avail.hold) sc += rd.weights.hold * holdScore(c.hold);
    if (avail.depth) sc += rd.weights.depth * (100 * clamp(c.depthTier / 5, 0, 1));
    if (avail.breadth) sc += rd.weights.breadth * (100 * clamp(c.breadth, 0, 1));
    return { state: 'rated', score: sc, weights: rd.weights, dropped: rd.dropped };
  }

  /* Two venues whose scores differ by less than 2 PAIRED standard errors are
     a TIE. A non-significant gap must never render as a rank. */
  function isTie(a, b) {
    if (!a || !b || !isFinite(a.cla) || !isFinite(b.cla)) return true;
    const se = Math.sqrt(a.claSE * a.claSE + b.claSE * b.claSE);
    if (!(se > 0)) return true;
    return Math.abs(a.cla - b.cla) / se < 2;
  }

  /* Rank on CLA ascending (lower deviation from the closing consensus is
     better), collapsing non-significant adjacent gaps into shared ranks.
     Unrated venues never rank above a rated one regardless of score. */
  function rank(rows) {
    const rated = rows.filter(r => r.comp && r.comp.n >= N_GATE.cla)
                      .sort((a, b) => a.comp.cla - b.comp.cla);
    const unrated = rows.filter(r => !(r.comp && r.comp.n >= N_GATE.cla));
    /* Tie groups must be anchored, not chained. Comparing each row only with
       its immediate predecessor makes ties transitive -- A ties B, B ties C,
       so A and C land in the same band even when they are plainly
       distinguishable. A group therefore extends only while the row still
       ties the group's FIRST member. */
    let anchor = null, rk = 0;
    rated.forEach((r, i) => {
      if (i === 0 || !isTie(anchor.comp, r.comp)) { anchor = r; rk = i + 1; r.tiedWithPrev = false; }
      else r.tiedWithPrev = true;
      r.rank = rk;
    });
    unrated.forEach(r => { r.rank = null; r.state = 'unrated'; });
    return { rated, unrated };
  }
  return { components, sharp, use, isTie, rank, eceAdjusted, flsFit, robustZ,
           toScore, shrinkZ, holdScore, redistribute,
           SHARP_W, USE_W, N_GATE, K, TIER_PRIOR };
})();

    spread:    { label:'SPREAD',    sides:['home','away'], push:true  },
    total:     { label:'TOTAL',     sides:['over','under'],push:true  },
